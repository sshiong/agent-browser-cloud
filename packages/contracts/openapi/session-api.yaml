        - updatedAt
      properties:
        taskId:
          type: string
          pattern: "^agt_[a-zA-Z0-9]{16,}$"
        sessionId:
          type: string
        goal:
          type: string
          description: Data-minimized goal; secrets, email and phone patterns are redacted.
        state:
          type: string
          enum:
            - PLANNED
            - AWAITING_CONFIRMATION
            - BLOCKED
            - RUNNING
            - WAITING_FOR_HUMAN
            - COMPLETED
            - FAILED
        riskClass:
          $ref: "#/components/schemas/AgentRiskClass"
        intentDecision:
          type: string
          enum: [ALLOWED, CONFIRM_REQUIRED, FORBIDDEN]
        blockedReason:
          type: [string, "null"]
        agentPolicy:
          $ref: "#/components/schemas/AgentPolicy"
          description: Session policy bound when this task plan was created. Old Control Planes may omit it during rolling upgrades.
        currentStep:
          type: integer
          minimum: 0
        totalSteps:
          type: integer
          minimum: 0
        replanCount:
          type: integer
          minimum: 0
        stepExecution:
          $ref: "#/components/schemas/AgentStepExecution"
        confirmation:
          $ref: "#/components/schemas/AgentConfirmation"
        humanHandoff:
          $ref: "#/components/schemas/AgentHumanHandoff"
        allowedDomains:
          type: array
          items:
            type: string
        plan:
          $ref: "#/components/schemas/AgentPlan"
        operationId:
          type: [string, "null"]
        executionResults:
          type: array
          items:
            $ref: "#/components/schemas/AgentToolExecutionResult"
        lastError:
          type: [string, "null"]
        securityEvents:
          type: array
          items:
            $ref: "#/components/schemas/PromptSecurityEvent"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentStepExecution:
