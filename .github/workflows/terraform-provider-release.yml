name: terraform-provider-release

on:
  push:
    tags:
      - "terraform-provider-v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-sign-attest-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy/terraform/provider
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.25.x"
          cache-dependency-path: deploy/terraform/provider/go.sum

      - name: Validate immutable Provider version tag
        shell: bash
        run: |
          set -euo pipefail
          expected="terraform-provider-v$(tr -d '\r\n' < VERSION)"
          test "${GITHUB_REF_NAME}" = "${expected}"
          git tag --points-at HEAD --list "${expected}" | grep -Fx "${expected}"
          printf 'PROVIDER_VERSION=%s\n' "$(tr -d '\r\n' < VERSION)" >>"${GITHUB_ENV}"

      - name: Verify Provider source and protocol schema
        run: |
          go test ./...
          go vet ./...

      - name: Import Terraform Registry signing identity
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd
        with:
          gpg_private_key: ${{ secrets.TERRAFORM_PROVIDER_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.TERRAFORM_PROVIDER_GPG_PASSPHRASE }}

      - name: Cross-build and sign checksums
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: v2.17.1
          # GoReleaser OSS only parses plain SemVer tags. This monorepo validates its
          # component-prefixed tag above and supplies the exact artifact version via VERSION.
          args: release --clean --skip=validate
          workdir: deploy/terraform/provider
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          PROVIDER_VERSION: ${{ env.PROVIDER_VERSION }}

      - name: Attest Provider archives and signed checksum
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4
        with:
          subject-path: |
            deploy/terraform/provider/dist/*.zip
            deploy/terraform/provider/dist/*_SHA256SUMS
            deploy/terraform/provider/dist/*_SHA256SUMS.sig

      - name: Publish immutable GitHub Provider release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: deploy/terraform/provider
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip \
            dist/*_SHA256SUMS \
            dist/*_SHA256SUMS.sig \
            --verify-tag \
            --generate-notes \
            --title "Agent Browser Cloud Terraform Provider ${GITHUB_REF_NAME#terraform-provider-v}"
