      required:
        - name
        - providerId
        - expectedExitIp
        - enabled
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 96
        description:
          type: [string, "null"]
          maxLength: 512
        providerId:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,128}$"
        region:
          type: [string, "null"]
          pattern: "^[a-z0-9-]{1,32}$"
        expectedExitIp:
          type: string
          minLength: 1
          maxLength: 128
