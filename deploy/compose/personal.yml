# L1 Personal: Single-host managed tier.
#
# Uses deploy/compose/modular.yml + deploy/compose/low-memory.yml defaults:
# - Core managed stack (Control Plane tuned to -Xmx384m, PostgreSQL, Redis 48M, Storage Helper,
#   Browser Node headless `core` image by default, Web Console).
# - Optional profiles: --profile mcp, --profile workers.
# - Switch Browser Node image tier via BROWSER_NODE_TARGET=core|desktop|vision.
#
# Usage:
#   docker compose -f deploy/compose/modular.yml -f deploy/compose/low-memory.yml \
#     -f deploy/compose/personal.yml --profile web --profile mcp up -d --build

services:
  control-plane:
    mem_limit: ${CONTROL_PLANE_MEM_LIMIT:-512m}
    environment:
      JAVA_OPTS: ${CONTROL_PLANE_JAVA_OPTS:--Xms128m -Xmx384m -XX:MaxMetaspaceSize=160m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-6}
      DATABASE_POOL_MIN_IDLE: ${DATABASE_POOL_MIN_IDLE:-1}

  browser-node:
    build:
      target: ${BROWSER_NODE_TARGET:-core}

  browser-storage-init:
    build:
      target: ${BROWSER_NODE_TARGET:-core}

  storage-helper:
    build:
      target: ${BROWSER_NODE_TARGET:-core}
