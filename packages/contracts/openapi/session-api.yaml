          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileExportGrantRequest"
      responses:
        "201":
          description: Purpose-bound export grant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileExportGrant"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
