apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-control-plane
  namespace: browsercloud-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-control-plane
    spec:
      containers:
        - name: mock-control-plane
          image: agent-browser-cloud/mock-control-plane:kind
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            appArmorProfile:
              type: RuntimeDefault
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mock-control-plane
  namespace: browsercloud-system
spec:
  selector:
    app.kubernetes.io/name: mock-control-plane
  ports:
    - name: http
      port: 8080
      targetPort: http
