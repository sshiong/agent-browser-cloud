syntax = "proto3";

package browsercloud.node.v1;

option java_package = "io.browsercloud.proto.node.v1";
option java_multiple_files = true;

// Browser Node 的最小控制面 RPC。Session API 通过 Outbox 异步投递命令；
// Runtime 状态以 NodeEventService 成功提交的版本化事件为准。
service NodeControlService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Dispatch(DispatchRequest) returns (DispatchResponse);
  // mTLS-authenticated cold probe for an enabled Binding that has no active Session allocation.
  // credential_ref remains opaque: only the isolated Network Helper may resolve it to a locally
  // configured Provider route, and neither request nor response contains credential material.
  rpc ProbeProxyBinding(ProbeProxyBindingRequest) returns (ProbeProxyBindingResponse);
  // mTLS-authenticated, bounded Profile archive ingress. The Control Plane
  // streams bytes without durable business persistence; the Node delegates validation and
  // checkpoint/object-store commit to the isolated Storage Helper.
  rpc UploadProfileImport(stream UploadProfileImportRequest) returns (UploadProfileImportResponse);
  // Purpose-bound evidence access. The Browser Node delegates signing to the isolated
  // Storage Helper and never returns Object Storage credentials.
  rpc PresignEvidenceDownload(PresignEvidenceDownloadRequest)
      returns (PresignEvidenceDownloadResponse);
  // Purpose-bound Profile export. The Node delegates commit-marker and archive-integrity
  // verification plus short-lived signing to the isolated Storage Helper.
  rpc PresignProfileExportDownload(PresignProfileExportDownloadRequest)
      returns (PresignProfileExportDownloadResponse);
}

// Browser Node 将命令执行结果作为版本化事件回传给 Control Plane。
// Control Plane 只有在 Inbox 去重和 Coordinator 状态提交成功后才确认事件。
service NodeEventService {
  rpc Publish(PublishRequest) returns (PublishResponse);
  // mTLS-authenticated Browser Node registration and live PSI heartbeat.
  rpc ReportCapacity(ReportCapacityRequest) returns (ReportCapacityResponse);
  // Five-second, Session-scoped runtime telemetry. Values are measured by the
  // owning Browser Node and are rejected if the current Placement does not match.
  rpc ReportSessionResources(ReportSessionResourcesRequest)
      returns (ReportSessionResourcesResponse);
}

message PingRequest {
  string caller_id = 1;
}

message PingResponse {
  string node_id = 1;
  string service_version = 2;
  int64 unix_time_ms = 3;
}

message CommandAck {
  string message_id = 1;
  bool accepted = 2;
  bool duplicate = 3;
  string error_code = 4;
  string error_message = 5;
}

message DispatchRequest {
  CommandEnvelope command = 1;
}

message DispatchResponse {
  CommandAck acknowledgement = 1;
}

message ProbeProxyBindingRequest {
  string probe_id = 1;
  string tenant_id = 2;
  string binding_profile_id = 3;
  string provider_id = 4;
  string expected_exit_ip = 5;
  string credential_ref = 6;
}

message ProbeProxyBindingResponse {
  string probe_id = 1;
  string binding_profile_id = 2;
  string node_id = 3;
  bool succeeded = 4;
  uint32 latency_ms = 5;
  optional string observed_exit_ip = 6;
  string error_code = 7;
}

message UploadProfileImportRequest {
  string import_id = 1;
  string tenant_id = 2;
  string profile_id = 3;
  string checkpoint_id = 4;
  string runtime_build_id = 5;
  string archive_sha256 = 6;
  uint64 archive_size_bytes = 7;
  uint64 offset = 8;
  bytes data = 9;
}

message UploadProfileImportResponse {
  string import_id = 1;
  string node_id = 2;
  string profile_id = 3;
  string checkpoint_id = 4;
  uint64 checkpoint_epoch = 5;
  uint64 profile_write_epoch = 6;
  uint64 core_size_bytes = 7;
  uint64 checkpoint_file_count = 8;
  string archive_sha256 = 9;
  uint64 archive_size_bytes = 10;
}

message PresignEvidenceDownloadRequest {
  string grant_id = 1;
  string tenant_id = 2;
  string profile_id = 3;
  string session_id = 4;
  string evidence_id = 5;
  string content_sha256 = 6;
  uint64 content_bytes = 7;
  uint32 expires_in_seconds = 8;
}

message PresignEvidenceDownloadResponse {
  string grant_id = 1;
  string node_id = 2;
  string evidence_id = 3;
  string download_url = 4;
  int64 expires_at_ms = 5;
}

message PresignProfileExportDownloadRequest {
  string grant_id = 1;
  string tenant_id = 2;
  string profile_id = 3;
  string checkpoint_id = 4;
  uint32 expires_in_seconds = 5;
}

message PresignProfileExportDownloadResponse {
  string grant_id = 1;
  string node_id = 2;
  string profile_id = 3;
  string checkpoint_id = 4;
  string archive_sha256 = 5;
  uint64 archive_size_bytes = 6;
  string download_url = 7;
  int64 expires_at_ms = 8;
}

message PublishRequest {
  EventEnvelope event = 1;
}

message PublishResponse {
  string event_id = 1;
  bool accepted = 2;
  bool duplicate = 3;
  string error_code = 4;
  string error_message = 5;
}

message ReportCapacityRequest {
  string node_id = 1;
  string region = 2;
  string grpc_target = 3;
  uint32 certified_cpu_millis = 4;
  uint32 certified_memory_mib = 5;
  uint32 certified_pid_count = 6;
  uint32 certified_gpu_slots = 7;
  uint32 safety_margin_percent = 8;
  uint32 max_sessions = 9;
  bool supports_desktop = 10;
  bool supports_gpu = 11;
  bool supports_native_os = 12;
  bool isolation_capable = 13;
  map<string, string> labels = 14;
  uint32 certified_media_slots = 15;
  bool supports_media = 16;
  double memory_psi_some_avg10 = 20;
  double memory_psi_full_avg10 = 21;
  double cpu_psi_some_avg10 = 22;
  double io_psi_full_avg10 = 23;
  string pressure_reason = 24;
}

message ReportCapacityResponse {
  string node_id = 1;
  bool accepted = 2;
  string admission_state = 3;
  string pressure_state = 4;
  string error_code = 5;
  string error_message = 6;
}

message ReportSessionResourcesRequest {
  string node_id = 1;
  string tenant_id = 2;
  string session_id = 3;
  int64 context_epoch = 4;
  int64 observed_at_ms = 5;

  optional double cpu_percent = 10;
  optional uint64 memory_rss_mib = 11;
  optional double memory_psi_some_avg10 = 12;
  optional uint32 renderer_count = 13;
  optional uint32 tab_count = 14;
  optional uint32 main_thread_blocked_ms = 15;
  optional uint32 agent_action_latency_ms = 16;
  optional uint32 state_diff_queue_depth = 17;
  optional uint64 profile_io_bytes_per_second = 18;
  optional double extension_cpu_percent = 19;
  optional uint64 extension_memory_mib = 20;
  optional uint32 remote_desktop_frame_age_ms = 21;
  optional double media_encoder_percent = 22;
  string danger_event = 23;
  optional bool input_active = 24;
  optional bool active_drag = 25;
  optional uint32 pressed_key_count = 26;
  optional uint32 pressed_button_count = 27;
  // 持续 CDP Browser/Network 观察器的活动计数。三项必须同时出现；
  // 缺失表示观察器尚未形成可信快照，Control Plane 必须按能力标签 fail-closed。
  optional uint32 active_upload_count = 28;
  optional uint32 active_download_count = 29;
  optional uint32 active_form_submission_count = 30;
  // Credential-free active exit observation. The Network Helper performs the request through the
  // already-bound Provider route; the Node Agent only reports the bounded result. All four fields
  // are additive so an N-1 Control Plane safely ignores them during rolling upgrades.
  optional bool proxy_probe_succeeded = 31;
  optional uint32 proxy_probe_latency_ms = 32;
  optional string proxy_observed_exit_ip = 33;
  string proxy_probe_error_code = 34;
  // Browser-side transaction heuristics derived only from CDP request metadata. The three fields
  // form an additive capability group and must appear together. URLs and request bodies are never
  // transmitted; the Control Plane persists only bounded active counters.
  optional uint32 active_spa_mutation_count = 35;
  optional uint32 active_payment_or_security_count = 36;
  optional uint32 active_critical_transaction_count = 37;

  // Node 读取运行时实际已生效配置，而不是回显最后一条命令。整组字段必须同时出现；
  // Control Plane 用该快照恢复永久丢失的资源调整 ACK，并检测 PostgreSQL/Node 漂移。
  // 字段保持 additive，N-1 Node 缺失整组时 Control Plane 仅跳过 Readback 对账。
  optional string actual_resource_class = 40;
  optional uint32 actual_cpu_millis = 41;
  optional uint32 actual_memory_request_mib = 42;
  optional uint32 actual_memory_limit_mib = 43;
  optional uint32 actual_pid_limit = 44;
  optional uint32 actual_tab_budget = 45;
  optional uint32 actual_state_collector_budget_percent = 46;
  optional uint32 actual_remote_desktop_bitrate_kbps = 47;
  optional uint32 actual_extension_cpu_weight = 48;
  optional uint32 actual_media_encoder_slots = 49;
  optional bool actual_freeze_background_tabs = 50;
  optional bool actual_block_new_tabs = 51;
  ExtensionBackgroundPolicy actual_extension_background_policy = 52;
  optional uint32 actual_success_trace_sample_percent = 53;
  optional uint32 actual_observer_frame_rate_fps = 54;
  optional bool actual_video_recording_enabled = 55;
  optional uint32 actual_success_screenshot_sample_percent = 56;
}

message ReportSessionResourcesResponse {
  string session_id = 1;
  bool accepted = 2;
  string error_code = 3;
  string error_message = 4;
}

// 命令信封
message CommandEnvelope {
  string message_id = 1;
  string command_type = 2;
  string tenant_id = 3;
  string session_id = 4;

  // 版本控制
  int64 coordinator_term = 10;
  int64 context_epoch = 11;
  int64 operation_epoch = 12;
  // PostgreSQL authoritative route fencing. Zero is accepted only during N/N-1 rollout.
  int64 route_epoch = 13;
  int32 coordinator_shard_id = 14;

  // 幂等
  string idempotency_key = 20;
  bytes payload = 21;
}

// 事件信封
message EventEnvelope {
  string event_id = 1;
  string event_type = 2;
  string tenant_id = 3;
  string session_id = 4;

  // 版本控制
  int64 coordinator_term = 10;
  int64 context_epoch = 11;
  int64 operation_epoch = 12;
  int64 sequence = 13;

  bytes payload = 20;
}

// 启动 Runtime 命令
message StartRuntimeCommand {
  string session_id = 1;
  string runtime_build_id = 2;
  string profile_id = 3;
  string display = 4;
  int32 cdp_port = 5;
  string proxy_binding_id = 6;
  string resource_class = 7;
  uint32 cpu_millis = 8;
  uint32 memory_request_mib = 9;
  uint32 memory_limit_mib = 10;
  uint32 pid_limit = 11;
  uint32 tab_budget = 12;
  bool desktop_required = 13;
  bool gpu_required = 14;
  bool native_os_required = 15;
  bool isolation_required = 16;
  string profile_checkpoint_id = 17;
  // N-1 Node 不识别时安全忽略；缺失表示使用 Node 安全默认值。
  optional uint32 state_collector_budget_percent = 18;
  optional uint32 remote_desktop_bitrate_kbps = 19;
  // 仅传递已由 Control Plane 接纳、并由 Node 从可信目录解析的扩展标识。
  repeated string extension_ids = 20;
  // cgroup v2 cpu.weight，N-1 Node 会安全忽略。
  optional uint32 extension_cpu_weight = 21;
  // 当前可用的编码并发 Slot；与 Placement 预留上限分离。
  optional uint32 media_encoder_slots = 22;
  optional bool freeze_background_tabs = 23;
  optional bool block_new_tabs = 24;
  // 只有 Control Plane 已确认非特权的 Extension 才会出现在此策略中。
  ExtensionBackgroundPolicy extension_background_policy = 25;
  // 只作用于可丢弃的成功命令 Trace；失败、Crash、Audit、Operation 和 Billing 不采样。
  optional uint32 success_trace_sample_percent = 26;
  // 受控 Observer/VNC Server → Client 转发上限；无桌面为 0，有桌面为 1..60。
  optional uint32 observer_frame_rate_fps = 27;
  // 独立于 Observer 的 CDP Pixel Recording；缺失表示关闭。
  optional bool video_recording_enabled = 28;
  // 成功 Agent 动作的截图证据采样率；失败证据不受此字段影响并始终尝试捕获。
  optional uint32 success_screenshot_sample_percent = 29;
  // Control Plane 已提交的 Browser 世代下界；跨 Node 恢复必须从更大世代启动。
  // N-1 Node 不识别时安全忽略，但不得用于跨 Node 迁移目标。
  uint64 minimum_browser_generation = 30;
  // 以下字段都是非 Secret 绑定描述。credential_ref 仅是不透明引用，Network Helper
  // 只可将它映射到本机已配置的 Provider Route；Node Agent 不得读取 Secret 正文。
  optional string proxy_provider_id = 31;
  optional string proxy_expected_exit_ip = 32;
  optional string proxy_credential_ref = 33;
  // Exact-version, approved Application Recovery Contract Site Policy. Only normalized URL-path
  // prefixes are transmitted. The Node validates the bounded rules and canonical SHA-256 before
  // observing CDP request metadata; full URLs and request content never leave the Node.
  repeated string browser_transaction_expected_origins = 34;
  repeated string payment_security_route_prefixes = 35;
  repeated string critical_transaction_route_prefixes = 36;
  string browser_transaction_policy_hash = 37;
  uint64 browser_transaction_policy_version = 38;
}

// Runtime 启动事件
message RuntimeStartedEvent {
  string session_id = 1;
  uint32 pid = 2;
  uint64 browser_generation = 3;
  string cdp_endpoint = 4;
  string node_id = 5;
  string runtime_build_id = 6;
  string proxy_binding_id = 7;
  string exit_ip = 8;
  string exit_country = 9;
  string exit_asn = 10;
}

// 停止 Runtime 命令
message StopRuntimeCommand {
  string session_id = 1;
  string reason = 2;
}

// Runtime 停止事件
message RuntimeStoppedEvent {
  string session_id = 1;
  string reason = 2;
  int32 exit_code = 3;
  string profile_id = 4;
  string checkpoint_id = 5;
  uint64 checkpoint_epoch = 6;
  uint64 profile_write_epoch = 7;
  uint64 core_size_bytes = 8;
  uint64 checkpoint_file_count = 9;
  string restore_status = 10;
}

// A committed, transaction-barriered Profile delta written to Region Warm Tier. The Browser Node
// publishes this only after the isolated Storage Helper has atomically installed the manifest and
// COMMITTED marker. No Profile bytes or storage credentials cross this event boundary.
message ProfileWarmTierSyncedEvent {
  string session_id = 1;
  string node_id = 2;
  string profile_id = 3;
  uint64 profile_write_epoch = 4;
  uint64 journal_sequence = 5;
  string transaction_barrier = 6;
  uint64 changed_file_count = 7;
  uint64 deleted_file_count = 8;
  uint64 reused_chunk_count = 9;
  uint64 uploaded_bytes = 10;
  uint64 deferred_group_count = 11;
  string manifest_sha256 = 12;
  int64 committed_at_ms = 13;
}

// 对运行中的 Runtime 执行同节点资源调整。资源调整只由 Control Plane 发起。
message AdjustRuntimeResourcesCommand {
  string session_id = 1;
  string resource_class = 2;
  uint32 cpu_millis = 3;
  uint32 memory_request_mib = 4;
  uint32 memory_limit_mib = 5;
  uint32 pid_limit = 6;
  uint32 tab_budget = 7;
  string reason = 8;
  bool desktop_required = 9;
  bool gpu_required = 10;
  bool native_os_required = 11;
  bool isolation_required = 12;
  // optional 保证 N/N-1 滚动升级：缺失时保持当前非 Cgroup 配置。
  optional uint32 state_collector_budget_percent = 13;
  optional uint32 remote_desktop_bitrate_kbps = 14;
  // 只调整 Extension 子 cgroup 权重，不改变运行中的扩展集合。
  optional uint32 extension_cpu_weight = 15;
  // 只调整 Media Encoder 子 cgroup 的当前 Slot，不改变 Placement 预留上限。
  optional uint32 media_encoder_slots = 16;
  // 资源达到上限时冻结后台 Page Target；Node 必须通过 CDP 执行成功后才 ACK。
  optional bool freeze_background_tabs = 17;
  // 以命令执行时的 Page Target 为允许集合，持续关闭之后新建的 Page Target。
  optional bool block_new_tabs = 18;
  ExtensionBackgroundPolicy extension_background_policy = 19;
  // 当前 Runtime 已加载的可信扩展集合，用于 Node 校验暂停策略不能越权。
  repeated string extension_ids = 20;
  // 1..100；缺失时保持当前值，以支持 N/N-1 滚动升级。
  optional uint32 success_trace_sample_percent = 21;
  // 0 表示无桌面；有桌面时 1..60。缺失时保持当前值。
  optional uint32 observer_frame_rate_fps = 22;
  // Node 必须等待真实 CDP start/stop 与 Storage Helper 提交完成后才 ACK。
  optional bool video_recording_enabled = 23;
  // 1..100；仅控制成功动作截图，失败证据保持强制捕获。
  optional uint32 success_screenshot_sample_percent = 24;
}

// Browser Node 通过各 Extension background/service-worker Target 的 Debugger
// pause/resume 执行，避免直接卸载扩展或修改扩展集合。
message ExtensionBackgroundPolicy {
  repeated string paused_extension_ids = 1;
}

// Node 完成 cgroup 调整后返回的权威确认；Control Plane 收到前不得更新当前分配。
message RuntimeResourcesAdjustedEvent {
  string session_id = 1;
  string node_id = 2;
  string old_resource_class = 3;
  uint32 old_cpu_millis = 4;
  uint32 old_memory_request_mib = 5;
  uint32 old_memory_limit_mib = 6;
  uint32 old_pid_limit = 7;
  uint32 old_tab_budget = 8;
  string new_resource_class = 9;
  uint32 new_cpu_millis = 10;
  uint32 new_memory_request_mib = 11;
  uint32 new_memory_limit_mib = 12;
  uint32 new_pid_limit = 13;
  uint32 new_tab_budget = 14;
  string reason = 15;
  string operation_id = 16;
  // N-1 Node 不会上报这些字段；Control Plane 此时只提交已确认的 Cgroup 调整。
  optional uint32 old_state_collector_budget_percent = 17;
  optional uint32 old_remote_desktop_bitrate_kbps = 18;
  optional uint32 new_state_collector_budget_percent = 19;
  optional uint32 new_remote_desktop_bitrate_kbps = 20;
  optional uint32 old_extension_cpu_weight = 21;
  optional uint32 new_extension_cpu_weight = 22;
  optional uint32 old_media_encoder_slots = 23;
  optional uint32 new_media_encoder_slots = 24;
  optional bool old_freeze_background_tabs = 25;
  optional bool new_freeze_background_tabs = 26;
  optional bool old_block_new_tabs = 27;
  optional bool new_block_new_tabs = 28;
  ExtensionBackgroundPolicy old_extension_background_policy = 29;
  ExtensionBackgroundPolicy new_extension_background_policy = 30;
  optional uint32 old_success_trace_sample_percent = 31;
  optional uint32 new_success_trace_sample_percent = 32;
  optional uint32 old_observer_frame_rate_fps = 33;
  optional uint32 new_observer_frame_rate_fps = 34;
  optional bool old_video_recording_enabled = 35;
  optional bool new_video_recording_enabled = 36;
  optional uint32 old_success_screenshot_sample_percent = 37;
  optional uint32 new_success_screenshot_sample_percent = 38;
}

// Browser Crash 事件
message BrowserCrashEvent {
  string session_id = 1;
  string crash_type = 2;
  string reason = 3;
  int64 detected_at_ms = 4;
}

// 释放所有输入命令
message ReleaseAllInputCommand {
  string session_id = 1;
  string reason = 2;
}

message BeginHumanTakeoverCommand {
  string session_id = 1;
  string user_id = 2;
}

message EndHumanTakeoverCommand {
  string session_id = 1;
  string user_id = 2;
}

message HumanTakeoverReadyEvent {
  string session_id = 1;
  string user_id = 2;
  BrowserStateEvent state = 3;
}

message HumanTakeoverEndedEvent {
  string session_id = 1;
  string user_id = 2;
  BrowserStateEvent state = 3;
  // USER_RELEASE 表示显式结束；GATEWAY_DISCONNECT 表示远程桌面数据面断线。
  string reason = 4;
}

// Revoke exactly one remote desktop participant. This command is independent from Agent and
// HumanTakeover operations; it must never release another participant or stop the Browser.
message RevokeRemoteDesktopConnectionCommand {
  string session_id = 1;
  string connection_id = 2;
  string reason = 3;
  string revoked_by = 4;
}

// Authoritative remote desktop connection lifecycle emitted by the Browser Node. CONNECTED and
// DISCONNECTED originate from the WebSocket gateway; REVOKED is the acknowledgement of an exact
// administrator command. Actor/access fields may be empty only for an already-gone revocation.
message RemoteDesktopParticipantEvent {
  string session_id = 1;
  string connection_id = 2;
  string actor_id = 3;
  string access_mode = 4;
  bool view_only = 5;
  string state = 6;
  string reason = 7;
  int64 observed_at_ms = 8;
  string revoked_by = 9;
  // Monotonic counters for this exact connection. Replayed or duplicated events must be merged
  // by maximum value, never summed blindly. N-1 Control Planes safely ignore these fields.
  uint64 forwarded_bytes = 10;
  uint64 quota_wait_millis = 11;
  uint64 throttled_batches = 12;
}

// 单个有序输入命令。每个 CommandEnvelope 只承载一个动作，便于幂等重放。
message ExecuteInputCommand {
  string session_id = 1;
  uint64 sequence = 2;
  oneof action {
    MouseMoveInput mouse_move = 10;
    MouseButtonInput mouse_down = 11;
    MouseButtonInput mouse_up = 12;
    KeyInput key_down = 13;
    KeyInput key_up = 14;
  }
}

message MouseMoveInput {
  int32 x = 1;
  int32 y = 2;
}

message MouseButtonInput {
  uint32 button = 1;
}

message KeyInput {
  string key = 1;
}

message BrowserStateEvent {
  string session_id = 1;
  uint64 state_version = 2;
  uint64 target_revision = 3;
  string url = 4;
  string title = 5;
  string state_quality = 6;
  string content_hash = 7;
  repeated InteractiveTargetState targets = 8;
  // PERIODIC 或 FULL_RESYNC；原生 REGION_RESYNC 使用 BrowserStateDiffEvent。
  string snapshot_kind = 9;
  string requested_root_ref = 10;
  // 由 Runtime.evaluate 读取的 document.readyState；旧 Node 为空。
  string document_ready_state = 11;
  // 自最近一次 CDP Network 活动结束后的安静时长；存在在途请求时为 0。
  uint64 network_quiet_millis = 12;
  // 仅当本 Runtime 代持续 Network 观察从未断线时为 true。
  bool network_evidence_fresh = 13;
}

// 显式 FULL Resync 的有界流式传输。Begin 声明不可变清单，Chunk 只承载状态
// protobuf 字节，Commit 允许 Control Plane 在校验全部分块和整流 SHA-256 后原子发布。
// 周期 State 和 Agent 动作确认仍使用 BrowserStateUpdated，保持 N/N-1 兼容。
message BrowserStateSnapshotBeginEvent {
  string session_id = 1;
  string snapshot_id = 2;
  uint64 state_version = 3;
  uint64 target_revision = 4;
  uint32 total_chunks = 5;
  uint64 total_bytes = 6;
  string payload_sha256 = 7;
  string snapshot_kind = 8;
  // Browser Runtime cgroup 在本次采集期间的累计 CPU 时间增量；无委派 cgroup 的
  // N-1/本地 Node 留空，Control Plane 保留准入时的保守预留。
  optional uint64 collection_cpu_millis = 9;
}

message BrowserStateSnapshotChunkEvent {
  string session_id = 1;
  string snapshot_id = 2;
  uint32 chunk_index = 3;
  uint32 total_chunks = 4;
  bytes data = 5;
  string chunk_sha256 = 6;
}

message BrowserStateSnapshotCommitEvent {
  string session_id = 1;
  string snapshot_id = 2;
  uint32 total_chunks = 3;
  uint64 total_bytes = 4;
  string payload_sha256 = 5;
}

// Control Plane 请求重建 State。REGION 在首版无法安全裁剪时必须显式回退 FULL。
message RequestStateResyncCommand {
  string session_id = 1;
  string mode = 2;
  string root_ref = 3;
  string reason = 4;
}

// 由 Control Plane Agent Executor 授权并通过 Exclusive Operation 投递的导航命令。
// Capability Token 只在 Control Plane 内消费，绝不下发到 Browser Node。
message AgentNavigateCommand {
  string session_id = 1;
  string task_id = 2;
  string step_id = 3;
  string url = 4;
  uint64 base_state_version = 5;
}

// Business Recovery 只允许 Control Plane 从版本化应用契约解析出的低风险动作。
// target_url 对 RELOAD / REFRESH_SESSION / RESTART_EXTENSION 为空；
// 导航动作必须是契约内规范化 URL；extension_id 只允许契约绑定的 Chromium ID。
message BusinessRecoveryActionCommand {
  string session_id = 1;
  string action_id = 2;
  string action = 3;
  string target_url = 4;
  uint64 base_state_version = 5;
  string extension_id = 6;
}

message AgentNavigationFailedEvent {
  string session_id = 1;
  string task_id = 2;
  string step_id = 3;
  string error_code = 4;
}

// 受限 Agent Target/Input 命令。sealed_text 在 Outbox 中保持加密，
// Dispatcher 只在发送前解封到 text；Node 从不接受任意 CDP/Shell 指令。
message AgentActionCommand {
  string session_id = 1;
  string task_id = 2;
  string step_id = 3;
  string tool_id = 4;
  string target_ref = 5;
  uint64 target_revision = 6;
  string sealed_text = 7;
  string text = 8;
  int32 scroll_delta_y = 9;
  string wait_condition = 10;
  uint32 timeout_ms = 11;
  uint64 base_state_version = 12;
  string base_content_hash = 13;
  // Additive N/N-1 field. True only for an AUTONOMOUS, purpose-bound credential/OTP Step.
  bool allow_sensitive_target = 14;
  // Browser-local bounded retry budget. Old Nodes default to zero and remain fail-closed.
  uint32 maximum_attempts = 15;
}

message AgentActionFailedEvent {
  string session_id = 1;
  string task_id = 2;
  string step_id = 3;
  string tool_id = 4;
  string error_code = 5;
}

// User-authorized single-use click bound to a current Challenge Event and visual target anchor.
// The Browser Node never accepts text, coordinates without a target_ref, multiple actions, or an
// automatic retry budget through this command.
message HumanAssistClickCommand {
  string session_id = 1;
  string challenge_event_id = 2;
  string intent_id = 3;
  string target_ref = 4;
  uint64 target_revision = 5;
  uint64 base_state_version = 6;
  string base_content_hash = 7;
  uint32 allowed_action_count = 8;
  double expected_x = 9;
  double expected_y = 10;
  double expected_width = 11;
  double expected_height = 12;
  string visual_anchor_hash = 13;
}

message HumanAssistFailedEvent {
  string session_id = 1;
  string challenge_event_id = 2;
  string intent_id = 3;
  string error_code = 4;
}

// Model-proposed, policy-bounded visual action. Coordinates are normalized to the current
// viewport and are revalidated by the Node immediately before input. No text or secret is allowed.
message ChallengeVisualAction {
  string action_type = 1;
  double x = 2;
  double y = 3;
  double end_x = 4;
  double end_y = 5;
  uint32 repeat_count = 6;
}

message ChallengeAutomationActionCommand {
  string session_id = 1;
  string run_id = 2;
  string job_id = 3;
  string challenge_event_id = 4;
  uint32 attempt_number = 5;
  uint64 base_state_version = 6;
  string base_content_hash = 7;
  repeated ChallengeVisualAction actions = 8;
}

message ChallengeAutomationFailedEvent {
  string session_id = 1;
  string run_id = 2;
  string job_id = 3;
  string challenge_event_id = 4;
  uint32 attempt_number = 5;
  string error_code = 6;
}

// Administrator-requested, read-only Observer screenshot. The request contains no arbitrary CDP
// method or Object Storage coordinate.
message CaptureObserverScreenshotCommand {
  string session_id = 1;
  string capture_id = 2;
}

// Agent 动作完成后由独立 CDP 截图数据面产生。对象由 Storage Helper 提交，
// Node 不持有 Bucket 凭据；失败事件也会持久化，避免把缺失证据伪装成成功。
message SessionEvidenceCapturedEvent {
  string session_id = 1;
  string evidence_id = 2;
  string evidence_kind = 3;
  string task_id = 4;
  string step_id = 5;
  string command_id = 6;
  string content_sha256 = 7;
  uint64 content_bytes = 8;
  string object_key = 9;
  int64 captured_at_ms = 10;
  bool mandatory = 11;
  string result = 12;
  string error_code = 13;
  // MASKED or NOT_REQUIRED for newly committed evidence; FAILED_CLOSED on capture failure.
  // Empty is reserved for N-1 Nodes and is persisted as LEGACY_UNVERIFIED.
  string redaction_state = 14;
  uint32 redacted_region_count = 15;
}

// Emitted only after Storage Helper has committed the immutable recording manifest. The event
// carries bounded metadata and hashes, never frame bytes or storage credentials.
message SessionRecordingFinalizedEvent {
  string session_id = 1;
  string recording_id = 2;
  uint64 segment_count = 3;
  uint64 frame_count = 4;
  uint64 dropped_frames = 5;
  uint64 redacted_frame_count = 6;
  uint64 redacted_region_count = 7;
  uint32 redaction_policy_version = 8;
  string manifest_object_key = 9;
  string manifest_sha256 = 10;
  uint64 manifest_bytes = 11;
  int64 started_at_ms = 12;
  int64 ended_at_ms = 13;
  string node_id = 14;
}

message BrowserStateDiffEvent {
  string session_id = 1;
  uint64 base_state_version = 2;
  uint64 state_version = 3;
  uint64 target_revision = 4;
  string url = 5;
  string title = 6;
  string state_quality = 7;
  string content_hash = 8;
  repeated InteractiveTargetState upserted_targets = 9;
  repeated string removed_target_refs = 10;
  string document_ready_state = 11;
  uint64 network_quiet_millis = 12;
  bool network_evidence_fresh = 13;
  // 空值表示旧版周期 Diff；REGION_RESYNC 表示受 root_ref 约束的原子区域替换。
  string snapshot_kind = 14;
  string requested_root_ref = 15;
  // 仅 REGION_RESYNC 设置；用于关联 State Resync Admission 预留与实际结算。
  // N-1 Node 留空时，Control Plane 只接受可由 evt_cmd_* Event ID 安全恢复的请求 ID。
  string resync_request_id = 16;
  optional uint64 collection_cpu_millis = 17;
}

message DiffTruncatedEvent {
  string session_id = 1;
  string reason = 2;
  uint64 last_good_state_version = 3;
  uint64 current_state_version = 4;
  string affected_root = 5;
  uint64 estimated_targets = 6;
}

message InteractiveTargetState {
  string target_ref = 1;
  string role = 2;
  optional string name = 3;
  optional TargetBounds bounds = 4;
  bool enabled = 5;
  bool visible = 6;
  // Password/OTP 等目标只暴露敏感标志，不暴露名称或值。
  bool sensitive = 7;
}

message TargetBounds {
  double x = 1;
  double y = 2;
  double width = 3;
  double height = 4;
}
