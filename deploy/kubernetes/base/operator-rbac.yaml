apiVersion: v1
kind: ServiceAccount
metadata:
  name: browser-session-operator
  namespace: browsercloud-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: browser-session-operator
rules:
  - apiGroups: [browsercloud.io]
    resources: [browsersessions]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [browsercloud.io]
    resources: [browsersessions/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: browser-session-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: browser-session-operator
subjects:
  - kind: ServiceAccount
    name: browser-session-operator
    namespace: browsercloud-system
