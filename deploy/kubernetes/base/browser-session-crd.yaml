apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: browsersessions.browsercloud.io
spec:
  group: browsercloud.io
  scope: Namespaced
  names:
    plural: browsersessions
    singular: browsersession
    kind: BrowserSession
    shortNames: [bses]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [tenantId, profileId]
              properties:
                tenantId:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{1,128}$"
                profileId:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{1,128}$"
                region:
                  type: string
                  default: local
                executionEnvironment:
                  type: string
                  enum: [SYSTEM_MANAGED, CONTAINER, ENHANCED_SANDBOX, MICROVM, NATIVE_OS]
                  default: SYSTEM_MANAGED
                  description: Execution isolation choice, independent from automatic resources.
                resourcePolicy:
                  type: object
                  default:
                    mode: AUTO
                  required: [mode]
                  properties:
                    mode:
                      type: string
                      enum: [AUTO]
                    onMaximumReached:
                      type: string
                      enum: [PAUSE_AGENT, WAIT_SAFE_POINT_MIGRATE, HIBERNATE, TERMINATE_STRICT]
                      default: PAUSE_AGENT
                    allowMigration:
                      type: boolean
                      default: true
                    allowHibernate:
                      type: boolean
                      default: true
                    blockMigrationDuringHumanTakeover:
                      type: boolean
                      default: true
                    minimumTemplate:
                      type: string
                      enum: [standard-v1, interactive-v1, heavy-v1, native-standard-v1]
                    maximumCpuMillis:
                      type: integer
                      minimum: 500
                      maximum: 32000
                    maximumMemoryMib:
                      type: integer
                      minimum: 512
                      maximum: 131072
                    maximumCostPerHour:
                      type: number
                      minimum: 0
                    scaleUpWindowSeconds:
                      type: integer
                      minimum: 30
                      maximum: 900
                    scaleDownWindowSeconds:
                      type: integer
                      minimum: 300
                      maximum: 86400
                    adjustmentCooldownSeconds:
                      type: integer
                      minimum: 60
                      maximum: 3600
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                sessionId:
                  type: string
                phase:
                  type: string
                lastError:
                  type: string
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Session
          type: string
          jsonPath: .status.sessionId
