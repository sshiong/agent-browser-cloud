name: desktop

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unsigned-build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-14
          - platform: Windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.17.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: |
            apps/web-console/pnpm-lock.yaml
            apps/desktop/pnpm-lock.yaml

      - name: Install shared UI
        run: pnpm --dir apps/web-console install --frozen-lockfile

      - name: Install desktop CLI
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Check native source
        run: cargo fmt --all --check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Test native security boundary
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build unsigned verification binary
        run: pnpm --dir apps/desktop build:unsigned
