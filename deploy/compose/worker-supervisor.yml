# Pure-Rust Unified Worker Supervisor overlay for L1 (Personal) / L2 (Team).
# Replaces 4 separate Python worker containers with ONE Rust Tokio process while
# preserving per-role tokens, concurrency limits, and lease-loss cancellation.
#
# Example:
#   docker compose -f docker-compose.yml -f deploy/compose/personal.yml -f deploy/compose/worker-supervisor.yml up -d worker-supervisor

services:
  worker-supervisor:
    build:
      context: ../..
      dockerfile: apps/browser-node/Dockerfile
      target: worker-supervisor
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://control-plane:8080}
      WORKER_ENVIRONMENT: ${WORKER_ENVIRONMENT:-local}
      WORKER_ROLES: ${WORKER_ROLES:-agent,reviewer,outcome}
      WORKER_READY_FILE: /tmp/worker-ready
      AGENT_CONTROL_PLANE_TOKEN_FILE: ${AGENT_CONTROL_PLANE_TOKEN_FILE:-/run/secrets/agent-worker-token}
      REVIEWER_CONTROL_PLANE_TOKEN_FILE: ${REVIEWER_CONTROL_PLANE_TOKEN_FILE:-/run/secrets/reviewer-worker-token}
      OUTCOME_CONTROL_PLANE_TOKEN_FILE: ${OUTCOME_CONTROL_PLANE_TOKEN_FILE:-/run/secrets/outcome-worker-token}
      VISION_CONTROL_PLANE_TOKEN_FILE: ${VISION_CONTROL_PLANE_TOKEN_FILE:-/run/secrets/vision-worker-token}
      MODEL_ENDPOINT: ${MODEL_ENDPOINT:-https://api.openai.com/v1/responses}
      MODEL_API_KEY_FILE: ${MODEL_API_KEY_FILE:-/run/secrets/model-api-key}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      MODEL_REVISION: ${MODEL_REVISION:-2026-01}
      AGENT_CONCURRENCY: ${AGENT_CONCURRENCY:-2}
      REVIEWER_CONCURRENCY: ${REVIEWER_CONCURRENCY:-2}
      OUTCOME_CONCURRENCY: ${OUTCOME_CONCURRENCY:-2}
      VISION_CONCURRENCY: ${VISION_CONCURRENCY:-1}
    mem_limit: ${WORKER_SUPERVISOR_MEM_LIMIT:-96m}
    cpus: ${WORKER_SUPERVISOR_CPUS:-1.0}
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker-ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
