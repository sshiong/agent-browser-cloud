    BrowserPlacement:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - tenantId
        - nodeId
        - requestedTemplate
        - resolvedTemplate
        - extensionIds
        - unknownExtensionCount
        - cpuMillis
        - memoryRequestMib
        - memoryLimitMib
        - pidLimit
        - tabBudget
        - stateCollectorBudgetPercent
        - remoteDesktopBitrateKbps
        - extensionCpuWeight
        - requiresDesktop
        - requiresGpu
        - requiresNativeOs
        - requiresIsolation
        - requiresMedia
        - mediaSlots
        - mediaEncoderSlots
        - backgroundTabsFrozen
        - newTabsBlocked
        - pausedExtensionIds
        - successTraceSamplePercent
        - successScreenshotSamplePercent
        - observerFrameRateFps
        - videoRecordingRequested
        - videoRecordingEnabled
        - mediaBitrateKbps
        - placementScore
        - state
        - reasonCodes
        - reservedAt
      properties:
        sessionId:
          type: string
        tenantId:
          type: string
        nodeId:
          type: string
        requestedTemplate:
          $ref: "#/components/schemas/ResourceTemplate"
        resolvedTemplate:
          $ref: "#/components/schemas/ResourceTemplate"
        extensionIds:
          type: array
          items:
            type: string
        unknownExtensionCount:
          type: integer
        cpuMillis:
          type: integer
        memoryRequestMib:
          type: integer
        memoryLimitMib:
          type: integer
        pidLimit:
          type: integer
        tabBudget:
          type: integer
        stateCollectorBudgetPercent:
          type: integer
          minimum: 10
          maximum: 100
        remoteDesktopBitrateKbps:
          type: integer
          minimum: 0
          maximum: 100000
        extensionCpuWeight:
          type: integer
          minimum: 1
          maximum: 10000
        requiresDesktop:
          type: boolean
        requiresGpu:
          type: boolean
        requiresNativeOs:
          type: boolean
        requiresIsolation:
          type: boolean
        requiresMedia:
          type: boolean
        mediaSlots:
          type: integer
          minimum: 0
          maximum: 32
        mediaEncoderSlots:
          type: integer
          minimum: 0
          maximum: 32
        backgroundTabsFrozen:
          type: boolean
        newTabsBlocked:
          type: boolean
        pausedExtensionIds:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-zA-Z0-9_.-]{1,128}$"
        successTraceSamplePercent:
          type: integer
          minimum: 1
          maximum: 100
          description: Node-acknowledged sampling percentage for optional successful command traces. Failures and mandatory evidence are not sampled.
        successScreenshotSamplePercent:
          type: integer
          minimum: 1
          maximum: 100
          description: Node-acknowledged sampling percentage for successful Agent screenshots. Failed actions and navigation remain mandatory.
        observerFrameRateFps:
          type: integer
          minimum: 0
          maximum: 60
          description: Node-acknowledged maximum Observer forwarding rate. It is zero only for Sessions without a desktop data plane.
        videoRecordingRequested:
          type: boolean
        videoRecordingEnabled:
          type: boolean
          description: Current Node-acknowledged state of the independent CDP recording actuator.
        mediaBitrateKbps:
          type: integer
          minimum: 0
          maximum: 1000000
        placementScore:
          type: integer
        state:
          type: string
          enum: [RESERVED, ACTIVE, EVICTING, RELEASED]
        reasonCodes:
          type: array
          items:
            type: string
        reservedAt:
          type: string
          format: date-time
        activatedAt:
          type: [string, "null"]
          format: date-time
        releasedAt:
          type: [string, "null"]
          format: date-time
    BrowserState:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - contextEpoch
        - stateVersion
        - targetRevision
        - url
        - title
        - stateHash
        - stateQuality
        - documentReadyState
        - networkQuietMillis
        - networkEvidenceFresh
        - targets
        - tabs
        - activeTabId
        - nativeDialogs
        - nativeDialogEvidenceFresh
      properties:
        sessionId:
          type: string
        contextEpoch:
          type: integer
          format: int64
          minimum: 0
        stateVersion:
          type: integer
          format: int64
          minimum: 1
        targetRevision:
          type: integer
          format: int64
          minimum: 1
        url:
          type: string
          maxLength: 8192
        title:
          type: string
          maxLength: 1024
        stateHash:
          type: string
          maxLength: 128
        stateQuality:
          type: string
          enum: [COMPLETE, DEPTH_LIMITED, RESYNCING, DEGRADED, INVALID]
        documentReadyState:
          type: string
          enum: [loading, interactive, complete, ""]
          description: Browser document.readyState; empty only for legacy or unavailable evidence.
        networkQuietMillis:
          type: integer
          format: int64
          minimum: 0
          maximum: 300000
          description: Continuously observed quiet time; zero while requests are active or evidence is unavailable.
        networkEvidenceFresh:
          type: boolean
          description: True only while the Browser-level and Page Network observers remain authoritative.
        targets:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/InteractiveTarget"
        tabs:
          type: array
          maxItems: 100
          description: Browser-level Page Targets. Empty only while an N-1 Browser Node has not projected tab authority.
          items:
            $ref: "#/components/schemas/AgentBrowserTab"
        activeTabId:
          type: string
          maxLength: 128
          description: ID of the one active tab; empty only when tabs is empty during rolling compatibility.
        nativeDialogs:
          type: array
          maxItems: 100
          description: Browser-native alert/confirm/prompt/beforeunload lifecycle; never DOM role=dialog.
          items:
            $ref: "#/components/schemas/AgentBrowserNativeDialog"
        nativeDialogEvidenceFresh:
          type: boolean
          description: False after an observer gap or from N-1 Nodes. Stale dialogs remain visible but cannot be acted on.
    UploadAgentBrowserFileRequest:
      type: object
      additionalProperties: false
      required: [targetRef, targetRevision, baseStateVersion, baseContentHash, filename, mimeType, contentSha256, file]
      properties:
        targetRef: {type: string, minLength: 1, maxLength: 128}
        targetRevision: {type: integer, format: int64, minimum: 1}
        baseStateVersion: {type: integer, format: int64, minimum: 1}
        baseContentHash: {type: string, pattern: "^[0-9a-f]{64}$"}
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Safe display filename; path separators and control characters are rejected.
        mimeType: {type: string, minLength: 1, maxLength: 255, default: application/octet-stream}
        contentSha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        file:
          type: string
          format: binary
          maxLength: 67108864
    AgentBrowserFileUpload:
      type: object
      additionalProperties: false
      required: [uploadId, operationId, sessionId, targetRef, filename, mimeType, contentSha256, contentBytes, state, requestId, createdAt, updatedAt]
      properties:
        uploadId: {type: string, pattern: "^afu_[A-Za-z0-9]{20}$"}
        operationId: {type: string, pattern: "^op_[A-Za-z0-9]{16,32}$"}
        sessionId: {type: string, pattern: "^ses_[A-Za-z0-9]{16,}$"}
        targetRef: {type: string, maxLength: 128}
        filename: {type: string, maxLength: 255}
        mimeType: {type: string, maxLength: 255}
        contentSha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        contentBytes: {type: integer, format: int64, minimum: 1, maximum: 67108864}
        state: {type: string, enum: [STAGING, EXECUTING, COMMITTED, FAILED]}
        errorCode: {type: [string, "null"], maxLength: 128}
        stateVersionAfter: {type: [integer, "null"], format: int64, minimum: 1}
        requestId: {type: string, maxLength: 128}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
    AgentBrowserDownload:
      type: object
      additionalProperties: false
      required: [downloadId, filename, mimeType, receivedBytes, status, startedAt, updatedAt]
      properties:
        downloadId: {type: string, pattern: "^dld_[0-9a-f]{20}$"}
        filename: {type: string, maxLength: 255}
        mimeType: {type: string, maxLength: 255}
        size: {type: [integer, "null"], format: int64, minimum: 0}
        receivedBytes: {type: integer, format: int64, minimum: 0}
        progress: {type: [number, "null"], format: double, minimum: 0, maximum: 1}
        status: {type: string, enum: [IN_PROGRESS, COMPLETED, CANCELED, INTERRUPTED]}
        startedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AgentBrowserDownloadList:
      type: object
      additionalProperties: false
      required: [stateCursor, evidenceFresh, dataStale, downloads]
      properties:
        stateCursor: {type: string, pattern: "^[0-9]+:[0-9]+:[a-f0-9]{64}$"}
        evidenceFresh: {type: boolean}
        dataStale: {type: boolean}
        downloads:
          type: array
          maxItems: 32
          items: {$ref: "#/components/schemas/AgentBrowserDownload"}
    AgentBrowserEvaluationMode:
      type: string
      enum: [READ_ONLY, PAGE_ACTION]
    CreateAgentBrowserEvaluationRequest:
      type: object
      additionalProperties: false
      required: [goal, mode, expression, expectedStateCursor]
      properties:
        goal:
          type: string
          minLength: 1
          maxLength: 2000
          description: Intent evaluated by the existing risk and high-risk confirmation policy.
        mode: {$ref: "#/components/schemas/AgentBrowserEvaluationMode"}
        expression:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
          description: Sealed for Node delivery and never returned by this API.
        expectedStateCursor:
          type: string
          pattern: "^[0-9]+:[0-9]+:[a-f0-9]{64}$"
        awaitPromise: {type: boolean, default: true}
        timeoutMs: {type: integer, minimum: 100, maximum: 5000, default: 2000}
        maximumResultBytes: {type: integer, minimum: 1, maximum: 32768, default: 16384}
    AgentBrowserEvaluation:
      type: object
      additionalProperties: false
      required:
        [evaluationId, sessionId, mode, state, expectedStateCursor, activeTabId,
         expressionSha256, expressionBytes, awaitPromise, timeoutMs, maximumResultBytes,
         requestId, createdAt, updatedAt]
      properties:
        evaluationId: {type: string, pattern: "^aje_[A-Za-z0-9]{20}$"}
        sessionId: {type: string, pattern: "^ses_[A-Za-z0-9]{16,}$"}
        mode: {$ref: "#/components/schemas/AgentBrowserEvaluationMode"}
        state: {type: string, enum: [EXECUTING, COMMITTED, FAILED]}
        expectedStateCursor: {type: string, pattern: "^[0-9]+:[0-9]+:[a-f0-9]{64}$"}
        stateCursorAfter: {type: [string, "null"], pattern: "^[0-9]+:[0-9]+:[a-f0-9]{64}$"}
        activeTabId: {type: string, minLength: 1, maxLength: 128}
        activeTabIdAfter: {type: [string, "null"], minLength: 1, maxLength: 128}
        expressionSha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        expressionBytes: {type: integer, minimum: 1, maximum: 16384}
        awaitPromise: {type: boolean}
        timeoutMs: {type: integer, minimum: 100, maximum: 5000}
        maximumResultBytes: {type: integer, minimum: 1, maximum: 32768}
        resultType: {type: [string, "null"], maxLength: 64}
        result:
          description: Any bounded JSON value after recursive sensitive-key redaction; null while executing or failed.
        resultBytes: {type: [integer, "null"], minimum: 0, maximum: 32768}
        redactedValueCount: {type: [integer, "null"], minimum: 0, maximum: 10000}
        exceptionClass: {type: [string, "null"], minLength: 1, maxLength: 256}
        exceptionMessage: {type: [string, "null"], minLength: 1, maxLength: 2048}
        errorCode: {type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{2,127}$"}
        durationMs: {type: [integer, "null"], minimum: 0, maximum: 30000}
        requestId: {type: string, maxLength: 128}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
    AgentBrowserScreenshotMode:
      type: string
      enum: [VIEWPORT, FULL_PAGE, ELEMENT, REGION, CHALLENGE_REGION]
    AgentBrowserScreenshotRegion:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      properties:
        x: {type: number, format: double, minimum: 0, maximum: 7680}
        y: {type: number, format: double, minimum: 0, maximum: 4320}
        width: {type: number, format: double, minimum: 1, maximum: 7680}
        height: {type: number, format: double, minimum: 1, maximum: 4320}
    CaptureAgentBrowserScreenshotRequest:
      type: object
      additionalProperties: false
      required: [mode, expectedStateCursor]
      description: >
        VIEWPORT and FULL_PAGE accept no target. ELEMENT requires elementId. REGION and
        CHALLENGE_REGION require a viewport-relative region. Other combinations are rejected.
      properties:
        mode: {$ref: "#/components/schemas/AgentBrowserScreenshotMode"}
        expectedStateCursor:
          type: string
          pattern: "^[0-9]+:[0-9]+:[a-f0-9]{64}$"
        elementId: {type: [string, "null"], maxLength: 256}
        region:
          anyOf:
            - $ref: "#/components/schemas/AgentBrowserScreenshotRegion"
            - type: "null"
    AgentBrowserScreenshot:
      type: object
      additionalProperties: false
      required:
        [screenshotId, sessionId, mode, state, expectedStateCursor, activeTabId,
         requestId, createdAt, updatedAt]
      properties:
        screenshotId: {type: string, pattern: "^shot_[A-Za-z0-9]{20}$"}
        sessionId: {type: string, pattern: "^ses_[A-Za-z0-9]{16,}$"}
        mode: {$ref: "#/components/schemas/AgentBrowserScreenshotMode"}
        state: {type: string, enum: [EXECUTING, COMMITTED, FAILED]}
        expectedStateCursor: {type: string, pattern: "^[0-9]+:[0-9]+:[a-f0-9]{64}$"}
        capturedStateCursor: {type: [string, "null"], pattern: "^[0-9]+:[0-9]+:[a-f0-9]{64}$"}
        activeTabId: {type: string, minLength: 1, maxLength: 128}
        elementId: {type: [string, "null"], maxLength: 256}
        region:
          anyOf:
            - $ref: "#/components/schemas/AgentBrowserScreenshotRegion"
            - type: "null"
        coordinateSpace: {type: [string, "null"], enum: [VIEWPORT, DOCUMENT, null]}
        viewportWidth: {type: [number, "null"], format: double, minimum: 1}
        viewportHeight: {type: [number, "null"], format: double, minimum: 1}
        deviceScaleFactor: {type: [number, "null"], format: double, minimum: 0.1, maximum: 8}
        evidenceId: {type: [string, "null"], pattern: "^evd_[A-Za-z0-9]{16,}$"}
        accessGrantId: {type: [string, "null"], pattern: "^egr_[A-Za-z0-9]{16,}$"}
        accessGrantExpiresAt: {type: [string, "null"], format: date-time}
        contentSha256: {type: [string, "null"], pattern: "^[0-9a-f]{64}$"}
        contentBytes: {type: [integer, "null"], format: int64, minimum: 1, maximum: 8388608}
        redactionState: {type: [string, "null"], enum: [MASKED, NOT_REQUIRED, null]}
        redactedRegionCount: {type: [integer, "null"], minimum: 0}
        errorCode: {type: [string, "null"], maxLength: 128}
        requestId: {type: string, maxLength: 128}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
    AgentBrowserSnapshot:
      type: object
      additionalProperties: false
      required: [stateCursor, state, visibleTextSummary, tabs, activeTab, focusedElementId, formControlElementIds, dialogElementIds, nativeDialogs, nativeDialogEvidenceFresh, pageLoadingState, challengeState, visionRecommended]
      properties:
        stateCursor:
          type: string
          pattern: "^[0-9]+:[0-9]+:[a-f0-9]{64}$"
          description: Monotonic State/Target revision plus authoritative content hash.
        state:
          $ref: "#/components/schemas/BrowserState"
        visibleTextSummary:
          type: string
          maxLength: 4000
          description: Bounded non-sensitive summary; never contains password or OTP values.
        tabs:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AgentBrowserTab"
        activeTab:
          anyOf:
            - $ref: "#/components/schemas/AgentBrowserTab"
            - type: "null"
          description: Null only while an N-1 Browser Node has not projected Browser-level tab authority.
        focusedElementId:
          type: [string, "null"]
        formControlElementIds:
          type: array
          maxItems: 200
          items: {type: string}
        dialogElementIds:
          type: array
          maxItems: 200
          description: DOM/A11y dialog-like elements only; separate from browser-native JavaScript Dialog state.
          items: {type: string}
        nativeDialogs:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AgentBrowserNativeDialog"
        nativeDialogEvidenceFresh:
          type: boolean
        pageLoadingState:
          type: string
          enum: [loading, interactive, complete, ""]
        challengeState:
          type: string
          enum: [NOT_EVALUATED]
          description: Challenge authority remains the dedicated Challenge API; the snapshot does not infer it from DOM text.
        visionRecommended:
          type: boolean
          description: True only when structured perception is depth-limited or a visible target is occluded.
    AgentBrowserTab:
      type: object
      additionalProperties: false
      required: [tabId, url, title, active]
      properties:
        tabId: {type: string, maxLength: 128}
        url: {type: string, maxLength: 8192}
        title: {type: string, maxLength: 2048}
        active: {type: boolean}
    AgentBrowserNativeDialog:
      type: object
      additionalProperties: false
      required: [dialogId, tabId, dialogType, message, defaultPrompt, hasBrowserHandler]
      properties:
        dialogId:
          type: string
          pattern: "^dlg_[0-9a-f]{20}$"
        tabId:
          type: string
          maxLength: 128
        dialogType:
          type: string
          enum: [ALERT, CONFIRM, PROMPT, BEFOREUNLOAD]
        message:
          type: string
          maxLength: 4096
        defaultPrompt:
          type: string
          maxLength: 4096
        hasBrowserHandler:
          type: boolean
    AgentBrowserInspectRequest:
      type: object
      additionalProperties: false
      required: [stateCursor, elementIds]
      properties:
        stateCursor:
          type: string
          pattern: "^[0-9]+:[0-9]+:[a-f0-9]{64}$"
        elementIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 256
    AgentBrowserFindRequest:
      type: object
      additionalProperties: false
      required: [query, includeHidden]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 256
        roles:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 64
        includeHidden:
          type: boolean
          default: false
        limit:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          default: 20
    AgentBrowserTargetList:
      type: object
      additionalProperties: false
      required: [stateCursor, targets, truncated]
      properties:
        stateCursor:
          type: string
          pattern: "^[0-9]+:[0-9]+:[a-f0-9]{64}$"
        targets:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/InteractiveTarget"
        truncated:
          type: boolean
    StateResyncRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [FULL, REGION]
        rootRef:
          type: [string, "null"]
          maxLength: 512
        reason:
          type: [string, "null"]
          maxLength: 128
    StateResyncResponse:
      type: object
      additionalProperties: false
      required: [requestId, mode, state]
      properties:
        requestId:
          type: string
        mode:
          type: string
          enum: [FULL, REGION]
        state:
          type: string
          enum: [QUEUED]
    InteractiveTarget:
      type: object
      additionalProperties: false
      required:
        - targetRef
        - elementId
        - role
        - enabled
        - visible
        - sensitive
        - focused
        - interactive
        - frameId
        - inViewport
        - occluded
      properties:
        targetRef:
          type: string
          maxLength: 256
        elementId:
          type: string
          maxLength: 256
          description: Stable structured element ID; actions remain fenced by stateCursor/targetRevision.
        role:
          type: string
          maxLength: 128
        name:
          type: [string, "null"]
          maxLength: 256
        value:
          type: [string, "null"]
          maxLength: 512
          description: Always null for password, OTP, payment and other sensitive controls.
        controlType:
          type: [string, "null"]
          maxLength: 64
        bounds:
          oneOf:
            - $ref: "#/components/schemas/TargetBounds"
            - type: "null"
        enabled:
