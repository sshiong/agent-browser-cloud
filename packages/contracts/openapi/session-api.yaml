        binding snapshot only after the source allocation is released, restores the Browser,
        performs State Resync and then validates Business Recovery. This is not an in-place or
        connection-transparent proxy change.
      tags: [Session, Proxy]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
