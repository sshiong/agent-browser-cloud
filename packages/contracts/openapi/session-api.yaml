          type: [string, "null"]
        lastHealthCheckedAt:
          type: [string, "null"]
          format: date-time
        lastFailureReason:
          type: [string, "null"]
          description: Bounded error code only; Provider or credential details are never returned.
        probeSampleCount:
          type: integer
