openapi: 3.1.0
info:
  title: Agent Browser Cloud API
  version: 1.0.0
  description: Control Plane Session API v1.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Same-origin API endpoint
security:
  - bearerAuth: []
paths:
  /api/v1/coordinator/tenant-route:
    get:
      operationId: getTenantCoordinatorRoute
      summary: Get the authenticated tenant's authoritative Coordinator route
      tags: [Coordinator]
      responses:
        "200":
          description: Current active and pending tenant route epochs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantRoute"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/coordinator/tenant-route/migration:
    get:
      operationId: getLatestTenantCoordinatorRouteMigration
      summary: Get the latest durable tenant route migration
      tags: [Coordinator]
      responses:
        "200":
          description: Latest migration and safe-point reconciliation progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantRouteMigration"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/coordinator/tenant-route/migrations:
    post:
      operationId: requestTenantCoordinatorRouteMigration
      summary: Repartition a hot tenant using safe-point migration and Route Epoch fencing
      tags: [Coordinator]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestTenantRouteMigration"
      responses:
        "200":
          description: Durable migration accepted or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantRouteMigration"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions:
    post:
      operationId: createSession
      summary: Create a Session
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created, or the original idempotent result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listSessions
      summary: List tenant Sessions
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/SessionState"
        - name: q
          in: query
          description: Tenant-scoped search across Session ID, display name, Profile, region, resource class, and governed metadata.
          schema:
            type: string
            maxLength: 128
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Tenant-scoped Session list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sessions/{sessionId}:
    get:
      operationId: getSession
      summary: Get Session details
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Session detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionView"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/state:
    get:
      operationId: getBrowserState
      summary: Get the latest Browser Current State
      tags: [Session, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Latest tenant-scoped Browser State.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "204":
          description: The Runtime has not submitted a state yet.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/resources:
    get:
      operationId: getSessionResources
      summary: Get the authoritative Session resource policy, allocation and real telemetry
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Resource state. Usage is null until Browser Node telemetry exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResource"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/resource-events:
    get:
      operationId: listSessionResourceEvents
      summary: List the PostgreSQL-backed resource adjustment timeline
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Resource policy and adjustment events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceEventList"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/resource-stream:
    get:
      operationId: streamSessionResourceChanges
      summary: Stream durable Session resource changes with resumable SSE
      description: >
        Emits PostgreSQL-backed resource sample, adjustment and application safety lease
        change notifications.
        Reconnect with Last-Event-ID to replay changes after the last processed monotonic
        sequence. The event data identifies the durable row; clients then refresh the
        authoritative resource, timeline, safe-point and migration views.
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: Last-Event-ID
          in: header
          required: false
          description: Last successfully processed numeric resource stream sequence.
          schema:
            type: string
            pattern: "^[0-9]+$"
      responses:
        "200":
          description: >
            SSE stream. Events are resource-stream-ready, resource-stream-reset and
            session-resource-change; keepalive comments do not advance the cursor.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Per-process or per-Session live subscriber bound reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/sessions/{sessionId}/safe-point:
    get:
      operationId: getSessionSafePoint
      summary: Assess whether a Session is at a migration-safe point
      description: Fail-closed aggregation of fresh Browser Node input observations and durable control-plane blockers.
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant-scoped safe-point assessment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSafePoint"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/safety-leases:
    post:
      operationId: acquireSessionSafetyLease
      summary: Acquire an application business-activity Safe Point lease
      description: >
        Application adapters acquire a short owner-bound lease before file transfer,
        SPA/form submission, payment/account-security work, critical transactions or while
        business recovery is unknown. Active leases block migration and hibernation.
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSafetyLeaseRequest"
      responses:
        "201":
          description: Lease acquired or an idempotent acquisition replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyLease"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listSessionSafetyLeases
      summary: List the latest durable application Safe Point leases for a Session
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Bounded latest current and terminal lease records plus the authoritative total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyLeaseList"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/safety-leases/{leaseId}:
    put:
      operationId: renewSessionSafetyLease
      summary: Renew an owned active application Safe Point lease
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/LeaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewSafetyLeaseRequest"
      responses:
        "200":
          description: Lease renewed or an idempotent renewal replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyLease"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}/safety-leases/{leaseId}:release:
    post:
      operationId: releaseSessionSafetyLease
      summary: Release an owned application Safe Point lease
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/LeaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Terminal lease state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyLease"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/migration:
    get:
      operationId: getLatestSessionMigration
      summary: Get the latest durable cross-node migration workflow
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Latest migration phase and recovery result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionMigration"
        "204":
          description: The Session has no migration history.
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/business-recovery:
    get:
      operationId: getBusinessRecoveryValidation
      summary: Get the latest durable Business Recovery verdict
      tags: [Session, Business Recovery]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Latest tenant-scoped Business Recovery validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessRecoveryValidation"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/business-recovery:validate:
    post:
      operationId: validateBusinessRecovery
      summary: Evaluate current authoritative Browser State against the bound Application contract
      description: >
        Persists an idempotent verdict. Tenant JavaScript and regular expressions are
        not executed; only the bounded declarative recovery contract is evaluated.
      tags: [Session, Business Recovery]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Durable Business Recovery verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessRecoveryValidation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/applications/recovery-contracts:
    get:
      operationId: listApplicationRecoveryContracts
      summary: List tenant Application Recovery Contracts
      tags: [Business Recovery]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant-scoped contracts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryContractListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/applications/{applicationId}/recovery-contract:
    get:
      operationId: getApplicationRecoveryContract
      summary: Get a tenant Application Recovery Contract
      tags: [Business Recovery]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Application Recovery Contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryContract"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: upsertApplicationRecoveryContract
      summary: Create or update a versioned declarative Application Recovery Contract
      tags: [Business Recovery]
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertRecoveryContractRequest"
      responses:
        "200":
          description: Current contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryContract"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sessions/{sessionId}/resource-policy:
    patch:
      operationId: updateSessionResourcePolicy
      summary: Update AUTO resource policy through an idempotent backend Operation
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourcePolicyRequest"
      responses:
        "202":
          description: Resource policy Operation committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcePolicyOperation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}:start:
    post:
      operationId: startSession
      summary: Start a Session Runtime
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "202":
          description: Start operation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}:resync-state:
    post:
      operationId: resyncBrowserState
      summary: Request a Full or Region Browser State Resync
      tags: [Session, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateResyncRequest"
      responses:
        "202":
          description: State Resync command was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}:terminate:
    post:
      operationId: terminateSession
      summary: Terminate a Session
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "202":
          description: Termination operation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}:takeover:
    post:
      operationId: requestHumanTakeover
      summary: Acquire exclusive HumanTakeover control
      tags: [Session, HumanTakeover]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "202":
          description: HumanTakeover input barrier accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}:release-takeover:
    post:
      operationId: releaseHumanTakeover
      summary: Release HumanTakeover after input cleanup and state resync
      tags: [Session, HumanTakeover]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "202":
          description: HumanTakeover release barrier accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}:desktop-connection:
    post:
      operationId: createRemoteDesktopConnection
      summary: Issue a short-lived, single-use noVNC connection ticket
      tags: [Session, HumanTakeover, RemoteDesktop]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: Connection ticket issued for the active HumanTakeover actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteDesktopConnection"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/profiles:
    get:
      operationId: listProfiles
      summary: List tenant Profiles and their latest committed checkpoints
      tags: [Profile]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant-scoped Profile list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createProfile
      summary: Create a persistent browser Profile
      tags: [Profile]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "201":
          description: Profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/profiles/{profileId}:
    get:
      operationId: getProfile
      summary: Get Profile checkpoint metadata
      tags: [Profile]
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant-scoped Profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/proxies:
    get:
      operationId: getProxyOverview
      summary: Get the static Proxy Provider and tenant allocation ledger
      tags: [Proxy]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Provider configuration and tenant-scoped allocations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sessions/{sessionId}/agent-tasks:
    post:
      operationId: createAgentTask
      summary: Validate and persist a bounded Agent plan
      description: External context is data-only. Structured actions bind to the current Target Revision and sensitive target policy.
      tags: [Agent, AgentSafety]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentTaskRequest"
      responses:
        "201":
          description: A planned or explicitly blocked Agent task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/agent-tasks:
    get:
      operationId: listAgentTasks
      summary: List tenant Agent tasks and plan-security decisions
      tags: [Agent, AgentSafety]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Tenant-scoped Agent task list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTaskListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/agent-tasks/{taskId}:
    get:
      operationId: getAgentTask
      summary: Get an Agent task and its redacted security evidence
      tags: [Agent, AgentSafety]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            pattern: "^agt_[a-zA-Z0-9]{16,}$"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant-scoped Agent task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/agent-tasks/{taskId}:execute:
    post:
      operationId: executeAgentTask
      summary: Execute and verify a supported Agent plan
      description: Executes read, Navigate, Click, Type, Scroll, Wait, and human-handoff steps with durable checkpoints.
      tags: [Agent, AgentTool]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
