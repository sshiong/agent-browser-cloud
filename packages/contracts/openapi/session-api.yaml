          description: Group created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          pattern: "^grp_[a-zA-Z0-9]{16,32}$"
    put:
      operationId: updateWorkspaceGroup
      summary: Update Group metadata and inherited AUTO defaults
      tags: [Groups]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceGroupRequest"
      responses:
        "200":
          description: Group updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceGroup"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteWorkspaceGroup
      summary: Delete a Group without terminating its Sessions
      tags: [Groups]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Group deleted and Sessions left unassigned.
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/groups/{groupId}/sessions/{sessionId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          pattern: "^grp_[a-zA-Z0-9]{16,32}$"
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/IdempotencyKey"
    put:
      operationId: assignSessionToWorkspaceGroup
      summary: Assign a tenant Session to the Group
      tags: [Groups]
      responses:
        "200":
          description: Updated Group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceGroup"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: unassignSessionFromWorkspaceGroup
      summary: Remove a Session from the Group
      tags: [Groups]
      responses:
        "200":
          description: Updated Group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceGroup"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/tags:
    get:
      operationId: listWorkspaceTags
      summary: List tenant Workspace Tags and authoritative Session assignments
      tags: [Tags]
      responses:
        "200":
          description: Tags and tenant Sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTagListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createWorkspaceTag
      summary: Create an audited reusable Workspace Tag
      tags: [Tags]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceTagRequest"
      responses:
        "201":
          description: Tag created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/tags/{tagId}:
    parameters:
      - name: tagId
        in: path
        required: true
        schema:
          type: string
          pattern: "^tag_[a-zA-Z0-9]{16,32}$"
    put:
      operationId: updateWorkspaceTag
      summary: Update Tag metadata
      tags: [Tags]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceTagRequest"
      responses:
        "200":
          description: Tag updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTag"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteWorkspaceTag
      summary: Delete a Tag without terminating its Sessions
      tags: [Tags]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Tag and its Session assignments deleted.
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tags/{tagId}/sessions/{sessionId}:
    parameters:
      - name: tagId
        in: path
        required: true
        schema:
          type: string
          pattern: "^tag_[a-zA-Z0-9]{16,32}$"
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/IdempotencyKey"
    put:
      operationId: assignSessionToWorkspaceTag
      summary: Assign a tenant Session to the Tag
      tags: [Tags]
      responses:
        "200":
          description: Updated Tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTag"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: unassignSessionFromWorkspaceTag
      summary: Remove a Tag assignment from the Session
      tags: [Tags]
      responses:
        "200":
          description: Updated Tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceTag"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspace-batch-operations:
    get:
      operationId: listWorkspaceBatchOperations
      summary: List recent tenant Workspace lifecycle batches
      tags: [Groups, Tags, Operation]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Real routed-command and child-operation aggregate state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBatchOperationListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createWorkspaceBatchOperation
      summary: Submit a bounded Group, Tag, or explicit Session lifecycle batch
      description: >
        Creates one durable routed Coordinator command per selected Session. Risky actions
        require an explicit reason and confirmation. The API never mutates browser nodes directly.
      tags: [Groups, Tags, Operation]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceBatchOperationRequest"
      responses:
        "202":
          description: Batch accepted and durably routed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBatchOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/workspace-batch-operations/{batchOperationId}:
    get:
      operationId: getWorkspaceBatchOperation
      summary: Read authoritative batch progress
      tags: [Groups, Tags, Operation]
      parameters:
        - name: batchOperationId
          in: path
          required: true
          schema:
            type: string
            pattern: "^bop_[a-zA-Z0-9]{16,32}$"
      responses:
        "200":
          description: Current aggregate and per-Session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBatchOperation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspace-batch-operations/{batchOperationId}:cancel:
    post:
      operationId: cancelWorkspaceBatchOperation
      summary: Cancel only batch items that have not started
      description: Executing child Operations continue and remain visible in aggregate progress.
      tags: [Groups, Tags, Operation]
      parameters:
        - name: batchOperationId
          in: path
          required: true
          schema:
            type: string
            pattern: "^bop_[a-zA-Z0-9]{16,32}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelWorkspaceBatchOperationRequest"
      responses:
        "200":
          description: Cancellation request recorded and pending items cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBatchOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspace-metadata-batch-operations:
    get:
      operationId: listWorkspaceMetadataBatchOperations
      summary: List recent tenant Group/Tag membership batches
      tags: [Groups, Tags, Operation]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Authoritative PostgreSQL aggregate and per-Session execution state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMetadataBatchOperationListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createWorkspaceMetadataBatchOperation
      summary: Submit a bounded Group or Tag membership mutation batch
      description: >
        Resolves no more than 100 tenant Sessions, persists one crash-recoverable item per
        Session, and executes each assignment with a PostgreSQL lease. A reason and explicit
        confirmation are mandatory. The request never mutates browser nodes.
      tags: [Groups, Tags, Operation]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceMetadataBatchOperationRequest"
      responses:
        "202":
          description: Metadata batch accepted into the durable worker ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMetadataBatchOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/workspace-metadata-batch-operations/{batchOperationId}:
    get:
      operationId: getWorkspaceMetadataBatchOperation
      summary: Read authoritative Group/Tag membership batch progress
      tags: [Groups, Tags, Operation]
      parameters:
        - name: batchOperationId
          in: path
          required: true
          schema:
            type: string
            pattern: "^mbop_[a-zA-Z0-9]{16,32}$"
      responses:
        "200":
          description: Current aggregate and per-Session mutation state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMetadataBatchOperation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspace-metadata-batch-operations/{batchOperationId}:cancel:
    post:
      operationId: cancelWorkspaceMetadataBatchOperation
      summary: Cancel Group/Tag mutation items that have not started
      description: Executing items finish atomically; only ACCEPTED items become CANCELLED.
      tags: [Groups, Tags, Operation]
      parameters:
        - name: batchOperationId
          in: path
          required: true
          schema:
            type: string
            pattern: "^mbop_[a-zA-Z0-9]{16,32}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelWorkspaceBatchOperationRequest"
      responses:
        "200":
          description: Cancellation recorded and pending items cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMetadataBatchOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/workspace-settings:
    get:
      operationId: getWorkspaceSettings
      summary: Read effective tenant Workspace defaults
      description: >
        Returns a PostgreSQL Workspace override when one exists, otherwise the
        declared Control Plane system default with source=SYSTEM_DEFAULT.
      tags: [Settings]
      responses:
        "200":
          description: Effective Workspace Settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSettings"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateWorkspaceSettings
      summary: Persist audited defaults for future Sessions
      description: >
        Updates affect only future Session creation. Runtime, region and
        HumanTakeover values are bound at creation and existing Sessions are not rewritten.
      tags: [Settings]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSettingsRequest"
      responses:
        "200":
          description: Persisted Workspace Settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Production authentication. Tenant and actor are derived from validated JWT claims.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^ses_[a-zA-Z0-9]{16,}$"
    LeaseId:
      name: leaseId
      in: path
      required: true
      schema:
        type: string
        pattern: "^sfl_[a-zA-Z0-9]{16,}$"
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_.-]{1,128}$"
    RecoveryContractApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        pattern: "^ara_[a-zA-Z0-9]{20}$"
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_-]{1,128}$"
    TenantId:
      name: X-Tenant-Id
      in: header
      required: false
      description: Local/Test identity adapter only. Ignored in Production, where tenant identity is derived from the authenticated JWT.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ActorId:
      name: X-Actor-Id
      in: header
      required: false
      description: Optional Local/Test actor identity. Ignored in Production, where actor identity is the JWT subject.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AgentTaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        pattern: "^agt_[a-zA-Z0-9]{16,}$"
    BreakGlassRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        pattern: "^bgr_[a-zA-Z0-9]{20}$"
    SecureDebugSessionId:
      name: debugSessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^dbg_[a-zA-Z0-9]{20}$"
    RuntimeBuildId:
      name: buildId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,128}$"
    RuntimeReleaseId:
      name: releaseId
      in: path
      required: true
      schema:
        type: string
        pattern: "^rel_[A-Za-z0-9]{20}$"
    KeyRotationId:
      name: rotationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^rot_[A-Za-z0-9]{20}$"
    ValidationId:
      name: validationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^val_[A-Za-z0-9]{20}$"
    RegionId:
      name: regionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9-]{1,32}$"
    GameDayId:
      name: gameDayId
      in: path
      required: true
      schema:
        type: string
        pattern: "^gameday_[A-Za-z0-9]{20}$"
  schemas:
    WorkspaceOverview:
      type: object
      additionalProperties: false
      required:
        - sessions
        - operations
        - browserNodes
        - proxies
        - agents
        - cost
        - security
        - cursor
        - generatedAt
      properties:
        sessions:
          $ref: "#/components/schemas/WorkspaceSessionSummary"
        operations:
          $ref: "#/components/schemas/WorkspaceOperationSummary"
        browserNodes:
          $ref: "#/components/schemas/WorkspaceBrowserNodeSummary"
        proxies:
          $ref: "#/components/schemas/WorkspaceProxySummary"
        agents:
          $ref: "#/components/schemas/WorkspaceAgentSummary"
        cost:
          $ref: "#/components/schemas/WorkspaceCostSummary"
        security:
          $ref: "#/components/schemas/WorkspaceSecuritySummary"
        cursor:
          type: integer
          format: int64
          minimum: 0
        generatedAt:
          type: string
          format: date-time
    WorkspaceSessionSummary:
      type: object
      additionalProperties: false
      required: [total, running, pending, unhealthy, hibernated, terminated]
      properties:
        total: {type: integer, format: int64, minimum: 0}
        running: {type: integer, format: int64, minimum: 0}
        pending: {type: integer, format: int64, minimum: 0}
        unhealthy: {type: integer, format: int64, minimum: 0}
        hibernated: {type: integer, format: int64, minimum: 0}
        terminated: {type: integer, format: int64, minimum: 0}
    WorkspaceOperationSummary:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active: {type: integer, format: int64, minimum: 0}
    WorkspaceBrowserNodeSummary:
      type: object
      additionalProperties: false
      required:
        - visible
        - total
        - ready
        - constrained
        - activeSessions
        - maximumSessions
        - reservedCpuMillis
        - certifiedCpuMillis
        - reservedMemoryMib
        - certifiedMemoryMib
      properties:
        visible:
          type: boolean
          description: True only when the caller may inspect platform-wide Node capacity.
        total: {type: integer, format: int64, minimum: 0}
        ready: {type: integer, format: int64, minimum: 0}
        constrained: {type: integer, format: int64, minimum: 0}
        activeSessions: {type: integer, format: int64, minimum: 0}
        maximumSessions: {type: integer, format: int64, minimum: 0}
        reservedCpuMillis: {type: integer, format: int64, minimum: 0}
        certifiedCpuMillis: {type: integer, format: int64, minimum: 0}
        reservedMemoryMib: {type: integer, format: int64, minimum: 0}
        certifiedMemoryMib: {type: integer, format: int64, minimum: 0}
    WorkspaceProxySummary:
      type: object
      additionalProperties: false
      required: [activeAllocations, boundSessions]
      properties:
        activeAllocations: {type: integer, format: int64, minimum: 0}
        boundSessions: {type: integer, format: int64, minimum: 0}
    WorkspaceAgentSummary:
      type: object
      additionalProperties: false
      required: [active, awaitingHuman, pausedByResourcePolicy, failedLast24Hours]
      properties:
        active: {type: integer, format: int64, minimum: 0}
        awaitingHuman: {type: integer, format: int64, minimum: 0}
        pausedByResourcePolicy: {type: integer, format: int64, minimum: 0}
        failedLast24Hours: {type: integer, format: int64, minimum: 0}
    WorkspaceCostSummary:
      type: object
      additionalProperties: false
      required: [currentHourlyUsd, activeSessionsWithoutCurrentPrice]
      properties:
        currentHourlyUsd: {type: number, format: double, minimum: 0}
        activeSessionsWithoutCurrentPrice:
          type: integer
          format: int64
          minimum: 0
    WorkspaceSecuritySummary:
      type: object
      additionalProperties: false
      required: [warningLast24Hours, criticalLast24Hours]
      properties:
        warningLast24Hours: {type: integer, format: int64, minimum: 0}
        criticalLast24Hours: {type: integer, format: int64, minimum: 0}
    SearchResourceType:
      type: string
      enum: [SESSION, PROFILE, GROUP, TAG, RUNTIME, NODE]
    GlobalSearchResult:
      type: object
      additionalProperties: false
      required:
        - resourceType
        - resourceId
        - title
        - description
        - status
        - region
        - updatedAt
      properties:
        resourceType:
          $ref: "#/components/schemas/SearchResourceType"
        resourceId:
          type: string
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          type: [string, "null"]
        region:
          type: [string, "null"]
        updatedAt:
          type: [string, "null"]
          format: date-time
    GlobalSearchResponse:
      type: object
      additionalProperties: false
      required: [query, items, limit, truncated]
      properties:
        query:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/GlobalSearchResult"
        limit:
          type: integer
        truncated:
          type: boolean
    NotificationCategory:
      type: string
      enum: [SECURITY, RESOURCE, AGENT, RELEASE, SYSTEM]
    NotificationSeverity:
      type: string
      enum: [INFO, WARNING, CRITICAL]
    WorkspaceNotification:
      type: object
      additionalProperties: false
      required:
        - notificationId
        - sequence
        - category
        - severity
        - title
        - body
        - eventType
        - sessionId
        - resourceType
        - resourceId
        - requestId
        - route
        - read
        - occurredAt
      properties:
        notificationId:
          type: string
          pattern: "^ntf_[a-zA-Z0-9]{20}$"
        sequence:
          type: integer
          format: int64
          minimum: 1
        category:
          $ref: "#/components/schemas/NotificationCategory"
        severity:
          $ref: "#/components/schemas/NotificationSeverity"
        title:
          type: string
        body:
          type: string
        eventType:
          type: string
        sessionId:
          type: [string, "null"]
        resourceType:
          type: [string, "null"]
        resourceId:
          type: [string, "null"]
        requestId:
          type: [string, "null"]
        route:
          type: string
        read:
          type: boolean
        occurredAt:
          type: string
          format: date-time
    WorkspaceNotificationListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - unreadCount
        - lastReadSequence
        - headSequence
        - nextBeforeSequence
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceNotification"
        unreadCount:
          type: integer
          format: int64
          minimum: 0
        lastReadSequence:
          type: integer
          format: int64
          minimum: 0
        headSequence:
          type: integer
          format: int64
          minimum: 0
        nextBeforeSequence:
          type: [integer, "null"]
          format: int64
          minimum: 1
    UpdateNotificationReadCursorRequest:
      type: object
      additionalProperties: false
      required: [readThroughSequence]
      properties:
        readThroughSequence:
          type: integer
          format: int64
          minimum: 0
    WorkspaceNotificationReadState:
      type: object
      additionalProperties: false
      required: [lastReadSequence, unreadCount, updatedAt]
      properties:
        lastReadSequence:
          type: integer
          format: int64
          minimum: 0
        unreadCount:
          type: integer
          format: int64
          minimum: 0
        updatedAt:
          type: string
          format: date-time
    ThemeMode:
      type: string
      enum: [SYSTEM, DARK, LIGHT]
    UpdateUserPreferencesRequest:
      type: object
      additionalProperties: false
      required: [themeMode]
      properties:
        themeMode:
          $ref: "#/components/schemas/ThemeMode"
    UserPreferences:
      type: object
      additionalProperties: false
      required: [themeMode, source, updatedAt, version]
      properties:
        themeMode:
          $ref: "#/components/schemas/ThemeMode"
        source:
          type: string
          enum: [SYSTEM_DEFAULT, USER_OVERRIDE]
