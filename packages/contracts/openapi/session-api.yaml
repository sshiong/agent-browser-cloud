          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Production authentication. Tenant and actor are derived from validated JWT claims.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^ses_[a-zA-Z0-9]{16,}$"
    LeaseId:
      name: leaseId
      in: path
      required: true
      schema:
        type: string
        pattern: "^sfl_[a-zA-Z0-9]{16,}$"
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_.-]{1,128}$"
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_-]{1,128}$"
    TenantId:
      name: X-Tenant-Id
      in: header
      required: false
      description: Local/Test identity adapter only. Ignored in Production, where tenant identity is derived from the authenticated JWT.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ActorId:
      name: X-Actor-Id
      in: header
      required: false
      description: Optional Local/Test actor identity. Ignored in Production, where actor identity is the JWT subject.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AgentTaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        pattern: "^agt_[a-zA-Z0-9]{16,}$"
    BreakGlassRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        pattern: "^bgr_[a-zA-Z0-9]{20}$"
    SecureDebugSessionId:
      name: debugSessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^dbg_[a-zA-Z0-9]{20}$"
    RuntimeBuildId:
      name: buildId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,128}$"
    RuntimeReleaseId:
      name: releaseId
      in: path
      required: true
      schema:
        type: string
        pattern: "^rel_[A-Za-z0-9]{20}$"
    KeyRotationId:
      name: rotationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^rot_[A-Za-z0-9]{20}$"
    ValidationId:
      name: validationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^val_[A-Za-z0-9]{20}$"
    RegionId:
      name: regionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9-]{1,32}$"
    GameDayId:
      name: gameDayId
      in: path
      required: true
      schema:
        type: string
        pattern: "^gameday_[A-Za-z0-9]{20}$"
  schemas:
    TenantRoute:
      type: object
      additionalProperties: false
      required:
        [tenantId, state, activeVirtualPartitions, activeRouteEpoch, version, updatedAt]
      properties:
        tenantId:
          type: string
        state:
          type: string
          enum: [STABLE, MIGRATING]
