x-local-agent-worker: &local-agent-worker
  build:
    context: apps/agent-worker
    dockerfile: Dockerfile
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  network_mode: service:control-plane
  depends_on:
    local-agent-secrets:
      condition: service_completed_successfully
    control-plane:
      condition: service_healthy
  healthcheck:
    test: [CMD, python, -c, "import pathlib; assert pathlib.Path('/tmp/worker-ready').read_text() == 'ready\\n'"]
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 10s

services:
  local-agent-secrets:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    entrypoint: [/bin/sh, -euc]
    command:
      - |
        install_secret() {
          target="/out/$$1"
          mkdir -p "$$target"
          printf '%s\n' "local-$$1-token-unused" >"$$target/token"
          if [ "$$1" != agent-worker ]; then
            cp /source/model-api-key "$$target/model-api-key"
          fi
          chown -R 65532:65532 "$$target"
          chmod 0700 "$$target"
          chmod 0400 "$$target"/*
        }
        test -f /source/model-api-key
        test ! -L /source/model-api-key
        test -s /source/model-api-key
        for worker in agent-worker reviewer-worker outcome-worker vision-worker; do
          install_secret "$$worker"
        done
    volumes:
      - ${LOCAL_AGENT_MODEL_API_KEY_FILE:-./.local/agent-model-api-key}:/source/model-api-key:ro
      - local_agent_worker_secrets:/out/agent-worker
      - local_reviewer_worker_secrets:/out/reviewer-worker
      - local_outcome_worker_secrets:/out/outcome-worker
      - local_vision_worker_secrets:/out/vision-worker

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: browsercloud
      POSTGRES_USER: browsercloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-browsercloud}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U browsercloud"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/browsercloud
      DATABASE_USER: browsercloud
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-browsercloud}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BROWSER_NODE_GRPC_TARGET: browser-node:9090
      CONTROL_PLANE_NODE_EVENT_PORT: 9091
      APP_ENVIRONMENT: local
      BROWSER_DENSITY_BOOTSTRAP_LOCAL_NODE_ENABLED: "false"
      REMOTE_DESKTOP_TICKET_SECRET: ${REMOTE_DESKTOP_TICKET_SECRET:-browsercloud-local-remote-desktop-ticket-secret-v1}
      REMOTE_DESKTOP_CONTROL_ACTOR_BITRATE_LIMIT_KBPS: ${REMOTE_DESKTOP_CONTROL_ACTOR_BITRATE_LIMIT_KBPS:-8000}
      REMOTE_DESKTOP_CONTROL_ACTOR_FRAME_RATE_LIMIT_FPS: ${REMOTE_DESKTOP_CONTROL_ACTOR_FRAME_RATE_LIMIT_FPS:-30}
      REMOTE_DESKTOP_VIEWER_ACTOR_BITRATE_LIMIT_KBPS: ${REMOTE_DESKTOP_VIEWER_ACTOR_BITRATE_LIMIT_KBPS:-4000}
      REMOTE_DESKTOP_VIEWER_ACTOR_FRAME_RATE_LIMIT_FPS: ${REMOTE_DESKTOP_VIEWER_ACTOR_FRAME_RATE_LIMIT_FPS:-15}
      PROXY_ALLOW_DIRECT: "true"
      AGENT_EXTERNAL_WORKER_ENABLED: "true"
      AGENT_REVIEWER_EXTERNAL_ENABLED: "true"
      AGENT_REVIEWER_DEPLOYMENT_ID: local-reviewer-v1
      AGENT_REVIEWER_MODEL_NAME: ${LOCAL_AGENT_MODEL_NAME:-configure-real-model}
      AGENT_REVIEWER_MODEL_REVISION: ${LOCAL_AGENT_MODEL_REVISION:-local-v1}
      AGENT_REVIEWER_MAXIMUM_OUTPUT_TOKENS: ${LOCAL_AGENT_MODEL_MAXIMUM_OUTPUT_TOKENS:-512}
      AGENT_OUTCOME_VERIFIER_EXTERNAL_ENABLED: "true"
      AGENT_OUTCOME_VERIFIER_DEPLOYMENT_ID: local-outcome-v1
      AGENT_OUTCOME_VERIFIER_MODEL_NAME: ${LOCAL_AGENT_MODEL_NAME:-configure-real-model}
      AGENT_OUTCOME_VERIFIER_MODEL_REVISION: ${LOCAL_AGENT_MODEL_REVISION:-local-v1}
      AGENT_OUTCOME_VERIFIER_MAXIMUM_OUTPUT_TOKENS: ${LOCAL_AGENT_MODEL_MAXIMUM_OUTPUT_TOKENS:-512}
      CHALLENGE_VISION_DEPLOYMENT_ID: local-vision-v1
      CHALLENGE_VISION_MODEL_REVISION: ${LOCAL_AGENT_MODEL_REVISION:-local-v1}
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    expose:
      - "9091"
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q ''"status":"UP"''']
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser-node:
        condition: service_started

  agent-worker:
    <<: *local-agent-worker
    command: [--control-plane-url, http://127.0.0.1:8080, --control-plane-token-file, /run/browsercloud/secrets/token, --worker-id, local-agent-1, --environment, local, --ready-file, /tmp/worker-ready]
    volumes:
      - local_agent_worker_secrets:/run/browsercloud/secrets:ro

  reviewer-worker:
    <<: *local-agent-worker
    entrypoint: [/usr/bin/tini, --, python, /app/reviewer_worker.py]
    command: [--control-plane-url, http://127.0.0.1:8080, --control-plane-token-file, /run/browsercloud/secrets/token, --worker-id, local-reviewer-1, --deployment-id, local-reviewer-v1, --model-endpoint, "${LOCAL_AGENT_MODEL_ENDPOINT:-https://model.invalid/v1/responses}", --model-api-key-file, /run/browsercloud/secrets/model-api-key, --model-name, "${LOCAL_AGENT_MODEL_NAME:-configure-real-model}", --expected-response-model, "${LOCAL_AGENT_MODEL_RESPONSE_NAME:-}", --model-revision, "${LOCAL_AGENT_MODEL_REVISION:-local-v1}", --maximum-output-tokens, "${LOCAL_AGENT_MODEL_MAXIMUM_OUTPUT_TOKENS:-512}", --model-timeout-seconds, "${LOCAL_AGENT_MODEL_TIMEOUT_SECONDS:-120}", --environment, local, --ready-file, /tmp/worker-ready]
    volumes:
      - local_reviewer_worker_secrets:/run/browsercloud/secrets:ro

  outcome-verifier-worker:
    <<: *local-agent-worker
    entrypoint: [/usr/bin/tini, --, python, /app/outcome_verifier_worker.py]
    command: [--control-plane-url, http://127.0.0.1:8080, --control-plane-token-file, /run/browsercloud/secrets/token, --worker-id, local-outcome-1, --deployment-id, local-outcome-v1, --model-endpoint, "${LOCAL_AGENT_MODEL_ENDPOINT:-https://model.invalid/v1/responses}", --model-api-key-file, /run/browsercloud/secrets/model-api-key, --model-name, "${LOCAL_AGENT_MODEL_NAME:-configure-real-model}", --expected-response-model, "${LOCAL_AGENT_MODEL_RESPONSE_NAME:-}", --model-revision, "${LOCAL_AGENT_MODEL_REVISION:-local-v1}", --maximum-output-tokens, "${LOCAL_AGENT_MODEL_MAXIMUM_OUTPUT_TOKENS:-512}", --model-timeout-seconds, "${LOCAL_AGENT_MODEL_TIMEOUT_SECONDS:-120}", --environment, local, --ready-file, /tmp/worker-ready]
    volumes:
      - local_outcome_worker_secrets:/run/browsercloud/secrets:ro

  vision-worker:
    <<: *local-agent-worker
    entrypoint: [/usr/bin/tini, --, python, /app/vision_worker.py]
    command: [--control-plane-url, http://127.0.0.1:8080, --control-plane-token-file, /run/browsercloud/secrets/token, --worker-id, local-vision-1, --deployment-id, local-vision-v1, --model-endpoint, "${LOCAL_AGENT_MODEL_ENDPOINT:-https://model.invalid/v1/responses}", --model-api-key-file, /run/browsercloud/secrets/model-api-key, --model-name, "${LOCAL_AGENT_MODEL_NAME:-configure-real-model}", --expected-response-model, "${LOCAL_AGENT_MODEL_RESPONSE_NAME:-}", --model-revision, "${LOCAL_AGENT_MODEL_REVISION:-local-v1}", --maximum-output-tokens, "${LOCAL_AGENT_MODEL_MAXIMUM_OUTPUT_TOKENS:-512}", --model-timeout-seconds, "${LOCAL_AGENT_MODEL_TIMEOUT_SECONDS:-120}", --environment, local, --ready-file, /tmp/worker-ready]
    volumes:
      - local_vision_worker_secrets:/run/browsercloud/secrets:ro

  browser-node:
    build:
      context: .
      dockerfile: apps/browser-node/Dockerfile
    # Non-root Chromium keeps its own sandbox; grant only namespace syscalls on top
    # of the versioned Docker default profile (no SYS_ADMIN or privileged mode).
    security_opt:
      - seccomp=./deploy/docker/chromium-seccomp.json
    environment:
      NODE_AGENT_PORT: 9090
      NODE_ID: node_compose_1
      NODE_REGION: local
      NODE_ADVERTISED_GRPC_TARGET: browser-node:9090
      CONTROL_PLANE_EVENT_TARGET: control-plane:9091
      CHROMIUM_PATH: /usr/bin/chromium
      RUNTIME_ROOT: /var/lib/browsercloud/runtime
      NODE_JOURNAL_PATH: /var/lib/browsercloud/runtime/node-journal.sqlite3
      PROFILE_STORAGE_ROOT: /var/lib/browsercloud/profiles
      STORAGE_HELPER_SOCKET: /var/run/browsercloud/helpers/storage.sock
      OBJECT_STORAGE_ENABLED: "false"
      RUST_LOG: info
      APP_ENVIRONMENT: local
      REMOTE_DESKTOP_GATEWAY_PORT: 6080
      REMOTE_DESKTOP_TICKET_SECRET: ${REMOTE_DESKTOP_TICKET_SECRET:-browsercloud-local-remote-desktop-ticket-secret-v1}
      REMOTE_DESKTOP_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ALLOW_DIRECT_NETWORK: "true"
    expose:
      - "9090"
      - "6080"
    volumes:
      - browser_runtime:/var/lib/browsercloud/runtime
      - profile_storage:/var/lib/browsercloud/profiles
      - helper_ipc:/var/run/browsercloud/helpers
    depends_on:
      browser-storage-init:
        condition: service_completed_successfully
      storage-helper:
        condition: service_started

  browser-storage-init:
    build:
      context: .
      dockerfile: apps/browser-node/Dockerfile
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /var/lib/browsercloud/runtime /var/lib/browsercloud/profiles /var/run/browsercloud/helpers
        && chown -R browsercloud:browsercloud /var/lib/browsercloud/runtime /var/lib/browsercloud/profiles /var/run/browsercloud/helpers
    volumes:
      - browser_runtime:/var/lib/browsercloud/runtime
      - profile_storage:/var/lib/browsercloud/profiles
      - helper_ipc:/var/run/browsercloud/helpers

  storage-helper:
    build:
      context: .
      dockerfile: apps/browser-node/Dockerfile
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/bin/storage-helper"]
    environment:
      APP_ENVIRONMENT: local
      OBJECT_STORAGE_ENABLED: "false"
      PROFILE_STORAGE_ROOT: /var/lib/browsercloud/profiles
      STORAGE_HELPER_SOCKET: /var/run/browsercloud/helpers/storage.sock
      RUST_LOG: info
    volumes:
      - profile_storage:/var/lib/browsercloud/profiles
      - helper_ipc:/var/run/browsercloud/helpers
    depends_on:
      browser-storage-init:
        condition: service_completed_successfully

  web-console:
    build:
      context: .
      dockerfile: apps/web-console/Dockerfile
      args:
        VITE_AUTH_MODE: local
        VITE_LOCAL_ROLES: TENANT_ADMIN,SECURITY_ADMIN,PLATFORM_ADMIN
        VITE_TENANT_ID: tenant-local
        VITE_ACTOR_ID: user-local
        VITE_ENABLE_FIXTURES: "false"
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      control-plane:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  browser_runtime:
  profile_storage:
  helper_ipc:
  local_agent_worker_secrets:
  local_reviewer_worker_secrets:
  local_outcome_worker_secrets:
  local_vision_worker_secrets:
