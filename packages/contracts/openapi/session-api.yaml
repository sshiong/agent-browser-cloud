        sessionId: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        specHash: {type: string, pattern: "^[a-f0-9]{64}$"}
        locked: {type: boolean, const: true}
        spec: {$ref: "#/components/schemas/SessionIdentitySpecInput"}
        lockedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateSessionIdentityChangeRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, proposedSpec, reason]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        proposedSpec: {$ref: "#/components/schemas/SessionIdentitySpecInput"}
        reason: {type: string, minLength: 1, maxLength: 1000}
    SessionIdentityChangeRequest:
      type: object
      additionalProperties: false
      required: [requestId, sessionId, expectedVersion, proposedSpecHash, proposedSpec, reason, state, createdBy, decidedBy, createdAt, decidedAt, appliedAt]
      properties:
        requestId: {type: string, pattern: "^sicr_[A-Za-z0-9]{20}$"}
        sessionId: {type: string}
        expectedVersion: {type: integer, format: int64, minimum: 1}
        proposedSpecHash: {type: string, pattern: "^[a-f0-9]{64}$"}
        proposedSpec: {$ref: "#/components/schemas/SessionIdentitySpecInput"}
        reason: {type: string, maxLength: 1000}
        state: {type: string, enum: [PENDING, APPROVED, REJECTED, APPLIED, STALE]}
        createdBy: {type: string}
        decidedBy: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
        decidedAt: {type: [string, "null"], format: date-time}
        appliedAt: {type: [string, "null"], format: date-time}
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [tenantId, profileId]
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 128
          deprecated: true
          description: Backward-compatible request field. It must equal the authenticated tenant claim and cannot select a tenant.
        profileId:
          type: string
          minLength: 1
          maxLength: 128
        runtimeBuildId:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,128}$"
          description: Optional approved Runtime Build. Workspace default is bound when omitted.
        applicationId:
          type: string
          pattern: "^[a-zA-Z0-9_.-]{1,128}$"
          description: Optional enabled tenant Application Recovery Contract bound immutably at creation.
        groupId:
          type: string
          pattern: "^grp_[a-zA-Z0-9]{16,32}$"
          description: Optional Workspace Group. Its AUTO defaults apply only when resourcePolicy is omitted.
        tagIds:
          type: array
          maxItems: 16
          uniqueItems: true
          description: Optional tenant-owned Workspace Tags assigned transactionally at creation.
          items:
            type: string
            pattern: "^tag_[a-zA-Z0-9]{16,32}$"
        region:
          type: string
          pattern: "^[a-z0-9-]{1,32}$"
        proxyBindingProfileId:
          type: string
          pattern: "^pbind_[a-zA-Z0-9]{16,32}$"
          description: Optional tenant Binding profile snapshotted immutably at Session creation.
        resourcePolicy:
          $ref: "#/components/schemas/ResourcePolicyRequest"
        requestedTabs:
          type: integer
          minimum: 0
          maximum: 64
          default: 1
        agentActionsPerMinute:
          type: integer
          minimum: 0
          maximum: 600
          default: 0
        remoteDesktop:
          type: boolean
          default: false
        humanTakeoverEnabled:
          type: boolean
          description: Optional create-time override. Workspace default is bound when omitted.
        agentPolicy:
          $ref: "#/components/schemas/AgentPolicy"
          description: Optional immutable Agent policy. Defaults to BALANCED when omitted.
        web3Workload:
          type: boolean
          default: false
        mediaWorkload:
          type: boolean
          default: false
        requestedMediaStreams:
          type: integer
          minimum: 0
          maximum: 32
          default: 0
        mediaBitrateKbps:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
        videoRecording:
          type: boolean
          default: false
          description: Enables independent CDP pixel recording. Segments are committed through Storage Helper and Object Storage.
        extensionIds:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-zA-Z0-9_.-]{1,128}$"
        metadata:
          type: object
          maxProperties: 32
          propertyNames:
            minLength: 1
            maxLength: 128
          additionalProperties:
            type: string
            maxLength: 1024
        identitySpec:
          $ref: "#/components/schemas/SessionIdentitySpecInput"
          description: Creation-time Browser identity. It becomes locked immediately after Session creation.
    CreateSessionResponse:
      type: object
      additionalProperties: false
      required: [sessionId, state, resourcePolicy, context]
      properties:
        sessionId:
          type: string
        operationId:
          type: [string, "null"]
        state:
