openapi: 3.1.0
info:
  title: Agent Browser Cloud API
  version: 1.0.0
  description: Control Plane Session API v1.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Same-origin API endpoint
security:
  - bearerAuth: []
paths:
  /api/v1/workspace-overview:
    get:
      operationId: getWorkspaceOverview
      summary: Get the authenticated workspace's authoritative operational overview
      description: >
        Returns one tenant-scoped PostgreSQL snapshot covering Sessions, active
        Operations, Browser Node capacity, Proxy bindings, Agent tasks, current
        resource cost and recent security signals. Browser Node health is a global
        infrastructure projection visible only to Platform Admins; all tenant-owned
        counts remain tenant isolated.
      tags: [WorkspaceOverview]
      responses:
        "200":
          description: Current authoritative Workspace overview and stream cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceOverview"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspace-overview/event-stream:
    get:
      operationId: streamWorkspaceOverviewChanges
      summary: Stream resumable invalidations for the authenticated Workspace overview
      description: >
        Emits payload-free change notifications. Clients resume with Last-Event-ID
        and refetch the authoritative overview after each event; telemetry samples
        alone do not invalidate the stream.
      tags: [WorkspaceOverview]
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: Resumable Workspace overview Server-Sent Event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/coordinator/tenant-route:
    get:
      operationId: getTenantCoordinatorRoute
      summary: Get the authenticated tenant's authoritative Coordinator route
      tags: [Coordinator]
      responses:
        "200":
          description: Current active and pending tenant route epochs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantRoute"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/coordinator/tenant-route/migration:
    get:
      operationId: getLatestTenantCoordinatorRouteMigration
      summary: Get the latest durable tenant route migration
      tags: [Coordinator]
      responses:
        "200":
          description: Latest migration and safe-point reconciliation progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantRouteMigration"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/coordinator/tenant-route/migrations:
    post:
      operationId: requestTenantCoordinatorRouteMigration
      summary: Repartition a hot tenant using safe-point migration and Route Epoch fencing
      tags: [Coordinator]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestTenantRouteMigration"
      responses:
        "200":
          description: Durable migration accepted or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantRouteMigration"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/search:
    get:
      operationId: globalSearch
      summary: Search authorized workspace resources
      description: >
        Performs a bounded, tenant-scoped search across Sessions, Profiles,
        Groups and Tags. Runtime and Browser Node results follow their existing
        resource-level visibility; Node matches are omitted for non-admin
        identities. Secret values and browser content are never indexed or returned.
      tags: [Search]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 128
        - name: types
          in: query
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: "#/components/schemas/SearchResourceType"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 24
      responses:
        "200":
          description: Ranked authorized search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/notifications:
    get:
      operationId: listWorkspaceNotifications
      summary: List the authenticated actor's workspace notifications
      description: >
        Returns a bounded tenant-scoped projection of high-signal immutable audit events.
        Read state is held in PostgreSQL per authenticated actor and is shared by Web and
        Tauri clients. The feed starts at feature deployment and retains entries for 90 days.
      tags: [Notification]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 30
        - name: beforeSequence
          in: query
          description: Exclusive audit sequence cursor for older entries.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Current notification page and durable actor read state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceNotificationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/notifications/event-stream:
    get:
      operationId: streamWorkspaceNotificationChanges
      summary: Stream resumable workspace notification invalidations
      description: >
        Emits payload-free tenant-scoped changes ordered by the immutable Audit sequence.
        Clients resume with Last-Event-ID and refetch the authoritative notification feed;
        notification contents and actor read state are never copied into the stream.
      tags: [Notification]
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: Resumable workspace notification Server-Sent Event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/notifications/read-cursor:
    patch:
      operationId: updateWorkspaceNotificationReadCursor
      summary: Monotonically advance the authenticated actor's notification read cursor
      description: >
        The requested sequence must not exceed the current tenant notification head.
        Repeated or older cursor updates are idempotent and never make notifications unread.
      tags: [Notification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationReadCursorRequest"
      responses:
        "200":
          description: Committed read cursor and remaining unread count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceNotificationReadState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/user-preferences:
    get:
      operationId: getUserPreferences
      summary: Get the authenticated actor's durable UI preferences
      description: >
        Returns tenant-and-actor scoped preferences shared by Web and Tauri clients.
        Actors without a stored row resolve to SYSTEM without requiring a database backfill.
      tags: [UserPreference]
      responses:
        "200":
          description: Current actor preference or the system default.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateUserPreferences
      summary: Persist the authenticated actor's UI preferences
      description: >
        The tenant and actor are always derived from the authenticated identity. Repeating
        the same theme mode is idempotent and does not advance the persisted version.
      tags: [UserPreference]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPreferencesRequest"
      responses:
        "200":
          description: Persisted actor preference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/sessions:
    post:
      operationId: createSession
      summary: Create a Session
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created, or the original idempotent result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listSessions
      summary: List tenant Sessions
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/SessionState"
        - name: q
          in: query
          description: Tenant-scoped search across Session ID, display name, Profile, region, resource class, and governed metadata.
          schema:
            type: string
            maxLength: 128
        - name: groupId
          in: query
          description: Restrict results to one tenant-owned Workspace Group.
          schema:
            type: string
            pattern: "^grp_[a-zA-Z0-9]{16,32}$"
        - name: tagId
          in: query
          description: Repeat to filter by multiple tenant-owned Workspace Tags.
          schema:
            type: array
            maxItems: 16
            items:
              type: string
              pattern: "^tag_[a-zA-Z0-9]{16,32}$"
          style: form
          explode: true
        - name: tagMatch
          in: query
          description: Match any selected Tag or require all selected Tags.
          schema:
            type: string
            enum: [ANY, ALL]
            default: ANY
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Tenant-scoped Session list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sessions:batch-delete:
    post:
      operationId: batchDeleteSessions
      summary: Soft-delete tenant Sessions atomically
      description: >-
        Removes CREATED, HIBERNATED or TERMINATED Sessions with no active Operation from normal control-plane
        reads. Audit, recording, and recovery evidence remain retained. The whole batch is rejected
        if any Session is missing, cross-tenant, active, or in a non-deletable state.
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchDeleteSessionsRequest"
      responses:
        "200":
          description: Sessions deleted, or the original idempotent result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDeleteSessionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}:
    get:
      operationId: getSession
      summary: Get Session details
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Session detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionView"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSession
      summary: Update operator-owned Session presentation fields
      description: Renames a tenant-owned Session without changing its runtime identity, Profile, or active Operation.
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
      responses:
        "200":
          description: Updated tenant-scoped Session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/state:
    get:
      operationId: getBrowserState
      summary: Get the latest Browser Current State
      tags: [Session, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Latest tenant-scoped Browser State.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "204":
          description: The Runtime has not submitted a state yet.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/agent-browser/snapshot:
    get:
      operationId: getAgentBrowserSnapshot
      summary: Get one PostgreSQL-authoritative structured page snapshot
      description: Returns DOM/accessibility-derived interactive state. Ordinary pages do not require OCR or screenshots.
      tags: [Session, Agent, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Structured snapshot and cursor for subsequent inspect or action calls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBrowserSnapshot"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/sessions/{sessionId}/agent-browser/inspect:
    post:
      operationId: inspectAgentBrowserElements
      summary: Inspect structured elements without another Browser Node round trip
      tags: [Session, Agent, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentBrowserInspectRequest"
      responses:
        "200":
          description: Requested elements from the exact state cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBrowserTargetList"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/sessions/{sessionId}/agent-browser/find:
    post:
      operationId: findAgentBrowserElements
      summary: Find structured elements by semantic name, role, type, stable ID, or visibility reason
      tags: [Session, Agent, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentBrowserFindRequest"
      responses:
        "200":
          description: Bounded semantic matches from the authoritative current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBrowserTargetList"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/sessions/{sessionId}/agent-browser/execute-actions:
    post:
      operationId: executeAgentBrowserActions
      summary: Execute one ordered state-fenced Browser action batch
      description: >
        Provides the browser.execute_actions fast path. The gateway validates one authoritative
        state cursor, persists one auditable Agent Task, executes primitives in order, checks state
        between actions, honors stopOnError, and yields to real VNC input without forcing takeover.
      tags: [Session, Agent, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteAgentBrowserActionsRequest"
      responses:
        "200":
          description: Persisted task after immediate execution or durable enqueue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/sessions/{sessionId}/agent-browser/evaluations:
    post:
      operationId: createAgentBrowserEvaluation
      summary: Execute one governed, state-fenced JavaScript evaluation
      description: >
        Runs bounded JavaScript against the exact active Page Target. READ_ONLY asks Chromium to
        reject side effects; PAGE_ACTION may mutate the page after intent policy checks. Script
        source is sealed for Node delivery and is never returned or copied to ordinary audit rows.
        Cookie, credential, storage, clipboard, network, navigation and tab escape APIs are rejected.
      tags: [Session, Agent, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentBrowserEvaluationRequest"
      responses:
        "202":
          description: The exclusive PostgreSQL-authoritative evaluation is executing or reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBrowserEvaluation"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/sessions/{sessionId}/agent-browser/evaluations/{evaluationId}:
    get:
      operationId: getAgentBrowserEvaluation
      summary: Read or wait for one governed JavaScript evaluation
      description: Bounded waiting rereads PostgreSQL only; it never polls Chromium.
      tags: [Session, Agent, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: evaluationId
          in: path
          required: true
          schema: {type: string, pattern: "^aje_[A-Za-z0-9]{20}$"}
        - name: waitMs
          in: query
          required: false
          schema: {type: integer, minimum: 0, maximum: 30000, default: 0}
      responses:
        "200":
          description: Actor-scoped bounded result; script source is never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBrowserEvaluation"
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          description: The evaluation did not become terminal within the bounded wait.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/sessions/{sessionId}/agent-browser/screenshots:
    post:
      operationId: captureAgentBrowserScreenshot
      summary: Capture one state-fenced, redacted Agent screenshot
      description: >
        Captures the exact active Page Target as a viewport, full page, structured element,
        bounded region, or challenge region. The response contains metadata only. Pixels remain
        in immutable evidence storage and can be retrieved once through the purpose-bound grant.
      tags: [Session, Agent, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureAgentBrowserScreenshotRequest"
      responses:
        "202":
          description: The durable screenshot command is executing or was idempotently reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBrowserScreenshot"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/sessions/{sessionId}/agent-browser/screenshots/{screenshotId}:
    get:
      operationId: getAgentBrowserScreenshot
      summary: Read or wait for one PostgreSQL-authoritative screenshot lifecycle
      description: Bounded waiting rereads PostgreSQL only; it never polls Chromium or Object Storage.
      tags: [Session, Agent, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: screenshotId
          in: path
          required: true
          schema: {type: string, pattern: "^shot_[A-Za-z0-9]{20}$"}
        - name: waitMs
          in: query
          required: false
          schema: {type: integer, minimum: 0, maximum: 30000, default: 0}
      responses:
        "200":
          description: Actor-scoped screenshot metadata without pixels, object paths, or signed URLs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBrowserScreenshot"
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          description: The screenshot did not become terminal within the bounded wait.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/sessions/{sessionId}/agent-browser/screenshots/{screenshotId}:redeem:
    post:
      operationId: redeemAgentBrowserScreenshot
      summary: Redeem the screenshot's actor-bound one-time access grant
      description: Returns one short-lived exact-object URL and consumes the AGENT_PERCEPTION grant.
      tags: [Session, Agent, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: screenshotId
          in: path
          required: true
          schema: {type: string, pattern: "^shot_[A-Za-z0-9]{20}$"}
      responses:
        "200":
          description: One-time screenshot access has been redeemed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemEvidenceAccessResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/sessions/{sessionId}/agent-browser/clipboard:
    get:
      operationId: readAgentClipboard
      summary: Read only the encrypted AgentClipboard
      description: Never reads or aliases the VNC/X11 UserClipboard.
      tags: [Session, Agent]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: includeValue
          in: query
          required: false
          description: Set false for metadata-only reads that never decrypt plaintext.
          schema: {type: boolean, default: true}
      responses:
        "200":
          description: Current AgentClipboard; value is null when empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentClipboard"
    put:
      operationId: writeAgentClipboard
      summary: Replace the isolated AgentClipboard using optimistic concurrency
      tags: [Session, Agent]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteAgentClipboardRequest"
      responses:
        "200":
          description: Updated metadata; plaintext is not reflected by write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentClipboard"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: clearAgentClipboard
      summary: Clear the isolated AgentClipboard using optimistic concurrency
      tags: [Session, Agent]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: expectedVersion
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        "200":
          description: Cleared AgentClipboard metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentClipboard"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}/agent-browser/clipboard-bridges:
    post:
      operationId: createAgentClipboardBridge
      summary: Explicitly bridge one current RFB UserClipboard and the isolated AgentClipboard
      description: >
        Client-mediated, actor/connection/purpose-bound transfer. USER_TO_AGENT requires a fresh
        RFB ServerCutText observation. AGENT_TO_USER returns one short-lived value for injection
        through the same non-view-only noVNC connection and must then be completed. Passwords and
        OTPs remain on the purpose-bound one-time sensitive-input API. Plaintext is never audited.
      tags: [Session, Agent]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentClipboardBridgeRequest"
      responses:
        "200":
          description: Transfer completed or an actor-bound AGENT_TO_USER delivery was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentClipboardBridge"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/sessions/{sessionId}/agent-browser/clipboard-bridges/{bridgeId}:complete:
    post:
      operationId: completeAgentClipboardBridge
      summary: Confirm that one issued Agent-to-User bridge was injected into RFB/X11
      tags: [Session, Agent]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: bridgeId
          in: path
          required: true
          schema: {type: string, pattern: "^acb_[A-Za-z0-9]{20}$"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteAgentClipboardBridgeRequest"
      responses:
        "200":
          description: Delivery was acknowledged; the bridge ledger contains no content material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentClipboardBridge"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/sessions/{sessionId}/agent-browser/files/uploads:
    post:
      operationId: uploadAgentBrowserFile
      summary: Stream one bounded file to the Session Node and set an exact file input through CDP
      description: >
        File bytes travel only over the authenticated Control Plane to exact Browser Node stream.
        PostgreSQL stores tenant-scoped lifecycle metadata and the durable Operation; public
        responses and audit never contain bytes or Node-local paths. No OS file chooser is opened.
      tags: [Session, Agent, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadAgentBrowserFileRequest"
      responses:
        "202":
          description: File is staged and its durable state-fenced Node command is executing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBrowserFileUpload"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/sessions/{sessionId}/agent-browser/files/uploads/{uploadId}:
    get:
      operationId: getAgentBrowserFileUpload
      summary: Read the PostgreSQL-authoritative file upload lifecycle
      tags: [Session, Agent, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: uploadId
          in: path
          required: true
          schema: {type: string, pattern: "^afu_[A-Za-z0-9]{20}$"}
      responses:
        "200":
          description: Tenant-scoped upload metadata; bytes and local paths are absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBrowserFileUpload"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/agent-browser/files/downloads:
    get:
      operationId: listAgentBrowserDownloads
      summary: List the PostgreSQL-authoritative Browser download lifecycle
      description: Download URLs and Node-local paths are never returned.
      tags: [Session, Agent, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Current bounded download projection and evidence freshness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBrowserDownloadList"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}/agent-browser/files/downloads/{downloadId}:wait:
    get:
      operationId: waitForAgentBrowserDownload
      summary: Wait for one download to reach a terminal authoritative state
      description: Bounded waiter rereads PostgreSQL only; it never polls the Browser.
      tags: [Session, Agent, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: downloadId
          in: path
          required: true
          schema: {type: string, pattern: "^dld_[0-9a-f]{20}$"}
        - name: timeoutMs
          in: query
          required: false
          schema: {type: integer, minimum: 100, maximum: 30000, default: 30000}
      responses:
        "200":
          description: Completed, canceled, or interrupted download state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBrowserDownload"
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          description: Download did not reach a terminal state before the bounded timeout.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/sessions/{sessionId}/identity-spec:
    get:
      operationId: getSessionIdentitySpec
      summary: Read the creation-time locked Browser identity specification
      tags: [Session, Agent]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: PostgreSQL-authoritative identity spec applied on every Runtime start.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionIdentitySpec"
    put:
      operationId: rejectDirectSessionIdentityMutation
      summary: Explicitly reject direct post-creation identity mutation
      tags: [Session, Agent]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionIdentitySpecInput"
      responses:
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}/identity-change-requests:
    post:
      operationId: createSessionIdentityChangeRequest
      summary: Request an approval-backed identity change for a safe restart boundary
      tags: [Session, Agent]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionIdentityChangeRequest"
      responses:
        "200":
          description: Durable pending or idempotently replayed change request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionIdentityChangeRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/session-identity-change-requests/{requestId}:approve:
    post:
      operationId: approveSessionIdentityChangeRequest
      summary: Approve a tenant Session identity change
      tags: [Session, Administration]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: {type: string, pattern: "^sicr_[A-Za-z0-9]{20}$"}
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Decided change request.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionIdentityChangeRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/session-identity-change-requests/{requestId}:reject:
    post:
      operationId: rejectSessionIdentityChangeRequest
      summary: Reject a tenant Session identity change
      tags: [Session, Administration]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: {type: string, pattern: "^sicr_[A-Za-z0-9]{20}$"}
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Decided change request.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionIdentityChangeRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/session-identity-change-requests/{requestId}:apply:
    post:
      operationId: applySessionIdentityChangeRequest
      summary: Apply an approved identity change while the Runtime is safely stopped
      tags: [Session, Administration]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: {type: string, pattern: "^sicr_[A-Za-z0-9]{20}$"}
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Applied change request.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionIdentityChangeRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/sessions/{sessionId}/resources:
    get:
      operationId: getSessionResources
      summary: Get the authoritative Session resource policy, allocation and real telemetry
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Resource state. Usage is null until Browser Node telemetry exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResource"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/resource-events:
    get:
      operationId: listSessionResourceEvents
      summary: List the PostgreSQL-backed resource adjustment timeline
