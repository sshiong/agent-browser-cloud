          type: [string, "null"]
    AgentPlan:
      type: object
      additionalProperties: false
      required: [intentId, steps, maxActions, replanBudget, expiresAt]
      properties:
        intentId:
          type: string
        steps:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AgentPlanStep"
        maxActions:
          type: integer
          minimum: 1
          maximum: 20
        replanBudget:
          type: integer
          minimum: 0
          maximum: 3
        expiresAt:
          type: string
          format: date-time
    AgentPlanStep:
      type: object
      additionalProperties: false
      required:
        - stepId
        - toolId
        - riskClass
        - targetUrl
        - input
        - rationale
        - supportingSources
        - trustFloor
        - taintLabels
        - requiredConfirmation
        - strategy
        - requiredStateQuality
        - verification
        - capabilityTokenId
      properties:
        stepId:
          type: string
        toolId:
          type: string
          enum:
            - NAVIGATE
            - GET_CURRENT_STATE
            - CLICK_TARGET
            - TYPE_TEXT
            - SCROLL
            - WAIT_FOR
            - GET_URL
            - GET_PAGE_SUMMARY
            - REQUEST_HUMAN_TAKEOVER
        riskClass:
          $ref: "#/components/schemas/AgentRiskClass"
        targetUrl:
          type: [string, "null"]
        input:
          oneOf:
            - $ref: "#/components/schemas/AgentStepInput"
            - type: "null"
        rationale:
          type: string
        supportingSources:
          type: array
          items:
            type: string
        trustFloor:
          type: string
          enum: [TRUSTED, RESTRICTED, UNTRUSTED]
        taintLabels:
          type: array
          items:
            type: string
        requiredConfirmation:
          type: boolean
        strategy:
          type: string
          enum:
            - SEMANTIC_DOM
            - ACCESSIBILITY
            - DESKTOP_INPUT
            - VISION_DESKTOP
            - HUMAN_ASSIST
            - HUMAN_TAKEOVER
        requiredStateQuality:
          type: string
        verification:
          type: string
        capabilityTokenId:
          type: string
          description: Non-secret handle. The signed bearer token is never returned to the console.
    AgentStepInput:
      type: object
      additionalProperties: false
      required:
        - targetRef
        - targetRevision
        - payloadHash
        - payloadLength
        - dataClass
        - scrollDeltaY
        - waitCondition
        - timeoutMs
      properties:
        targetRef:
          type: [string, "null"]
        targetRevision:
          type: [integer, "null"]
          format: int64
        payloadHash:
          type: [string, "null"]
          description: Hash of sealed input; plaintext and ciphertext are never returned.
        payloadLength:
          type: [integer, "null"]
        dataClass:
          type: [string, "null"]
        scrollDeltaY:
          type: [integer, "null"]
        waitCondition:
          type: [string, "null"]
        timeoutMs:
          type: [integer, "null"]
    AgentRiskClass:
      type: string
      enum:
        - R0_READ_ONLY
        - R1_LOW_RISK_CHANGE
        - R2_DATA_CHANGE
        - R3_ACCOUNT_CHANGE
        - R4_FINANCIAL
        - R5_SECURITY
    AgentPolicy:
      type: string
      enum: [DISABLED, RESTRICTED, BALANCED, INTERACTIVE]
      description: >
        Immutable Session-scoped Agent capability and budget policy.
        DISABLED rejects every task; RESTRICTED permits observation and human
        handoff only; BALANCED and INTERACTIVE permit the bounded tool set with
        progressively larger action and replan budgets.
    AgentToolExecutionResult:
      type: object
      additionalProperties: false
      required:
        - stepId
        - toolId
        - status
        - resultHash
        - output
        - verification
        - completedAt
      properties:
        stepId:
          type: string
        toolId:
          type: string
          enum:
            - NAVIGATE
            - GET_CURRENT_STATE
            - CLICK_TARGET
            - TYPE_TEXT
            - SCROLL
            - WAIT_FOR
            - GET_URL
            - GET_PAGE_SUMMARY
            - REQUEST_HUMAN_TAKEOVER
        status:
          type: string
          enum: [VERIFIED, WAITING_FOR_HUMAN, ACCEPTED]
        resultHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        output:
          type: object
          additionalProperties: true
        verification:
          type: string
        completedAt:
          type: string
          format: date-time
    PromptSecurityEvent:
