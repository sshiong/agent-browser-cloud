name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy,rustfmt

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.17.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: |
            apps/web-console/pnpm-lock.yaml
            sdks/typescript/pnpm-lock.yaml

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.22.x"
          cache-dependency-path: deploy/terraform/provider/go.sum

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: "1.50.0"

      - name: Install frontend dependencies
        run: pnpm --dir apps/web-console install --frozen-lockfile

      - name: Install generated SDK dependencies
        run: pnpm --dir sdks/typescript install --frozen-lockfile

      - name: Check protobuf compatibility
        if: github.event_name == 'pull_request'
        working-directory: packages/contracts
        run: buf breaking --against "../../.git#commit=${{ github.event.pull_request.base.sha }},subdir=packages/contracts"

      - name: Verify
        run: make ci

      - name: Build
        run: make build

      - name: Build Application Adapter image
        run: docker build -f apps/application-adapter/Dockerfile -t application-adapter:ci apps/application-adapter

      - name: Build Runtime Validation Worker image
        run: docker build -f apps/validation-worker/Dockerfile -t validation-worker:ci apps/validation-worker

      - name: Build Recovery GameDay Worker image
        run: docker build -f apps/gameday-worker/Dockerfile -t gameday-worker:ci apps/gameday-worker

      - name: Build Agent Worker image
        run: docker build -f apps/agent-worker/Dockerfile -t agent-worker:ci apps/agent-worker

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: browsercloud-sbom.cdx.json

      - name: Scan source and dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browsercloud-supply-chain-evidence
          path: browsercloud-sbom.cdx.json
          if-no-files-found: error

      - name: Integration smoke test
        run: make test-integration

      - name: Object Storage checkpoint and recording GameDay
        run: make test-object-storage

  kubernetes-operator-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The N/N-1 drill builds the previous committed Operator implementation.
          fetch-depth: 0

      - name: Install pinned Kind
        run: |
          curl --fail --location --retry 5 \
            --output /tmp/kind \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind" \
            | sha256sum --check
          chmod +x /tmp/kind

      - name: Run Kubernetes operator E2E
        run: KIND_BIN=/tmp/kind make test-kubernetes-e2e
