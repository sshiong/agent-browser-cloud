openapi: 3.1.0
info:
  title: Agent Browser Cloud API
  version: 1.0.0
  description: Control Plane Session API v1.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Same-origin API endpoint
security:
  - bearerAuth: []
paths:
  /api/v1/workspace-overview:
    get:
      operationId: getWorkspaceOverview
      summary: Get the authenticated workspace's authoritative operational overview
      description: >
        Returns one tenant-scoped PostgreSQL snapshot covering Sessions, active
        Operations, Browser Node capacity, Proxy bindings, Agent tasks, current
        resource cost and recent security signals. Browser Node health is a global
        infrastructure projection visible only to Platform Admins; all tenant-owned
        counts remain tenant isolated.
      tags: [WorkspaceOverview]
      responses:
        "200":
          description: Current authoritative Workspace overview and stream cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceOverview"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/workspace-overview/event-stream:
    get:
      operationId: streamWorkspaceOverviewChanges
      summary: Stream resumable invalidations for the authenticated Workspace overview
      description: >
        Emits payload-free change notifications. Clients resume with Last-Event-ID
        and refetch the authoritative overview after each event; telemetry samples
        alone do not invalidate the stream.
      tags: [WorkspaceOverview]
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: Resumable Workspace overview Server-Sent Event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/coordinator/tenant-route:
    get:
      operationId: getTenantCoordinatorRoute
      summary: Get the authenticated tenant's authoritative Coordinator route
      tags: [Coordinator]
      responses:
        "200":
          description: Current active and pending tenant route epochs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantRoute"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/coordinator/tenant-route/migration:
    get:
      operationId: getLatestTenantCoordinatorRouteMigration
      summary: Get the latest durable tenant route migration
      tags: [Coordinator]
      responses:
        "200":
          description: Latest migration and safe-point reconciliation progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantRouteMigration"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/coordinator/tenant-route/migrations:
    post:
      operationId: requestTenantCoordinatorRouteMigration
      summary: Repartition a hot tenant using safe-point migration and Route Epoch fencing
      tags: [Coordinator]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestTenantRouteMigration"
      responses:
        "200":
          description: Durable migration accepted or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantRouteMigration"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/search:
    get:
      operationId: globalSearch
      summary: Search authorized workspace resources
      description: >
        Performs a bounded, tenant-scoped search across Sessions, Profiles,
        Groups and Tags. Runtime and Browser Node results follow their existing
        resource-level visibility; Node matches are omitted for non-admin
        identities. Secret values and browser content are never indexed or returned.
      tags: [Search]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 128
        - name: types
          in: query
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: "#/components/schemas/SearchResourceType"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 24
      responses:
        "200":
          description: Ranked authorized search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/notifications:
    get:
      operationId: listWorkspaceNotifications
      summary: List the authenticated actor's workspace notifications
      description: >
        Returns a bounded tenant-scoped projection of high-signal immutable audit events.
        Read state is held in PostgreSQL per authenticated actor and is shared by Web and
        Tauri clients. The feed starts at feature deployment and retains entries for 90 days.
      tags: [Notification]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 30
        - name: beforeSequence
          in: query
          description: Exclusive audit sequence cursor for older entries.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Current notification page and durable actor read state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceNotificationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/notifications/read-cursor:
    patch:
      operationId: updateWorkspaceNotificationReadCursor
      summary: Monotonically advance the authenticated actor's notification read cursor
      description: >
        The requested sequence must not exceed the current tenant notification head.
        Repeated or older cursor updates are idempotent and never make notifications unread.
      tags: [Notification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationReadCursorRequest"
      responses:
        "200":
          description: Committed read cursor and remaining unread count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceNotificationReadState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/user-preferences:
    get:
      operationId: getUserPreferences
      summary: Get the authenticated actor's durable UI preferences
      description: >
        Returns tenant-and-actor scoped preferences shared by Web and Tauri clients.
        Actors without a stored row resolve to SYSTEM without requiring a database backfill.
      tags: [UserPreference]
      responses:
        "200":
          description: Current actor preference or the system default.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateUserPreferences
      summary: Persist the authenticated actor's UI preferences
      description: >
        The tenant and actor are always derived from the authenticated identity. Repeating
        the same theme mode is idempotent and does not advance the persisted version.
      tags: [UserPreference]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPreferencesRequest"
      responses:
        "200":
          description: Persisted actor preference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/sessions:
    post:
      operationId: createSession
      summary: Create a Session
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created, or the original idempotent result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listSessions
      summary: List tenant Sessions
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/SessionState"
        - name: q
          in: query
          description: Tenant-scoped search across Session ID, display name, Profile, region, resource class, and governed metadata.
          schema:
            type: string
            maxLength: 128
        - name: groupId
          in: query
          description: Restrict results to one tenant-owned Workspace Group.
          schema:
            type: string
            pattern: "^grp_[a-zA-Z0-9]{16,32}$"
        - name: tagId
          in: query
          description: Repeat to filter by multiple tenant-owned Workspace Tags.
          schema:
            type: array
            maxItems: 16
            items:
              type: string
              pattern: "^tag_[a-zA-Z0-9]{16,32}$"
          style: form
          explode: true
        - name: tagMatch
          in: query
          description: Match any selected Tag or require all selected Tags.
          schema:
            type: string
            enum: [ANY, ALL]
            default: ANY
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Tenant-scoped Session list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sessions/{sessionId}:
    get:
      operationId: getSession
      summary: Get Session details
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Session detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionView"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/state:
    get:
      operationId: getBrowserState
      summary: Get the latest Browser Current State
      tags: [Session, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Latest tenant-scoped Browser State.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "204":
          description: The Runtime has not submitted a state yet.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/resources:
    get:
      operationId: getSessionResources
      summary: Get the authoritative Session resource policy, allocation and real telemetry
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Resource state. Usage is null until Browser Node telemetry exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResource"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/resource-events:
    get:
      operationId: listSessionResourceEvents
      summary: List the PostgreSQL-backed resource adjustment timeline
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Resource policy and adjustment events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceEventList"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/evidence:
    get:
      operationId: listSessionEvidence
      summary: List tenant-scoped real screenshot evidence metadata
      description: >
        Lists the durable metadata index for real CDP screenshots committed through the
        privileged Storage Helper. Raw pixels and internal object-storage keys are not returned.
      tags: [Session, Evidence]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Screenshot evidence metadata ordered newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceList"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/evidence:capture:
    post:
      operationId: captureSessionEvidence
      summary: Request an administrator-governed real Observer screenshot
      description: >
        Requires a tenant/security/platform administrator. The request is durable and
        idempotent; EXECUTING becomes COMMITTED or FAILED only after the Browser Node
        submits real evidence or the command is dead-lettered. Capture is rejected during
        HumanTakeover. No screenshot bytes cross this API.
      tags: [Session, Evidence]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureEvidenceRequest"
      responses:
        "202":
          description: Durable capture request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceCapture"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}/evidence-captures/{captureId}:
    get:
      operationId: getSessionEvidenceCapture
      summary: Read the durable Observer capture request state
      tags: [Session, Evidence]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: captureId
          in: path
          required: true
          schema:
            type: string
            pattern: "^cap_[a-zA-Z0-9]{16,}$"
      responses:
        "200":
          description: Current capture request state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceCapture"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/evidence/{evidenceId}/access-grants:
    post:
      operationId: createSessionEvidenceAccessGrant
      summary: Create a purpose-bound one-time evidence access grant
      description: >
        Requires a tenant/security/platform administrator. The grant is bound to the
        authenticated actor, Session, immutable evidence object and declared purpose, and
        expires within five minutes. It does not contain storage coordinates or a signed URL.
      tags: [Session, Evidence]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
            pattern: "^evd_[a-zA-Z0-9]{16,}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvidenceAccessGrantRequest"
      responses:
        "201":
          description: One-time access grant issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceAccessGrant"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}/evidence-access-grants/{grantId}:redeem:
    post:
      operationId: redeemSessionEvidenceAccessGrant
      summary: Redeem an evidence access grant exactly once
      description: >
        Only the actor who created the unexpired grant may redeem it. The Browser Node signs
        one exact immutable screenshot object for 60 seconds over internal mTLS. The returned
        URL is ephemeral and is never persisted or written to audit logs.
      tags: [Session, Evidence]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: grantId
          in: path
          required: true
          schema:
            type: string
            pattern: "^egr_[a-zA-Z0-9]{16,}$"
      responses:
        "200":
          description: Ephemeral exact-object access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemEvidenceAccessResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/sessions/{sessionId}/resource-stream:
    get:
      operationId: streamSessionResourceChanges
      summary: Stream durable Session resource changes with resumable SSE
      description: >
        Emits PostgreSQL-backed resource sample, adjustment and application safety lease
        change notifications.
        Reconnect with Last-Event-ID to replay changes after the last processed monotonic
        sequence. The event data identifies the durable row; clients then refresh the
        authoritative resource, timeline, safe-point and migration views.
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: Last-Event-ID
          in: header
          required: false
          description: Last successfully processed numeric resource stream sequence.
          schema:
            type: string
            pattern: "^[0-9]+$"
      responses:
        "200":
          description: >
            SSE stream. Events are resource-stream-ready, resource-stream-reset and
            session-resource-change; keepalive comments do not advance the cursor.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Per-process or per-Session live subscriber bound reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/sessions/{sessionId}/event-stream:
    get:
      operationId: streamSessionChanges
      summary: Stream the canonical durable Session change feed with resumable SSE
      description: >
        Emits payload-free invalidation envelopes for Session lifecycle, Browser Current
        State, audit, Operation, Agent task, resource and application safety lease
        changes. Reconnect with
        Last-Event-ID to replay committed envelopes after the last processed per-Session
        monotonic sequence. Clients refresh the corresponding authoritative REST view;
        the stream never duplicates Browser state or audit details.
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: Last-Event-ID
          in: header
          required: false
          description: Last successfully processed numeric Session stream sequence.
          schema:
            type: string
            pattern: "^[0-9]+$"
      responses:
        "200":
          description: >
            SSE stream. Events are session-stream-ready, session-stream-reset and
            session-change; keepalive comments do not advance the cursor.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Per-process or per-Session live subscriber bound reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/sessions/{sessionId}/safe-point:
    get:
      operationId: getSessionSafePoint
      summary: Assess whether a Session is at a migration-safe point
      description: Fail-closed aggregation of fresh Browser Node input observations and durable control-plane blockers.
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant-scoped safe-point assessment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSafePoint"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/safety-leases:
    post:
      operationId: acquireSessionSafetyLease
      summary: Acquire an application business-activity Safe Point lease
      description: >
        Application adapters acquire a short owner-bound lease before file transfer,
        SPA/form submission, payment/account-security work, critical transactions or while
        business recovery is unknown. Active leases block migration and hibernation. The
        APPLICATION_ADAPTER role is accepted only on acquire/renew/release signal endpoints;
        it does not grant general Session operation authority.
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSafetyLeaseRequest"
      responses:
        "201":
          description: Lease acquired or an idempotent acquisition replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyLease"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listSessionSafetyLeases
      summary: List the latest durable application Safe Point leases for a Session
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Bounded latest current and terminal lease records plus the authoritative total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyLeaseList"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/safety-leases/{leaseId}:
    put:
      operationId: renewSessionSafetyLease
      summary: Renew an owned active application Safe Point lease
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/LeaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewSafetyLeaseRequest"
      responses:
        "200":
          description: Lease renewed or an idempotent renewal replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyLease"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}/safety-leases/{leaseId}:release:
    post:
      operationId: releaseSessionSafetyLease
      summary: Release an owned application Safe Point lease
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/LeaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Terminal lease state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyLease"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/migration:
    get:
      operationId: getLatestSessionMigration
      summary: Get the latest durable cross-node migration workflow
      tags: [Session, Resource]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Latest migration phase and recovery result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionMigration"
        "204":
          description: The Session has no migration history.
