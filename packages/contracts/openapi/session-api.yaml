  /api/v1/sessions/{sessionId}:desktop-connection:
    post:
      operationId: createRemoteDesktopConnection
      summary: Issue a collaborative noVNC ticket without preempting the Agent
      description: >-
        The ticket is bound to the current Session Context rather than an exclusive
        HumanTakeover Operation. Connecting keeps an active Agent task alive; Browser Node
        gives fresh human input priority and resumes deferred Agent input after the human
        input idle window. Multiple collaborative clients are bounded per Session and use the
        shared RFB mode. A view-only ticket is enforced by both noVNC and Browser Node; attempted
        Key, Pointer or Clipboard input is rejected before x11vnc. An existing Agent or human
        governance Operation never changes this connection into exclusive mode. Legacy signed
        EXCLUSIVE_TAKEOVER tickets are normalized to collaborative admission by Browser Node and
        cannot revoke another Viewer or the Agent workflow. The
        Control Plane also signs an actor-specific bandwidth and forwarding-frequency ceiling into
        every ticket. Browser Node shares that budget across the same actor's concurrent windows,
        isolates different actors, and never throttles the independent human/Agent input path.
      tags: [Session, RemoteDesktop]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ActorId"
        - name: viewOnly
          in: query
          required: false
          description: Request a server-enforced observation-only connection.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Session-bound collaborative connection ticket issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteDesktopConnection"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
