openapi: 3.1.0
info:
  title: Agent Browser Cloud API
  version: 1.0.0
  description: Control Plane Session API v1.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Same-origin API endpoint
security:
  - bearerAuth: []
paths:
  /api/v1/sessions:
    post:
      operationId: createSession
      summary: Create a Session
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created, or the original idempotent result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listSessions
      summary: List tenant Sessions
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/SessionState"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Tenant-scoped Session list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sessions/{sessionId}:
    get:
      operationId: getSession
      summary: Get Session details
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Session detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionView"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/state:
    get:
      operationId: getBrowserState
      summary: Get the latest Browser Current State
      tags: [Session, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Latest tenant-scoped Browser State.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserState"
        "204":
          description: The Runtime has not submitted a state yet.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}:start:
    post:
      operationId: startSession
      summary: Start a Session Runtime
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "202":
          description: Start operation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}:resync-state:
    post:
      operationId: resyncBrowserState
      summary: Request a Full or Region Browser State Resync
      tags: [Session, State]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateResyncRequest"
      responses:
        "202":
          description: State Resync command was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateResyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}:terminate:
    post:
      operationId: terminateSession
      summary: Terminate a Session
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "202":
          description: Termination operation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}:takeover:
    post:
      operationId: requestHumanTakeover
      summary: Acquire exclusive HumanTakeover control
      tags: [Session, HumanTakeover]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "202":
          description: HumanTakeover input barrier accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}:release-takeover:
    post:
      operationId: releaseHumanTakeover
      summary: Release HumanTakeover after input cleanup and state resync
      tags: [Session, HumanTakeover]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "202":
          description: HumanTakeover release barrier accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/sessions/{sessionId}:desktop-connection:
    post:
      operationId: createRemoteDesktopConnection
      summary: Issue a short-lived, single-use noVNC connection ticket
      tags: [Session, HumanTakeover, RemoteDesktop]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ActorId"
      responses:
        "200":
          description: Connection ticket issued for the active HumanTakeover actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteDesktopConnection"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/profiles:
    get:
      operationId: listProfiles
      summary: List tenant Profiles and their latest committed checkpoints
      tags: [Profile]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant-scoped Profile list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createProfile
      summary: Create a persistent browser Profile
      tags: [Profile]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "201":
          description: Profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/profiles/{profileId}:
    get:
      operationId: getProfile
      summary: Get Profile checkpoint metadata
      tags: [Profile]
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant-scoped Profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/proxies:
    get:
      operationId: getProxyOverview
      summary: Get the static Proxy Provider and tenant allocation ledger
      tags: [Proxy]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Provider configuration and tenant-scoped allocations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sessions/{sessionId}/agent-tasks:
    post:
      operationId: createAgentTask
      summary: Validate and persist a bounded Agent plan
      description: External context is treated as data-only. This Phase 4 endpoint plans but does not execute.
      tags: [Agent, AgentSafety]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentTaskRequest"
      responses:
        "201":
          description: A planned or explicitly blocked Agent task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/agent-tasks:
    get:
      operationId: listAgentTasks
      summary: List tenant Agent tasks and plan-security decisions
      tags: [Agent, AgentSafety]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Tenant-scoped Agent task list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTaskListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/agent-tasks/{taskId}:
    get:
      operationId: getAgentTask
      summary: Get an Agent task and its redacted security evidence
      tags: [Agent, AgentSafety]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            pattern: "^agt_[a-zA-Z0-9]{16,}$"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant-scoped Agent task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/agent-tasks/{taskId}:execute:
    post:
      operationId: executeAgentTask
      summary: Execute and verify a supported Agent plan
      description: The current executor supports read-only plans. Plans containing Navigate are rejected until the Node executor is connected.
      tags: [Agent, AgentTool]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            pattern: "^agt_[a-zA-Z0-9]{16,}$"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Completed, failed, or previously completed Agent task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Required in secured environments. The current local skeleton uses X-Tenant-Id only as a development guard, not as authentication.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^ses_[a-zA-Z0-9]{16,}$"
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_-]{1,128}$"
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Development tenant guard. Production derives tenant identity from the authenticated principal.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      description: Development actor identity. Production derives actor identity from the authenticated principal.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    CreateAgentTaskRequest:
      type: object
      additionalProperties: false
      required: [goal, allowedDomains]
      properties:
        goal:
          type: string
          minLength: 1
          maxLength: 2000
        startUrl:
          type: string
          maxLength: 2048
        allowedDomains:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 253
            pattern: "^[A-Za-z0-9.-]+$"
        maxActions:
          type: integer
          minimum: 1
          maximum: 20
        replanBudget:
          type: integer
          minimum: 0
          maximum: 3
        contextSources:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AgentInstructionSource"
    AgentInstructionSource:
      type: object
      additionalProperties: false
      required: [sourceId, sourceType, classification, content]
      properties:
        sourceId:
          type: string
          minLength: 1
          maxLength: 128
        sourceType:
          type: string
          enum:
            - APPLICATION_DATA
            - EMAIL
            - DOCUMENT
            - WEB_CONTENT
            - THIRD_PARTY_WIDGET
        classification:
          type: string
          minLength: 1
          maxLength: 64
        content:
          type: string
          minLength: 1
          maxLength: 10000
          writeOnly: true
    AgentTaskListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentTask"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer
    AgentTask:
      type: object
      additionalProperties: false
      required:
        - taskId
        - sessionId
        - goal
        - state
        - riskClass
        - intentDecision
        - blockedReason
        - currentStep
        - totalSteps
        - replanCount
        - allowedDomains
        - plan
        - operationId
        - executionResults
        - lastError
        - securityEvents
        - createdAt
        - updatedAt
      properties:
        taskId:
          type: string
          pattern: "^agt_[a-zA-Z0-9]{16,}$"
        sessionId:
          type: string
        goal:
          type: string
          description: Data-minimized goal; secrets, email and phone patterns are redacted.
        state:
          type: string
          enum: [PLANNED, BLOCKED, RUNNING, COMPLETED, FAILED]
        riskClass:
          $ref: "#/components/schemas/AgentRiskClass"
        intentDecision:
          type: string
          enum: [ALLOWED, CONFIRM_REQUIRED, FORBIDDEN]
        blockedReason:
          type: [string, "null"]
        currentStep:
          type: integer
          minimum: 0
        totalSteps:
          type: integer
          minimum: 0
        replanCount:
          type: integer
          minimum: 0
        allowedDomains:
          type: array
          items:
            type: string
        plan:
          $ref: "#/components/schemas/AgentPlan"
        operationId:
          type: [string, "null"]
        executionResults:
          type: array
          items:
            $ref: "#/components/schemas/AgentToolExecutionResult"
        lastError:
          type: [string, "null"]
        securityEvents:
          type: array
          items:
            $ref: "#/components/schemas/PromptSecurityEvent"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentPlan:
      type: object
      additionalProperties: false
      required: [intentId, steps, maxActions, replanBudget, expiresAt]
      properties:
        intentId:
          type: string
        steps:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AgentPlanStep"
        maxActions:
          type: integer
          minimum: 1
          maximum: 20
        replanBudget:
          type: integer
          minimum: 0
          maximum: 3
        expiresAt:
          type: string
          format: date-time
    AgentPlanStep:
      type: object
      additionalProperties: false
      required:
        - stepId
        - toolId
        - riskClass
        - targetUrl
        - rationale
        - supportingSources
        - trustFloor
        - taintLabels
        - requiredConfirmation
        - strategy
        - requiredStateQuality
        - verification
        - capabilityTokenId
      properties:
        stepId:
          type: string
        toolId:
          type: string
          enum:
            - NAVIGATE
            - GET_CURRENT_STATE
            - CLICK_TARGET
            - TYPE_TEXT
            - SCROLL
            - WAIT_FOR
            - GET_URL
            - GET_PAGE_SUMMARY
            - REQUEST_HUMAN_TAKEOVER
        riskClass:
          $ref: "#/components/schemas/AgentRiskClass"
        targetUrl:
          type: [string, "null"]
        rationale:
          type: string
        supportingSources:
          type: array
          items:
            type: string
        trustFloor:
          type: string
          enum: [TRUSTED, RESTRICTED, UNTRUSTED]
        taintLabels:
          type: array
          items:
            type: string
        requiredConfirmation:
          type: boolean
        strategy:
          type: string
          enum:
            - SEMANTIC_DOM
            - ACCESSIBILITY
            - DESKTOP_INPUT
            - VISION_DESKTOP
            - HUMAN_ASSIST
            - HUMAN_TAKEOVER
        requiredStateQuality:
          type: string
        verification:
          type: string
        capabilityTokenId:
          type: string
          description: Non-secret handle. The signed bearer token is never returned to the console.
    AgentRiskClass:
      type: string
      enum:
        - R0_READ_ONLY
        - R1_LOW_RISK_CHANGE
        - R2_DATA_CHANGE
        - R3_ACCOUNT_CHANGE
        - R4_FINANCIAL
        - R5_SECURITY
    AgentToolExecutionResult:
      type: object
      additionalProperties: false
      required:
        - stepId
        - toolId
        - status
        - resultHash
        - output
        - verification
        - completedAt
      properties:
        stepId:
          type: string
        toolId:
          type: string
          enum: [GET_CURRENT_STATE, GET_URL, GET_PAGE_SUMMARY]
        status:
          type: string
          enum: [VERIFIED]
        resultHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        output:
          type: object
          additionalProperties: true
        verification:
          type: string
        completedAt:
          type: string
          format: date-time
    PromptSecurityEvent:
      type: object
      additionalProperties: false
      required:
        - eventId
        - eventType
        - severity
        - decision
        - ruleCode
        - sourceType
        - contentHash
        - createdAt
      properties:
        eventId:
          type: string
        eventType:
          type: string
        severity:
          type: string
        decision:
          type: string
        ruleCode:
          type: string
        sourceType:
          type: string
        contentHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        createdAt:
          type: string
          format: date-time
    CreateProfileRequest:
      type: object
      additionalProperties: false
      required: [profileId, name]
      properties:
        profileId:
          type: string
          pattern: "^[a-zA-Z0-9_-]{1,128}$"
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
    Profile:
      type: object
      additionalProperties: false
      required:
        - profileId
        - tenantId
        - name
        - profileWriteEpoch
        - coreSizeBytes
        - checkpointFileCount
        - restoreStatus
        - state
        - createdAt
        - updatedAt
      properties:
        profileId:
          type: string
        tenantId:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        latestCheckpointId:
          type: [string, "null"]
        latestCheckpointEpoch:
          type: [integer, "null"]
          format: int64
        profileWriteEpoch:
          type: integer
          format: int64
          minimum: 0
        coreSizeBytes:
          type: integer
          format: int64
          minimum: 0
        checkpointFileCount:
          type: integer
          format: int64
          minimum: 0
        restoreStatus:
          type: string
          enum: [EMPTY, TECHNICAL_READY]
        state:
          type: string
          enum: [ACTIVE]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastCheckpointAt:
          type: [string, "null"]
          format: date-time
    ProfileListResponse:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        total:
          type: integer
          minimum: 0
    ProxyProvider:
      type: object
      additionalProperties: false
      required:
        - providerId
        - type
        - endpoint
        - expectedExitIp
        - directFallbackAllowed
        - state
      properties:
        providerId:
          type: string
        type:
          type: string
          enum: [STATIC_HTTP]
        endpoint:
          type: string
        expectedExitIp:
          type: string
        directFallbackAllowed:
          type: boolean
        state:
          type: string
          enum: [CONFIGURED, UNCONFIGURED]
    ProxyAllocation:
      type: object
      additionalProperties: false
      required:
        - allocationId
        - sessionId
        - providerId
        - protocol
        - state
        - allocatedAt
        - updatedAt
      properties:
        allocationId:
          type: string
        sessionId:
          type: string
        providerId:
          type: string
        protocol:
          type: string
          enum: [HTTP]
        state:
          type: string
          enum: [ALLOCATED, BOUND, RELEASED, FAILED]
        exitIp:
          type: [string, "null"]
        country:
          type: [string, "null"]
        asn:
          type: [string, "null"]
        allocatedAt:
          type: string
          format: date-time
        verifiedAt:
          type: [string, "null"]
          format: date-time
        releasedAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProxyOverview:
      type: object
      additionalProperties: false
      required: [provider, allocations, total]
      properties:
        provider:
          $ref: "#/components/schemas/ProxyProvider"
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/ProxyAllocation"
        total:
          type: integer
          minimum: 0
    SessionState:
      type: string
      enum:
        - CREATED
        - STARTING
        - RUNNING
        - DEGRADED
        - HIBERNATING
        - HIBERNATED
        - RECOVERING
        - TERMINATING
        - TERMINATED
        - FAILED
    ResourceClass:
      type: string
      enum: [L0, L1, L2, L3, L4, L5]
    BrowserState:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - contextEpoch
        - stateVersion
        - targetRevision
        - url
        - title
        - stateHash
        - stateQuality
        - targets
      properties:
        sessionId:
          type: string
        contextEpoch:
          type: integer
          format: int64
          minimum: 0
        stateVersion:
          type: integer
          format: int64
          minimum: 1
        targetRevision:
          type: integer
          format: int64
          minimum: 1
        url:
          type: string
          maxLength: 8192
        title:
          type: string
          maxLength: 1024
        stateHash:
          type: string
          maxLength: 128
        stateQuality:
          type: string
          enum: [COMPLETE, DEPTH_LIMITED, RESYNCING, DEGRADED, INVALID]
        targets:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/InteractiveTarget"
    StateResyncRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [FULL, REGION]
        rootRef:
          type: [string, "null"]
          maxLength: 512
        reason:
          type: [string, "null"]
          maxLength: 128
    StateResyncResponse:
      type: object
      additionalProperties: false
      required: [requestId, mode, state]
      properties:
        requestId:
          type: string
        mode:
          type: string
          enum: [FULL, REGION]
        state:
          type: string
          enum: [QUEUED]
    InteractiveTarget:
      type: object
      additionalProperties: false
      required: [targetRef, role, enabled, visible]
      properties:
        targetRef:
          type: string
          maxLength: 256
        role:
          type: string
          maxLength: 128
        name:
          type: [string, "null"]
          maxLength: 256
        bounds:
          oneOf:
            - $ref: "#/components/schemas/TargetBounds"
            - type: "null"
        enabled:
          type: boolean
        visible:
          type: boolean
    TargetBounds:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      properties:
        x:
          type: number
        y:
          type: number
        width:
          type: number
          minimum: 0
        height:
          type: number
          minimum: 0
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [tenantId, profileId]
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 128
        profileId:
          type: string
          minLength: 1
          maxLength: 128
        region:
          type: string
          pattern: "^[a-z0-9-]{1,32}$"
        resourceClass:
          $ref: "#/components/schemas/ResourceClass"
        metadata:
          type: object
          maxProperties: 32
          propertyNames:
            minLength: 1
            maxLength: 128
          additionalProperties:
            type: string
            maxLength: 1024
    CreateSessionResponse:
      type: object
      additionalProperties: false
      required: [sessionId, context]
      properties:
        sessionId:
          type: string
        context:
          $ref: "#/components/schemas/SessionContext"
    SessionContext:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - tenantId
        - profileId
        - coordinatorTerm
        - contextEpoch
        - browserGeneration
        - networkRevision
        - resourceClass
        - state
        - policyHash
        - createdAt
        - updatedAt
      properties:
        sessionId:
          type: string
        tenantId:
          type: string
        profileId:
          type: string
        nodeId:
          type: [string, "null"]
        runtimeBuildId:
          type: [string, "null"]
        isolationProfileId:
          type: [string, "null"]
        proxyBindingId:
          type: [string, "null"]
        coordinatorTerm:
          type: integer
          format: int64
        contextEpoch:
          type: integer
          format: int64
        browserGeneration:
          type: integer
          format: int64
        networkRevision:
          type: integer
          format: int64
        resourceClass:
          $ref: "#/components/schemas/ResourceClass"
        state:
          $ref: "#/components/schemas/SessionState"
        policyHash:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SessionView:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - displayName
        - tenantId
        - profileId
        - region
        - resourceClass
        - state
        - contextEpoch
        - browserGeneration
        - createdAt
        - updatedAt
      properties:
        sessionId:
          type: string
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        tenantId:
          type: string
        profileId:
          type: string
        region:
          type: string
        resourceClass:
          $ref: "#/components/schemas/ResourceClass"
        state:
          $ref: "#/components/schemas/SessionState"
        nodeId:
          type: [string, "null"]
        runtimeBuildId:
          type: [string, "null"]
        proxyBindingId:
          type: [string, "null"]
        contextEpoch:
          type: integer
          format: int64
        browserGeneration:
          type: integer
          format: int64
        currentOperation:
          oneOf:
            - $ref: "#/components/schemas/OperationView"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SessionListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionView"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    OperationResponse:
      type: object
      additionalProperties: false
      required: [operationId, state]
      properties:
        operationId:
          type: string
        state:
          type: string
          enum: [ACTIVE, COMMITTED, ABORTED, TIMED_OUT]
    OperationView:
      type: object
      additionalProperties: false
      required:
        - operationId
        - ownerType
        - actorId
        - mode
        - priority
        - coordinatorTerm
        - contextEpoch
        - operationEpoch
        - workflowId
        - cancellable
        - preemptible
        - phase
        - state
        - allowedCapabilities
        - deadline
      properties:
        operationId:
          type: string
        ownerType:
          type: string
          enum: [AGENT, HUMAN, SYSTEM]
        actorId:
          type: [string, "null"]
        mode:
          type: string
        priority:
          type: integer
        coordinatorTerm:
          type: integer
          format: int64
        contextEpoch:
          type: integer
          format: int64
        operationEpoch:
          type: integer
          format: int64
        workflowId:
          type: [string, "null"]
        cancellable:
          type: boolean
        preemptible:
          type: boolean
        phase:
          type: string
        state:
          type: string
        allowedCapabilities:
          type: array
          items:
            type: string
        deadline:
          type: string
          format: date-time
    RemoteDesktopConnection:
      type: object
      additionalProperties: false
      required:
        - webSocketPath
        - expiresAt
        - protocol
        - operationEpoch
        - viewOnly
      properties:
        webSocketPath:
          type: string
          pattern: "^/desktop/v1/sessions/ses_[a-zA-Z0-9]{16,}\\?ticket="
          description: Same-origin WebSocket path. The embedded ticket is single-use and expires quickly.
        expiresAt:
          type: string
          format: date-time
        protocol:
          type: string
          enum: [rfb]
        operationEpoch:
          type: integer
          format: int64
          minimum: 1
        viewOnly:
          type: boolean
    Error:
      type: object
      additionalProperties: false
      required: [code, message, details, requestId, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Resource is outside the caller tenant scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: State or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
