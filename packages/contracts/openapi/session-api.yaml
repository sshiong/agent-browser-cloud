          minimum: 30
          maximum: 7200
          default: 600
        approvalRequestId:
          type: string
          pattern: "^brk_[A-Za-z0-9]{20}$"
        requiredWorkerCapabilities:
          type: object
          additionalProperties:
            type: boolean
        maximumAttempts:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
    RecoveryGameDayBlastRadius:
      type: object
      additionalProperties: false
      required: [scope, maximumTargets, targetIds]
      properties:
        scope:
          type: string
          enum: [TEST_FIXTURE, TENANT, NAMESPACE, REGION]
        maximumTargets:
          type: integer
          minimum: 1
          maximum: 100
        targetIds:
          type: array
          maxItems: 100
          items:
            type: string
            pattern: "^[A-Za-z0-9_.:/-]{1,128}$"
    CompleteRecoveryGameDayRequest:
      type: object
      additionalProperties: false
      required: [observedRtoSeconds, observedRpoSeconds, dataLossRecords]
      properties:
        observedRtoSeconds:
          type: integer
          minimum: 0
          maximum: 86400
        observedRpoSeconds:
          type: integer
          minimum: 0
          maximum: 86400
        dataLossRecords:
          type: integer
          minimum: 0
        detectionTimeSeconds:
          type: integer
          minimum: 0
          maximum: 86400
        failoverTimeSeconds:
          type: integer
          minimum: 0
          maximum: 86400
        staleOperationCount:
          type: integer
          minimum: 0
        userImpactCount:
          type: integer
          minimum: 0
        manualSteps:
          type: integer
          minimum: 0
        runbookAccuracyPercent:
          type: integer
          minimum: 0
          maximum: 100
        runnerEvidenceHash:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        recoveryConfirmed:
          type: boolean
    ClaimRecoveryGameDayJobRequest:
      type: object
      additionalProperties: false
      required: [environments, scenarioCodes, capabilities]
      properties:
        environments:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [TEST, STAGING, PRODUCTION]
        scenarioCodes:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Z][A-Z0-9_]{2,63}$"
        capabilities:
          type: object
          additionalProperties:
            type: boolean
    RecoveryGameDayJobClaimRequest:
      type: object
      additionalProperties: false
      required: [claimToken]
      properties:
        claimToken:
          type: string
          minLength: 32
          maxLength: 128
    UpdateRecoveryGameDayStageRequest:
      type: object
      additionalProperties: false
      required: [claimToken, stage]
      properties:
        claimToken:
          type: string
          minLength: 32
          maxLength: 128
        stage:
          type: string
          enum: [INJECTING, FAULT_INJECTED, OBSERVING, RECOVERING, VALIDATING]
    CompleteRecoveryGameDayJobRequest:
      type: object
      additionalProperties: false
      required: [claimToken, result]
      properties:
        claimToken:
          type: string
          minLength: 32
          maxLength: 128
        result:
          $ref: "#/components/schemas/CompleteRecoveryGameDayRequest"
    FailRecoveryGameDayJobRequest:
      type: object
      additionalProperties: false
      required: [claimToken, failureCode, retryable, recoveryConfirmed]
      properties:
        claimToken:
          type: string
          minLength: 32
          maxLength: 128
        failureCode:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,127}$"
        retryable:
          type: boolean
        recoveryConfirmed:
          type: boolean
    RecoveryGameDayJob:
      type: object
      additionalProperties: false
      required: [gameDayId, scenarioCode, environment, requiredWorkerCapabilities, state, currentStage, attempt, maximumAttempts, recoveryAttempt, maximumRecoveryAttempts, workerId, claimEpoch, availableAt, leaseExpiresAt, lastHeartbeatAt, abortDeadline, abortRequested, faultInjected, recoveryConfirmed, failureCode, resultHash, updatedAt]
      properties:
        gameDayId:
          type: string
        scenarioCode:
          type: string
        environment:
          type: string
          enum: [TEST, STAGING, PRODUCTION]
        requiredWorkerCapabilities:
          type: object
          additionalProperties:
            type: boolean
        state:
          type: string
          enum: [QUEUED, CLAIMED, EXECUTING, RECOVERY_REQUIRED, RECOVERING, ACKED, COMMITTED, FAILED, ABORTED]
        currentStage:
          type: string
          enum: [QUEUED, PREPARING, INJECTING, FAULT_INJECTED, OBSERVING, RECOVERY_REQUIRED, RECOVERING, VALIDATING, COMMITTED, FAILED, ABORTED]
        attempt:
          type: integer
        maximumAttempts:
          type: integer
        recoveryAttempt:
          type: integer
        maximumRecoveryAttempts:
          type: integer
        workerId:
          type: [string, "null"]
        claimEpoch:
          type: integer
          format: int64
        availableAt:
          type: string
          format: date-time
        leaseExpiresAt:
          type: [string, "null"]
          format: date-time
        lastHeartbeatAt:
          type: [string, "null"]
          format: date-time
        abortDeadline:
          type: string
          format: date-time
        abortRequested:
          type: boolean
        faultInjected:
          type: boolean
        recoveryConfirmed:
          type: [boolean, "null"]
        failureCode:
          type: [string, "null"]
        resultHash:
          type: [string, "null"]
          pattern: "^[a-f0-9]{64}$"
        updatedAt:
          type: string
          format: date-time
    RecoveryGameDayJobClaim:
      type: object
      additionalProperties: false
      required: [claimToken, gameDay, leaseExpiresAt, claimEpoch, recoveryOnly]
      properties:
        claimToken:
          type: string
        gameDay:
          $ref: "#/components/schemas/RecoveryGameDay"
        leaseExpiresAt:
          type: string
          format: date-time
        claimEpoch:
          type: integer
          format: int64
        recoveryOnly:
          type: boolean
    RecoveryGameDay:
      type: object
      additionalProperties: false
      required:
        - gameDayId
        - scenario
        - sourceRegion
        - targetRegion
        - state
        - rtoTargetSeconds
        - rpoTargetSeconds
        - observedRtoSeconds
        - observedRpoSeconds
        - dataLossRecords
        - evidenceHash
        - startedBy
        - startedAt
        - completedAt
        - executionMode
        - environment
        - blastRadius
        - maximumDurationSeconds
        - approvalRequestId
        - currentStage
        - abortRequested
        - recoveryConfirmed
        - failureCode
        - job
      properties:
        gameDayId:
          type: string
        scenario:
          type: string
        sourceRegion:
          type: string
        targetRegion:
          type: string
        state:
          type: string
          enum: [QUEUED, RUNNING, PASSED, FAILED, ABORTED]
        rtoTargetSeconds:
          type: integer
        rpoTargetSeconds:
          type: integer
        observedRtoSeconds:
          type: [integer, "null"]
        observedRpoSeconds:
          type: [integer, "null"]
        dataLossRecords:
          type: [integer, "null"]
        evidenceHash:
          type: [string, "null"]
          pattern: "^[a-f0-9]{64}$"
        startedBy:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        executionMode:
          type: string
          enum: [MANUAL, AUTO]
        environment:
          type: string
          enum: [TEST, STAGING, PRODUCTION]
        blastRadius:
          oneOf:
            - $ref: "#/components/schemas/RecoveryGameDayBlastRadius"
            - type: "null"
        maximumDurationSeconds:
          type: integer
        approvalRequestId:
          type: [string, "null"]
        currentStage:
          type: string
        abortRequested:
          type: boolean
        recoveryConfirmed:
          type: [boolean, "null"]
        failureCode:
          type: [string, "null"]
        job:
          oneOf:
            - $ref: "#/components/schemas/RecoveryGameDayJob"
            - type: "null"
    RecoveryGameDayEvent:
      type: object
      additionalProperties: false
      required: [eventId, gameDayId, eventType, fromState, toState, stage, workerId, claimEpoch, attempt, reasonCode, occurredAt]
      properties:
        eventId:
          type: string
          pattern: "^gev_[A-Za-z0-9]{20}$"
        gameDayId:
          type: string
          pattern: "^gameday_[A-Za-z0-9]{20}$"
        eventType:
          type: string
        fromState:
          type: [string, "null"]
        toState:
          type: string
        stage:
          type: string
        workerId:
          type: [string, "null"]
        claimEpoch:
          type: integer
          format: int64
          minimum: 0
        attempt:
          type: integer
          minimum: 0
        reasonCode:
          type: [string, "null"]
        occurredAt:
          type: string
          format: date-time
    RecoveryGameDayEventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryGameDayEvent"
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean
    RecoveryGameDayTrend:
      type: object
      additionalProperties: false
      required: [scenario, environment, totalRuns, passedRuns, failedRuns, abortedRuns, recoveryUnknownRuns, passRatePercent, p95RtoSeconds, p95RpoSeconds, openTicketCount, latestRunAt]
      properties:
        scenario:
          type: string
        environment:
          type: string
          enum: [TEST, STAGING, PRODUCTION]
        totalRuns:
          type: integer
          format: int64
        passedRuns:
          type: integer
          format: int64
        failedRuns:
          type: integer
          format: int64
        abortedRuns:
          type: integer
          format: int64
        recoveryUnknownRuns:
          type: integer
          format: int64
        passRatePercent:
          type: number
          format: double
        p95RtoSeconds:
          type: [integer, "null"]
        p95RpoSeconds:
          type: [integer, "null"]
        openTicketCount:
          type: integer
          format: int64
        latestRunAt:
          type: string
          format: date-time
    RecoveryGameDayReportExport:
      type: object
      additionalProperties: false
      required: [exportId, gameDayId, reportFormat, eventCount, report, reportHash, signatureAlgorithm, signingKeyId, signature, generatedBy, generatedAt]
      properties:
        exportId:
          type: string
          pattern: "^gex_[A-Za-z0-9]{20}$"
        gameDayId:
          type: string
          pattern: "^gameday_[A-Za-z0-9]{20}$"
        reportFormat:
          type: string
          enum: [JSON]
        eventCount:
          type: integer
          minimum: 0
        report:
          type: object
          additionalProperties: true
        reportHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        signatureAlgorithm:
          type: string
          enum: [HMAC-SHA256]
        signingKeyId:
          type: string
        signature:
          type: string
          pattern: "^[a-f0-9]{64}$"
        generatedBy:
          type: string
        generatedAt:
          type: string
          format: date-time
    UpdateRecoveryGameDayRemediationRequest:
      type: object
      additionalProperties: false
      required: [state, ownerId]
      properties:
        state:
          type: string
          enum: [ACKNOWLEDGED, RESOLVED]
        ownerId:
          type: string
          maxLength: 128
        resolution:
          type: string
          maxLength: 2048
    RecoveryGameDayRemediation:
      type: object
      additionalProperties: false
      required: [ticketId, gameDayId, scenario, environment, severity, state, reasonCode, summary, ownerId, resolution, createdBy, createdAt, updatedBy, updatedAt, resolvedAt]
      properties:
        ticketId:
          type: string
          pattern: "^grt_[A-Za-z0-9]{20}$"
        gameDayId:
          type: string
          pattern: "^gameday_[A-Za-z0-9]{20}$"
        scenario:
          type: string
        environment:
          type: string
          enum: [TEST, STAGING, PRODUCTION]
        severity:
          type: string
          enum: [P1, P2, P3]
        state:
          type: string
          enum: [OPEN, ACKNOWLEDGED, RESOLVED]
        reasonCode:
          type: string
        summary:
          type: string
        ownerId:
          type: [string, "null"]
        resolution:
          type: [string, "null"]
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time
    ComplianceSnapshot:
      type: object
      additionalProperties: false
      required:
        - snapshotId
        - tenantId
        - framework
        - controlCount
        - passingControls
        - evidenceHash
        - evidence
        - generatedBy
        - generatedAt
      properties:
        snapshotId:
          type: string
        tenantId:
          type: string
        framework:
          type: string
        controlCount:
          type: integer
        passingControls:
          type: integer
        evidenceHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        evidence:
          $ref: "#/components/schemas/BooleanMap"
        generatedBy:
          type: string
        generatedAt:
          type: string
          format: date-time
    EnterpriseOverview:
      type: object
      additionalProperties: false
      required:
        - validations
        - costRates
        - mediaQuota
        - errorBudget
        - slaExclusions
        - retentionPolicies
        - licenseInventory
        - regions
        - recoveryGameDays
        - recoveryGameDayTrends
        - recoveryGameDayRemediations
        - latestCompliance
        - generatedAt
      properties:
        validations:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeValidation"
        costRates:
          type: array
          items:
            $ref: "#/components/schemas/CostRate"
        mediaQuota:
          oneOf:
            - $ref: "#/components/schemas/MediaQuota"
            - type: "null"
        errorBudget:
          oneOf:
            - $ref: "#/components/schemas/ErrorBudget"
            - type: "null"
        releaseFreeze:
          oneOf:
            - $ref: "#/components/schemas/ReleaseFreeze"
            - type: "null"
        slaExclusions:
          type: array
          items:
            $ref: "#/components/schemas/SlaExclusion"
        retentionPolicies:
          type: array
          items:
            $ref: "#/components/schemas/RetentionPolicy"
        licenseInventory:
          type: array
          items:
            $ref: "#/components/schemas/LicenseInventory"
        regions:
          type: array
          items:
            $ref: "#/components/schemas/EnterpriseRegion"
        recoveryGameDays:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryGameDay"
        recoveryGameDayTrends:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryGameDayTrend"
        recoveryGameDayRemediations:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryGameDayRemediation"
        latestCompliance:
          oneOf:
            - $ref: "#/components/schemas/ComplianceSnapshot"
            - type: "null"
        generatedAt:
          type: string
          format: date-time
    EnterpriseOverviewStreamControl:
      type: object
      additionalProperties: false
      required: [cursor, resetRequired, connectedAt]
      properties:
        cursor:
          type: integer
          format: int64
          minimum: 0
        resetRequired:
          type: boolean
        connectedAt:
          type: string
          format: date-time
    EnterpriseOverviewStreamChange:
      type: object
      additionalProperties: false
      required: [sequence, changeType, occurredAt, replayed]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        changeType:
          type: string
          enum:
            - RUNTIME_VALIDATION
            - COST_RATE
            - MEDIA_QUOTA
            - ERROR_BUDGET
            - RELEASE_FREEZE
            - SLA_EXCLUSION
            - RETENTION
            - LICENSE
            - REGION
            - RECOVERY_GAMEDAY
            - COMPLIANCE
        occurredAt:
          type: string
          format: date-time
        replayed:
          type: boolean
    BooleanMap:
      type: object
      additionalProperties:
        type: boolean
    Error:
      type: object
      additionalProperties: false
      required: [code, message, details, requestId, timestamp]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
  responses:
    Unauthorized:
      description: Missing or invalid authenticated principal.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Resource is outside the caller tenant scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: State or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: The bounded archive was received but failed semantic or integrity validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The upload exceeds the configured bounded ingress limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: The bounded concurrent stream capacity has been reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A required capacity or dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
