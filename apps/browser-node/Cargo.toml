[workspace]
members = [
  "crates/node-agent",
  "crates/runtime-supervisor",
  "crates/browser-supervisor",
  "crates/input-sandbox",
  "crates/network-helper",
  "crates/storage-helper",
  "crates/state-collector",
  "crates/node-journal",
  "crates/node-contracts"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
prost = "0.12"
tonic = "0.11"
prost-types = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
sysinfo = "0.33"
