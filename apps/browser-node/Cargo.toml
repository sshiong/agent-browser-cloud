[workspace]
members = [
  "crates/node-agent",
  "crates/runtime-supervisor",
  "crates/browser-supervisor",
  "crates/input-sandbox",
  "crates/network-helper",
  "crates/helper-contracts",
  "crates/helper-client",
  "crates/storage-helper",
  "crates/state-collector",
  "crates/node-journal",
  "crates/node-contracts",
  "crates/remote-desktop-gateway",
  "crates/session-recorder"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
prost = "0.13"
tonic = { version = "0.12", features = ["tls"] }
prost-types = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
bytes = "1"
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
tar = "0.4"
zstd = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
sysinfo = "0.33"
base64 = "0.22"
hmac = "0.12"
http = "1"
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.6"
sha2 = "0.10"
nix = { version = "0.29", features = ["fs", "socket", "user"] }
