apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser-session-operator
  namespace: browsercloud-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: browser-session-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: browser-session-operator
    spec:
      serviceAccountName: browser-session-operator
      nodeSelector:
        browsercloud.io/workload: control-plane
      containers:
        - name: operator
          image: ghcr.io/sshiong/agent-browser-cloud-operator:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: CONTROL_PLANE_URL
              value: https://control-plane.browsercloud-system.svc
            - name: CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: browser-session-operator-credentials
                  key: token
            - name: CONTROL_PLANE_CA
              value: /var/run/browsercloud/ca/ca.crt
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
