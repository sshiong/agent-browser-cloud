apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: browser-node-default-deny
  namespace: browsercloud-browser-nodes
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: browser-node-controlled-traffic
  namespace: browsercloud-browser-nodes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: browser-node
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: browsercloud-system
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: browsercloud-system
      ports:
        - protocol: TCP
          port: 9091
    - to:
        - namespaceSelector:
            matchLabels:
              browsercloud.io/proxy-egress: "true"
      ports:
        - protocol: TCP
          port: 3128
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-worker-default-deny
  namespace: browsercloud-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-worker
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-worker-control-plane-only
  namespace: browsercloud-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-worker
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: control-plane
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recovery-gameday-worker-default-deny
  namespace: browsercloud-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: recovery-gameday-worker
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recovery-gameday-worker-controlled-egress
  namespace: browsercloud-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: recovery-gameday-worker
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: control-plane
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              browsercloud.io/gameday-controllers: "true"
          podSelector:
            matchLabels:
              browsercloud.io/gameday-controller: "true"
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runtime-validation-worker-default-deny
  namespace: browsercloud-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: runtime-validation-worker
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runtime-validation-worker-controlled-egress
  namespace: browsercloud-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: runtime-validation-worker
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: control-plane
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              browsercloud.io/validation-fixtures: "true"
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
