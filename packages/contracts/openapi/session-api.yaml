        allocationId:
          type: string
        sessionId:
          type: string
        providerId:
          type: string
        protocol:
          type: string
          enum: [HTTP]
        state:
          type: string
          enum: [ALLOCATED, BOUND, RELEASED, FAILED]
        exitIp:
          type: [string, "null"]
