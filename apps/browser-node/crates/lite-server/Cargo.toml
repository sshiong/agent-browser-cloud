[package]
name = "lite-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lite_server"
path = "src/lib.rs"

[[bin]]
name = "browsercloud-lite"
path = "src/main.rs"

[[bin]]
name = "browsercloud-ctl"
path = "src/bin/ctl.rs"

[[bin]]
name = "browsercloud-mcp-bridge"
path = "src/bin/mcp_bridge.rs"

[dependencies]
runtime-supervisor = { path = "../runtime-supervisor" }
input-sandbox = { path = "../input-sandbox" }
state-collector = { path = "../state-collector" }
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
http.workspace = true
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest.workspace = true
ring.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tar.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zstd.workspace = true

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
