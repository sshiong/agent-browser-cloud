apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: browsercloud-system
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
    spec:
      securityContext:
        fsGroup: 11000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        browsercloud.io/workload: control-plane
      containers:
        - name: control-plane
          image: ghcr.io/sshiong/agent-browser-cloud-control-plane:0.1.0
          ports:
            - name: http
              containerPort: 8080
            - name: node-events
              containerPort: 9091
          env:
            - name: APP_ENVIRONMENT
              value: production
            - name: AGENT_EXTERNAL_WORKER_ENABLED
              value: "true"
            - name: AGENT_REVIEWER_EXTERNAL_ENABLED
              # Enable only after every Control Plane replica has been upgraded to
              # a version that understands the AWAITING_REVIEW task state.
              value: "false"
            - name: AGENT_REVIEWER_DEPLOYMENT_ID
              value: reviewer-prod-v1
            - name: AGENT_REVIEWER_PROVIDER_TYPE
              value: OPENAI_RESPONSES
            - name: AGENT_REVIEWER_MODEL_NAME
              valueFrom:
                secretKeyRef:
                  name: reviewer-model-provider
                  key: model
            - name: AGENT_REVIEWER_MODEL_REVISION
              valueFrom:
                secretKeyRef:
                  name: reviewer-model-provider
                  key: revision
            - name: AGENT_REVIEWER_INPUT_PRICE_MICROS_PER_MTOK
              valueFrom:
                secretKeyRef:
                  name: reviewer-model-provider
                  key: input-price-micros-per-million-tokens
            - name: AGENT_REVIEWER_OUTPUT_PRICE_MICROS_PER_MTOK
              valueFrom:
                secretKeyRef:
                  name: reviewer-model-provider
                  key: output-price-micros-per-million-tokens
            - name: GRPC_TLS_ENABLED
              value: "true"
            - name: COORDINATOR_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PROXY_PROVIDER_CONFIG_FILE
              value: /var/run/browsercloud/proxy-providers/providers.json
          envFrom:
            - secretRef:
                name: control-plane-runtime-secrets
          volumeMounts:
            - name: mtls
              mountPath: /var/run/browsercloud/mtls
              readOnly: true
            - name: proxy-provider-catalog
              mountPath: /var/run/browsercloud/proxy-providers
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            appArmorProfile:
              type: RuntimeDefault
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: mtls
          secret:
            secretName: control-plane-mtls
        - name: proxy-provider-catalog
          secret:
            secretName: control-plane-proxy-provider-catalog
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: browsercloud-system
spec:
  selector:
    app.kubernetes.io/name: control-plane
  ports:
    - name: http
      port: 443
      targetPort: http
    - name: node-events
      port: 9091
      targetPort: node-events
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: browser-node
  namespace: browsercloud-browser-nodes
spec:
  serviceName: browser-node
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: browser-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: browser-node
    spec:
      runtimeClassName: browser-sandbox
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 11000
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        browsercloud.io/workload: browser-node
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: browser-node
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: browsercloud.io/workload
          operator: Equal
          value: browser-node
          effect: NoSchedule
      containers:
        - name: browser-node
          image: ghcr.io/sshiong/agent-browser-cloud-browser-node:0.1.0
          ports:
            - name: grpc
              containerPort: 9090
            - name: remote-desktop
              containerPort: 6080
          env:
            - name: APP_ENVIRONMENT
              value: production
            - name: GRPC_TLS_ENABLED
              value: "true"
            - name: CONTROL_PLANE_EVENT_TARGET
              value: control-plane.browsercloud-system.svc:9091
            - name: ALLOW_DIRECT_NETWORK
              value: "false"
            - name: NETWORK_HELPER_SOCKET
              value: /var/run/browsercloud/helpers/network.sock
            - name: STORAGE_HELPER_SOCKET
              value: /var/run/browsercloud/helpers/storage.sock
            # Keep this in lockstep with the Storage Helper setting. When enabled, the Node
            # advertises profileImport=checkpoint-stream-v1; credentials remain Helper-only.
            - name: OBJECT_STORAGE_ENABLED
              value: "false"
            - name: PROFILE_STORAGE_ROOT
              value: /var/lib/browsercloud/profiles
            - name: RUNTIME_ROOT
              value: /var/lib/browsercloud/runtime
            - name: NODE_JOURNAL_PATH
              value: /var/lib/browsercloud/runtime/node-journal.sqlite3
            - name: RUNTIME_CGROUP_ROOT
              value: /sys/fs/cgroup/browsercloud
            - name: NODE_REGION
              value: primary
            - name: NODE_CERTIFIED_CPU_MILLIS
              value: "4000"
            - name: NODE_CERTIFIED_MEMORY_MIB
              value: "8192"
            - name: NODE_CERTIFIED_PID_COUNT
              value: "2048"
            - name: NODE_CERTIFIED_GPU_SLOTS
              value: "0"
            - name: NODE_CERTIFIED_MEDIA_SLOTS
              value: "4"
            - name: NODE_SUPPORTS_MEDIA
              value: "true"
            - name: NODE_SAFETY_MARGIN_PERCENT
              value: "20"
            - name: NODE_MAX_SESSIONS
              value: "8"
          envFrom:
            - secretRef:
                name: browser-node-runtime-secrets
          volumeMounts:
            - name: warm-tier
              mountPath: /var/lib/browsercloud
            - name: profile-tier
              mountPath: /var/lib/browsercloud/profiles
            - name: mtls
              mountPath: /var/run/browsercloud/mtls
              readOnly: true
            - name: helper-ipc
              mountPath: /var/run/browsercloud/helpers
            - name: runtime-cgroup
              mountPath: /sys/fs/cgroup/browsercloud
          startupProbe:
            tcpSocket:
              port: grpc
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 11001
            runAsGroup: 11000
            appArmorProfile:
              type: RuntimeDefault
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
        - name: network-helper
          image: ghcr.io/sshiong/agent-browser-cloud-browser-node:0.1.0
          command: ["/usr/bin/tini", "--", "/usr/local/bin/network-helper"]
          env:
            - name: APP_ENVIRONMENT
              value: production
            - name: NETWORK_HELPER_SOCKET
              value: /var/run/browsercloud/helpers/network.sock
            - name: NODE_AGENT_UID
              value: "11001"
            - name: PROXY_PROVIDER_CONFIG_FILE
              value: /var/run/browsercloud/proxy-providers/providers.json
          envFrom:
            - secretRef:
                name: browser-node-runtime-secrets
          volumeMounts:
            - name: helper-ipc
              mountPath: /var/run/browsercloud/helpers
            - name: proxy-provider-catalog
              mountPath: /var/run/browsercloud/proxy-providers
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 11002
            runAsGroup: 11000
            appArmorProfile:
              type: RuntimeDefault
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        - name: storage-helper
          image: ghcr.io/sshiong/agent-browser-cloud-browser-node:0.1.0
          command: ["/usr/bin/tini", "--", "/usr/local/bin/storage-helper"]
          env:
            - name: APP_ENVIRONMENT
              value: production
            - name: OBJECT_STORAGE_ENABLED
              value: "false"
            - name: STORAGE_HELPER_SOCKET
              value: /var/run/browsercloud/helpers/storage.sock
            - name: PROFILE_STORAGE_ROOT
              value: /var/lib/browsercloud/profiles
            - name: NODE_AGENT_UID
              value: "11001"
          volumeMounts:
            - name: profile-tier
              mountPath: /var/lib/browsercloud/profiles
            - name: helper-ipc
              mountPath: /var/run/browsercloud/helpers
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 11003
            runAsGroup: 11000
            appArmorProfile:
              type: RuntimeDefault
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: mtls
          secret:
            secretName: browser-node-mtls
        - name: helper-ipc
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: runtime-cgroup
          hostPath:
            path: /sys/fs/cgroup/browsercloud
            type: Directory
        - name: proxy-provider-catalog
          secret:
            secretName: browser-node-proxy-provider-catalog
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: warm-tier
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: browser-warm-tier
        resources:
          requests:
            storage: 100Gi
    - metadata:
        name: profile-tier
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: browser-warm-tier
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: browser-node
  namespace: browsercloud-browser-nodes
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: browser-node
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
    - name: remote-desktop
      port: 6080
      targetPort: remote-desktop
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: browser-node
  namespace: browsercloud-browser-nodes
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: browser-node
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-console
  namespace: browsercloud-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-console
    spec:
      nodeSelector:
        browsercloud.io/workload: control-plane
      containers:
        - name: web-console
          image: ghcr.io/sshiong/agent-browser-cloud-web-console:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            appArmorProfile:
              type: RuntimeDefault
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-console
  namespace: browsercloud-system
spec:
  selector:
    app.kubernetes.io/name: web-console
  ports:
    - name: https
      port: 443
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: browser-node
  namespace: browsercloud-system
spec:
  type: ExternalName
  externalName: browser-node.browsercloud-browser-nodes.svc.cluster.local
  ports:
    - name: remote-desktop
      port: 6080
      targetPort: 6080
