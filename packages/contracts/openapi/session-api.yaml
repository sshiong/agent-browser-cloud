              $ref: "#/components/schemas/ProxyRebindRequest"
      responses:
        "202":
          description: Durable proxy rebind workflow accepted or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyRebindOperation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
