server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: ${PROFILE_IMPORT_MAX_FILE_SIZE:256MB}
      max-request-size: ${PROFILE_IMPORT_MAX_REQUEST_SIZE:258MB}
  application:
    name: control-plane

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/browsercloud}
    username: ${DATABASE_USER:browsercloud}
    password: ${DATABASE_PASSWORD:browsercloud}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:1000}
      data-source-properties:
        connectTimeout: ${DATABASE_CONNECT_TIMEOUT_SECONDS:3}
        socketTimeout: ${DATABASE_SOCKET_TIMEOUT_SECONDS:5}
        tcpKeepAlive: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Online indexes use a session-level Flyway lock and a dedicated connection.
    url: ${FLYWAY_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/browsercloud}}
    user: ${FLYWAY_DATABASE_USER:${DATABASE_USER:browsercloud}}
    password: ${FLYWAY_DATABASE_PASSWORD:${DATABASE_PASSWORD:browsercloud}}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

browser-node:
  grpc-target: ${BROWSER_NODE_GRPC_TARGET:localhost:9090}
  dispatch-interval-ms: ${BROWSER_NODE_DISPATCH_INTERVAL_MS:250}
  default-runtime-build-id: ${BROWSER_NODE_DEFAULT_RUNTIME_BUILD_ID:runtime_local_chromium}

remote-desktop:
  ticket-secret: ${REMOTE_DESKTOP_TICKET_SECRET:browsercloud-local-remote-desktop-ticket-secret-v1}
  ticket-ttl-seconds: ${REMOTE_DESKTOP_TICKET_TTL_SECONDS:45}
  control-actor-bitrate-limit-kbps: ${REMOTE_DESKTOP_CONTROL_ACTOR_BITRATE_LIMIT_KBPS:8000}
  control-actor-frame-rate-limit-fps: ${REMOTE_DESKTOP_CONTROL_ACTOR_FRAME_RATE_LIMIT_FPS:30}
  viewer-actor-bitrate-limit-kbps: ${REMOTE_DESKTOP_VIEWER_ACTOR_BITRATE_LIMIT_KBPS:4000}
  viewer-actor-frame-rate-limit-fps: ${REMOTE_DESKTOP_VIEWER_ACTOR_FRAME_RATE_LIMIT_FPS:15}
  participant-history-retention-days: ${REMOTE_DESKTOP_PARTICIPANT_HISTORY_RETENTION_DAYS:30}
  participant-history-purge-batch-size: ${REMOTE_DESKTOP_PARTICIPANT_HISTORY_PURGE_BATCH_SIZE:10000}
  participant-history-retention-cron: ${REMOTE_DESKTOP_PARTICIPANT_HISTORY_RETENTION_CRON:0 29 * * * *}

agent:
  capability-token-secret: ${AGENT_CAPABILITY_TOKEN_SECRET:browsercloud-local-agent-capability-token-secret-v1}
  action-payload-secret: ${AGENT_ACTION_PAYLOAD_SECRET:browsercloud-local-agent-action-payload-secret-v1}
  external-worker:
    enabled: ${AGENT_EXTERNAL_WORKER_ENABLED:false}
    claim-lease-seconds: ${AGENT_WORKER_CLAIM_LEASE_SECONDS:60}
    reaper-interval-ms: ${AGENT_WORKER_REAPER_INTERVAL_MS:15000}
    maximum-attempts: ${AGENT_WORKER_MAXIMUM_ATTEMPTS:3}
  reviewer:
    minimum-confidence: ${AGENT_REVIEWER_MINIMUM_CONFIDENCE:0.80}
    deployment-id: ${AGENT_REVIEWER_DEPLOYMENT_ID:reviewer-local-v1}
    provider-type: ${AGENT_REVIEWER_PROVIDER_TYPE:OPENAI_RESPONSES}
    model-name: ${AGENT_REVIEWER_MODEL_NAME:reviewer-local}
    model-revision: ${AGENT_REVIEWER_MODEL_REVISION:local-v1}
    data-policy: ${AGENT_REVIEWER_DATA_POLICY:REDACTED_TASK_PLAN}
    maximum-output-tokens: ${AGENT_REVIEWER_MAXIMUM_OUTPUT_TOKENS:512}
    input-price-micros-per-million-tokens: ${AGENT_REVIEWER_INPUT_PRICE_MICROS_PER_MTOK:0}
    output-price-micros-per-million-tokens: ${AGENT_REVIEWER_OUTPUT_PRICE_MICROS_PER_MTOK:0}
    external:
      enabled: ${AGENT_REVIEWER_EXTERNAL_ENABLED:false}
      claim-lease-seconds: ${AGENT_REVIEWER_CLAIM_LEASE_SECONDS:90}
      reaper-interval-ms: ${AGENT_REVIEWER_REAPER_INTERVAL_MS:15000}
      maximum-attempts: ${AGENT_REVIEWER_MAXIMUM_ATTEMPTS:3}

proxy:
  allow-direct: ${PROXY_ALLOW_DIRECT:false}
  provider-config-file: ${PROXY_PROVIDER_CONFIG_FILE:}
  health:
    sample-retention-days: ${PROXY_HEALTH_SAMPLE_RETENTION_DAYS:7}
    retention-cron: ${PROXY_HEALTH_RETENTION_CRON:0 17 * * * *}
    cold-probe-dispatch-interval-ms: ${PROXY_COLD_PROBE_DISPATCH_INTERVAL_MS:5000}
    cold-probe-batch-size: ${PROXY_COLD_PROBE_BATCH_SIZE:8}
    cold-probe-lease-seconds: ${PROXY_COLD_PROBE_LEASE_SECONDS:45}
    cold-probe-success-interval-seconds: ${PROXY_COLD_PROBE_SUCCESS_INTERVAL_SECONDS:900}
    cold-probe-failure-interval-seconds: ${PROXY_COLD_PROBE_FAILURE_INTERVAL_SECONDS:120}
    cold-probe-unavailable-retry-seconds: ${PROXY_COLD_PROBE_UNAVAILABLE_RETRY_SECONDS:30}
  static:
    provider-id: ${STATIC_PROXY_PROVIDER_ID:static-local}
    endpoint: ${STATIC_PROXY_ENDPOINT:}
    expected-exit-ip: ${STATIC_PROXY_EXPECTED_EXIT_IP:}
    credential-ref: ${STATIC_PROXY_CREDENTIAL_REF:}

app:
  environment: ${APP_ENVIRONMENT:local}

security:
  tenant-claim: ${OIDC_TENANT_CLAIM:tenant_id}
  roles-claim: ${OIDC_ROLES_CLAIM:roles}
  runtime-signing-public-keys: ${RUNTIME_SIGNING_PUBLIC_KEYS:}
  secure-debug-max-minutes: ${SECURE_DEBUG_MAX_MINUTES:15}
  secure-debug-scan-interval-ms: ${SECURE_DEBUG_SCAN_INTERVAL_MS:5000}

audit:
  retention-days: ${AUDIT_RETENTION_DAYS:365}

enterprise:
  audit-export:
    signing-key: ${AUDIT_EXPORT_SIGNING_KEY:local-development-audit-export-key}
    signing-key-id: ${AUDIT_EXPORT_SIGNING_KEY_ID:local-development}
  gameday-worker:
    claim-lease-seconds: ${GAMEDAY_WORKER_CLAIM_LEASE_SECONDS:60}
    reaper-interval-ms: ${GAMEDAY_WORKER_REAPER_INTERVAL_MS:15000}
    # Production remains fail-closed until a reviewed controller catalog and approval flow exist.
    production-enabled: ${GAMEDAY_WORKER_PRODUCTION_ENABLED:false}

control-plane:
  node-event-port: ${CONTROL_PLANE_NODE_EVENT_PORT:9091}

coordinator:
  instance-id: ${COORDINATOR_INSTANCE_ID:${random.uuid}}
  lease-seconds: ${COORDINATOR_LEASE_SECONDS:30}
  dispatch-lease-seconds: ${COORDINATOR_DISPATCH_LEASE_SECONDS:6}
  dispatch-worker-lease-seconds: ${COORDINATOR_DISPATCH_WORKER_LEASE_SECONDS:3}
  command-dispatch-interval-ms: ${COORDINATOR_COMMAND_DISPATCH_INTERVAL_MS:100}
  command-claim-lease-seconds: ${COORDINATOR_COMMAND_CLAIM_LEASE_SECONDS:30}
  command-api-deadline-seconds: ${COORDINATOR_COMMAND_API_DEADLINE_SECONDS:30}
  command-api-wait-seconds: ${COORDINATOR_COMMAND_API_WAIT_SECONDS:20}

resource-policy:
  decision-interval-ms: ${RESOURCE_POLICY_DECISION_INTERVAL_MS:30000}
  cost-trend-interval-ms: ${RESOURCE_POLICY_COST_TREND_INTERVAL_MS:300000}

browser-density:
  pressure-remediation:
    enabled: ${BROWSER_DENSITY_PRESSURE_REMEDIATION_ENABLED:true}
    interval-ms: ${BROWSER_DENSITY_PRESSURE_REMEDIATION_INTERVAL_MS:1000}
  bootstrap-local-node:
    enabled: ${BROWSER_DENSITY_BOOTSTRAP_LOCAL_NODE:true}
    node-id: ${BROWSER_DENSITY_LOCAL_NODE_ID:node_local}
    heartbeat-ms: ${BROWSER_DENSITY_LOCAL_HEARTBEAT_MS:20000}

grpc:
  tls:
    enabled: ${GRPC_TLS_ENABLED:false}
    ca-certificate: ${GRPC_TLS_CA_CERT:}
    certificate: ${GRPC_TLS_CERT:}
    private-key: ${GRPC_TLS_KEY:}
    node-server-name: ${BROWSER_NODE_TLS_SERVER_NAME:browser-node.internal}

logging:
  level:
    io.browsercloud: ${LOG_LEVEL:INFO}
