  /api/v1/profile-imports:
    get:
      operationId: listProfileImports
      summary: List the current actor's durable Profile Import jobs
      tags: [Profile]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Actor-owned Profile Import jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImportListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: importProfileCheckpoint
      summary: Stream and import a native Profile checkpoint archive
      description: >
        After bounded multipart ingress, the Control Plane forwards archive bytes over
        mTLS and never stores them in PostgreSQL or durable business storage. A
        capability-advertising Browser Node and isolated Storage Helper independently
        verify SHA-256, normalize tenant/Profile identity and commit Object Storage before
        PostgreSQL Profile metadata becomes visible.
      tags: [Profile]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - profileId
                - profileName
                - runtimeBuildId
                - archiveSha256
                - archive
              properties:
                profileId:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{1,128}$"
                profileName:
                  type: string
                  minLength: 1
                  maxLength: 128
                profileDescription:
                  type: string
                  maxLength: 1024
                runtimeBuildId:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{1,128}$"
                archiveSha256:
                  type: string
                  pattern: "^[0-9a-fA-F]{64}$"
                archive:
                  type: string
                  format: binary
            encoding:
              archive:
                contentType: application/zstd, application/octet-stream
      responses:
        "201":
          description: Archive validated and Profile checkpoint committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
