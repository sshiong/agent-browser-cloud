          in: header
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
      x-sse-event-schemas:
        control:
          $ref: "#/components/schemas/EnterpriseOverviewStreamControl"
        change:
          $ref: "#/components/schemas/EnterpriseOverviewStreamChange"
      responses:
        "200":
          description: Resumable Enterprise Overview Server-Sent Event stream.
          content:
            text/event-stream:
              schema:
                type: string
