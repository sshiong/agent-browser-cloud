                $ref: "#/components/schemas/WorkspaceTag"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspace-batch-operations:
    get:
      operationId: listWorkspaceBatchOperations
      summary: List recent tenant Workspace lifecycle batches
      tags: [Groups, Tags, Operation]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Real routed-command and child-operation aggregate state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBatchOperationListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createWorkspaceBatchOperation
      summary: Submit a bounded Group, Tag, or explicit Session lifecycle batch
      description: >
        Creates one durable routed Coordinator command per selected Session. Risky actions
        require an explicit reason and confirmation. The API never mutates browser nodes directly.
      tags: [Groups, Tags, Operation]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceBatchOperationRequest"
      responses:
        "202":
          description: Batch accepted and durably routed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBatchOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/workspace-batch-operations/{batchOperationId}:
    get:
      operationId: getWorkspaceBatchOperation
      summary: Read authoritative batch progress
      tags: [Groups, Tags, Operation]
      parameters:
        - name: batchOperationId
          in: path
          required: true
          schema:
            type: string
            pattern: "^bop_[a-zA-Z0-9]{16,32}$"
      responses:
        "200":
          description: Current aggregate and per-Session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBatchOperation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspace-batch-operations/{batchOperationId}:cancel:
    post:
      operationId: cancelWorkspaceBatchOperation
      summary: Cancel only batch items that have not started
      description: Executing child Operations continue and remain visible in aggregate progress.
      tags: [Groups, Tags, Operation]
      parameters:
        - name: batchOperationId
          in: path
          required: true
          schema:
            type: string
            pattern: "^bop_[a-zA-Z0-9]{16,32}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelWorkspaceBatchOperationRequest"
      responses:
        "200":
          description: Cancellation request recorded and pending items cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBatchOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspace-metadata-batch-operations:
    get:
      operationId: listWorkspaceMetadataBatchOperations
      summary: List recent tenant Group/Tag membership batches
      tags: [Groups, Tags, Operation]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Authoritative PostgreSQL aggregate and per-Session execution state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMetadataBatchOperationListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createWorkspaceMetadataBatchOperation
      summary: Submit a bounded Group or Tag membership mutation batch
      description: >
        Resolves no more than 100 tenant Sessions, persists one crash-recoverable item per
        Session, and executes each assignment with a PostgreSQL lease. A reason and explicit
        confirmation are mandatory. The request never mutates browser nodes.
      tags: [Groups, Tags, Operation]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceMetadataBatchOperationRequest"
      responses:
        "202":
          description: Metadata batch accepted into the durable worker ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMetadataBatchOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/workspace-metadata-batch-operations/{batchOperationId}:
    get:
      operationId: getWorkspaceMetadataBatchOperation
      summary: Read authoritative Group/Tag membership batch progress
      tags: [Groups, Tags, Operation]
      parameters:
        - name: batchOperationId
          in: path
          required: true
          schema:
            type: string
            pattern: "^mbop_[a-zA-Z0-9]{16,32}$"
      responses:
        "200":
          description: Current aggregate and per-Session mutation state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMetadataBatchOperation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/workspace-metadata-batch-operations/{batchOperationId}:cancel:
    post:
      operationId: cancelWorkspaceMetadataBatchOperation
      summary: Cancel Group/Tag mutation items that have not started
      description: Executing items finish atomically; only ACCEPTED items become CANCELLED.
      tags: [Groups, Tags, Operation]
      parameters:
        - name: batchOperationId
          in: path
          required: true
          schema:
            type: string
            pattern: "^mbop_[a-zA-Z0-9]{16,32}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelWorkspaceBatchOperationRequest"
      responses:
        "200":
          description: Cancellation recorded and pending items cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMetadataBatchOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/workspace-settings:
    get:
      operationId: getWorkspaceSettings
      summary: Read effective tenant Workspace defaults
      description: >
        Returns a PostgreSQL Workspace override when one exists, otherwise the
        declared Control Plane system default with source=SYSTEM_DEFAULT.
      tags: [Settings]
      responses:
        "200":
          description: Effective Workspace Settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSettings"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateWorkspaceSettings
      summary: Persist audited defaults for future Sessions
      description: >
        Updates affect only future Session creation. Runtime, region and
        HumanTakeover values are bound at creation and existing Sessions are not rewritten.
      tags: [Settings]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSettingsRequest"
      responses:
        "200":
          description: Persisted Workspace Settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Production authentication. Tenant and actor are derived from validated JWT claims.
  parameters:
    ChallengeEventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        pattern: "^chl_[A-Za-z0-9]{20}$"
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^ses_[a-zA-Z0-9]{16,}$"
    LeaseId:
      name: leaseId
      in: path
      required: true
      schema:
        type: string
        pattern: "^sfl_[a-zA-Z0-9]{16,}$"
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_.-]{1,128}$"
    RecoveryContractApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        pattern: "^ara_[a-zA-Z0-9]{20}$"
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_-]{1,128}$"
    TenantId:
      name: X-Tenant-Id
      in: header
      required: false
      description: Local/Test identity adapter only. Ignored in Production, where tenant identity is derived from the authenticated JWT.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ActorId:
      name: X-Actor-Id
      in: header
      required: false
      description: Optional Local/Test actor identity. Ignored in Production, where actor identity is the JWT subject.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AgentTaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        pattern: "^agt_[a-zA-Z0-9]{16,}$"
    AgentExecutionJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        pattern: "^ajob_[A-Za-z0-9]{20}$"
    AgentReviewJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        pattern: "^rjob_[A-Za-z0-9]{20}$"
    ChallengeVisualJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        pattern: "^cvj_[A-Za-z0-9]{20}$"
    BreakGlassRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        pattern: "^bgr_[a-zA-Z0-9]{20}$"
    SecureDebugSessionId:
      name: debugSessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^dbg_[a-zA-Z0-9]{20}$"
    RuntimeBuildId:
      name: buildId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,128}$"
    RuntimeReleaseId:
      name: releaseId
      in: path
      required: true
      schema:
        type: string
        pattern: "^rel_[A-Za-z0-9]{20}$"
    KeyRotationId:
      name: rotationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^rot_[A-Za-z0-9]{20}$"
    ValidationId:
      name: validationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^val_[A-Za-z0-9]{20}$"
    RegionId:
      name: regionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9-]{1,32}$"
    GameDayId:
      name: gameDayId
      in: path
      required: true
      schema:
        type: string
        pattern: "^gameday_[A-Za-z0-9]{20}$"
  schemas:
    WorkspaceOverview:
      type: object
      additionalProperties: false
      required:
        - sessions
        - operations
        - browserNodes
        - proxies
        - agents
        - cost
        - security
        - cursor
        - generatedAt
      properties:
        sessions:
          $ref: "#/components/schemas/WorkspaceSessionSummary"
        operations:
          $ref: "#/components/schemas/WorkspaceOperationSummary"
        browserNodes:
          $ref: "#/components/schemas/WorkspaceBrowserNodeSummary"
        proxies:
          $ref: "#/components/schemas/WorkspaceProxySummary"
        agents:
          $ref: "#/components/schemas/WorkspaceAgentSummary"
        cost:
          $ref: "#/components/schemas/WorkspaceCostSummary"
        security:
          $ref: "#/components/schemas/WorkspaceSecuritySummary"
        cursor:
          type: integer
          format: int64
          minimum: 0
        generatedAt:
          type: string
          format: date-time
    WorkspaceSessionSummary:
      type: object
      additionalProperties: false
      required: [total, running, pending, unhealthy, hibernated, terminated]
      properties:
        total: {type: integer, format: int64, minimum: 0}
        running: {type: integer, format: int64, minimum: 0}
        pending: {type: integer, format: int64, minimum: 0}
        unhealthy: {type: integer, format: int64, minimum: 0}
        hibernated: {type: integer, format: int64, minimum: 0}
        terminated: {type: integer, format: int64, minimum: 0}
    WorkspaceOperationSummary:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active: {type: integer, format: int64, minimum: 0}
    WorkspaceBrowserNodeSummary:
      type: object
      additionalProperties: false
      required:
        - visible
        - total
        - ready
        - constrained
        - activeSessions
        - maximumSessions
        - reservedCpuMillis
        - certifiedCpuMillis
        - reservedMemoryMib
        - certifiedMemoryMib
      properties:
        visible:
          type: boolean
          description: True only when the caller may inspect platform-wide Node capacity.
        total: {type: integer, format: int64, minimum: 0}
        ready: {type: integer, format: int64, minimum: 0}
        constrained: {type: integer, format: int64, minimum: 0}
        activeSessions: {type: integer, format: int64, minimum: 0}
        maximumSessions: {type: integer, format: int64, minimum: 0}
        reservedCpuMillis: {type: integer, format: int64, minimum: 0}
        certifiedCpuMillis: {type: integer, format: int64, minimum: 0}
        reservedMemoryMib: {type: integer, format: int64, minimum: 0}
        certifiedMemoryMib: {type: integer, format: int64, minimum: 0}
    WorkspaceProxySummary:
      type: object
      additionalProperties: false
      required: [activeAllocations, boundSessions]
      properties:
        activeAllocations: {type: integer, format: int64, minimum: 0}
        boundSessions: {type: integer, format: int64, minimum: 0}
    WorkspaceAgentSummary:
      type: object
      additionalProperties: false
      required: [active, awaitingHuman, pausedByResourcePolicy, failedLast24Hours]
      properties:
        active: {type: integer, format: int64, minimum: 0}
        awaitingHuman: {type: integer, format: int64, minimum: 0}
        pausedByResourcePolicy: {type: integer, format: int64, minimum: 0}
        failedLast24Hours: {type: integer, format: int64, minimum: 0}
    WorkspaceCostSummary:
      type: object
      additionalProperties: false
      required: [currentHourlyUsd, activeSessionsWithoutCurrentPrice]
      properties:
        currentHourlyUsd: {type: number, format: double, minimum: 0}
        activeSessionsWithoutCurrentPrice:
          type: integer
          format: int64
          minimum: 0
    WorkspaceSecuritySummary:
      type: object
      additionalProperties: false
      required: [warningLast24Hours, criticalLast24Hours]
      properties:
        warningLast24Hours: {type: integer, format: int64, minimum: 0}
        criticalLast24Hours: {type: integer, format: int64, minimum: 0}
    SearchResourceType:
      type: string
      enum: [SESSION, PROFILE, GROUP, TAG, RUNTIME, NODE]
    GlobalSearchResult:
      type: object
      additionalProperties: false
      required:
        - resourceType
        - resourceId
        - title
        - description
        - status
        - region
        - updatedAt
      properties:
        resourceType:
          $ref: "#/components/schemas/SearchResourceType"
        resourceId:
          type: string
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          type: [string, "null"]
        region:
          type: [string, "null"]
        updatedAt:
          type: [string, "null"]
          format: date-time
    GlobalSearchResponse:
      type: object
      additionalProperties: false
      required: [query, items, limit, truncated]
      properties:
        query:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/GlobalSearchResult"
        limit:
          type: integer
        truncated:
          type: boolean
    NotificationCategory:
      type: string
      enum: [SECURITY, RESOURCE, AGENT, RELEASE, SYSTEM]
    NotificationSeverity:
      type: string
      enum: [INFO, WARNING, CRITICAL]
    WorkspaceNotification:
      type: object
      additionalProperties: false
      required:
        - notificationId
        - sequence
        - category
        - severity
        - title
        - body
        - eventType
        - sessionId
        - resourceType
        - resourceId
        - requestId
        - route
        - read
        - occurredAt
      properties:
        notificationId:
          type: string
          pattern: "^ntf_[a-zA-Z0-9]{20}$"
        sequence:
          type: integer
          format: int64
          minimum: 1
        category:
          $ref: "#/components/schemas/NotificationCategory"
        severity:
          $ref: "#/components/schemas/NotificationSeverity"
        title:
          type: string
        body:
          type: string
        eventType:
          type: string
        sessionId:
          type: [string, "null"]
        resourceType:
          type: [string, "null"]
        resourceId:
          type: [string, "null"]
        requestId:
          type: [string, "null"]
        route:
          type: string
        read:
          type: boolean
        occurredAt:
          type: string
          format: date-time
    WorkspaceNotificationListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - unreadCount
        - lastReadSequence
        - headSequence
        - nextBeforeSequence
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceNotification"
        unreadCount:
          type: integer
          format: int64
          minimum: 0
        lastReadSequence:
          type: integer
          format: int64
          minimum: 0
        headSequence:
          type: integer
          format: int64
          minimum: 0
        nextBeforeSequence:
          type: [integer, "null"]
          format: int64
          minimum: 1
    UpdateNotificationReadCursorRequest:
      type: object
      additionalProperties: false
      required: [readThroughSequence]
      properties:
        readThroughSequence:
          type: integer
          format: int64
          minimum: 0
    WorkspaceNotificationReadState:
      type: object
      additionalProperties: false
      required: [lastReadSequence, unreadCount, updatedAt]
      properties:
        lastReadSequence:
          type: integer
          format: int64
          minimum: 0
        unreadCount:
          type: integer
          format: int64
          minimum: 0
        updatedAt:
          type: string
          format: date-time
    ThemeMode:
      type: string
      enum: [SYSTEM, DARK, LIGHT]
    UpdateUserPreferencesRequest:
      type: object
      additionalProperties: false
      required: [themeMode]
      properties:
        themeMode:
          $ref: "#/components/schemas/ThemeMode"
    UserPreferences:
      type: object
      additionalProperties: false
      required: [themeMode, source, updatedAt, version]
      properties:
        themeMode:
          $ref: "#/components/schemas/ThemeMode"
        source:
          type: string
          enum: [SYSTEM_DEFAULT, USER_OVERRIDE]
        updatedAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
    TenantRoute:
      type: object
      additionalProperties: false
      required:
        [tenantId, state, activeVirtualPartitions, activeRouteEpoch, version, updatedAt]
      properties:
        tenantId:
          type: string
        state:
          type: string
          enum: [STABLE, MIGRATING]
        activeVirtualPartitions:
          type: integer
          minimum: 1
          maximum: 256
        activeRouteEpoch:
          type: integer
          format: int64
          minimum: 1
        pendingVirtualPartitions:
          type: [integer, "null"]
          minimum: 1
          maximum: 256
        pendingRouteEpoch:
          type: [integer, "null"]
          format: int64
          minimum: 1
        activeMigrationId:
          type: [string, "null"]
        version:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    RequestTenantRouteMigration:
      type: object
      additionalProperties: false
      required: [expectedRouteEpoch, targetVirtualPartitions]
      properties:
        expectedRouteEpoch:
          type: integer
          format: int64
          minimum: 1
        targetVirtualPartitions:
          type: integer
          minimum: 1
          maximum: 256
    TenantRouteMigration:
      type: object
      additionalProperties: false
      required:
        - migrationId
        - tenantId
        - sourceRouteEpoch
        - targetRouteEpoch
        - sourceVirtualPartitions
        - targetVirtualPartitions
        - state
        - totalSessions
        - migratedSessions
        - blockedSessions
        - requestedBy
        - requestId
        - createdAt
        - updatedAt
      properties:
        migrationId:
          type: string
        tenantId:
          type: string
        sourceRouteEpoch:
          type: integer
          format: int64
          minimum: 1
        targetRouteEpoch:
          type: integer
          format: int64
          minimum: 2
        sourceVirtualPartitions:
          type: integer
          minimum: 1
          maximum: 256
        targetVirtualPartitions:
          type: integer
          minimum: 1
          maximum: 256
        state:
          type: string
          enum: [MIGRATING, COMMITTED, FAILED]
        totalSessions:
          type: integer
          minimum: 0
        migratedSessions:
          type: integer
          minimum: 0
        blockedSessions:
          type: integer
          minimum: 0
        requestedBy:
          type: string
        requestId:
          type: string
        failureCode:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
    CreateAgentTaskRequest:
      type: object
      additionalProperties: false
      required: [goal, allowedDomains]
      properties:
        goal:
          type: string
          minLength: 1
          maxLength: 2000
        startUrl:
          type: string
          maxLength: 2048
        allowedDomains:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 253
            pattern: "^[A-Za-z0-9.-]+$"
        maxActions:
          type: integer
          minimum: 1
          maximum: 23
        replanBudget:
          type: integer
          minimum: 0
          maximum: 3
        contextSources:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AgentInstructionSource"
        actions:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/AgentActionRequest"
    AgentActionRequest:
      type: object
      additionalProperties: false
      required: [toolId]
      properties:
        toolId:
          type: string
          enum:
            - CLICK_TARGET
            - DOUBLE_CLICK_TARGET
            - RIGHT_CLICK_TARGET
            - HOVER_TARGET
            - CLEAR_TARGET
            - CHECK_TARGET
            - UNCHECK_TARGET
            - TYPE_TEXT
            - FILL
            - PASTE_AGENT_CLIPBOARD
            - SCROLL
            - WAIT_FOR
            - OPEN_TAB
            - SWITCH_TAB
            - CLOSE_TAB
            - ACCEPT_DIALOG
            - DISMISS_DIALOG
            - PRESS_KEY
            - SELECT_OPTION
            - DRAG_TARGET
            - DROP_TARGET
            - SWIPE_TARGET
            - MOUSE_MOVE
            - MOUSE_DOWN
            - MOUSE_UP
            - MOUSE_WHEEL
            - KEY_DOWN
            - KEY_UP
            - TOUCH_START
            - TOUCH_MOVE
            - TOUCH_END
            - EXECUTE_ACTIONS
            - REQUEST_HUMAN_TAKEOVER
        targetRef:
          type: string
          maxLength: 128
        targetRevision:
          type: integer
          format: int64
          minimum: 1
        value:
          type: string
          maxLength: 2000
          writeOnly: true
        secretId:
          type: string
          pattern: "^ais_[A-Za-z0-9]{20,32}$"
          description: One-time encrypted input reference. AUTONOMOUS mode and CREDENTIAL or OTP dataClass are required.
        dataClass:
          type: string
          enum: [PUBLIC, PII, CREDENTIAL, OTP]
        scrollDeltaY:
          type: integer
          minimum: -2000
          maximum: 2000
