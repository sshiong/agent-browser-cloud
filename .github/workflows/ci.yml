name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web-console/pnpm-lock.yaml

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.0"

      - name: Install frontend dependencies
        run: pnpm --dir apps/web-console install --frozen-lockfile

      - name: Check protobuf compatibility
        if: github.event_name == 'pull_request'
        working-directory: packages/contracts
        run: buf breaking --against "../../.git#commit=${{ github.event.pull_request.base.sha }},subdir=packages/contracts"

      - name: Verify
        run: make ci

      - name: Build
        run: make build

      - name: Integration smoke test
        run: make test-integration
